<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:#0b0d12;color:#fff}
header{padding:18px 22px;background:#0f1219;border-bottom:1px solid #1d2230;display:flex;justify-content:space-between}
button{background:#ef4444;border:none;color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.container{padding:22px}
.card{background:#121726;border:1px solid #1d2230;border-radius:16px;padding:18px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #1d2230;text-align:left}
th{color:#6cf}
</style>
</head>

<body>

<header>
  <strong>🛡️ Admin Dashboard</strong>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">
  <div class="card">
    <h3>Producers</h3>
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Beats</th>
          <th>Followers</th>
        </tr>
      </thead>
      <tbody id="producerTable"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔒 ADMIN GUARD */
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "login.html";

  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists() || snap.data().role !== "admin") {
    alert("Access denied");
    return location.href = "login.html";
  }

  loadProducers();
});

/* LOAD PRODUCERS */
async function loadProducers() {
  const table = document.getElementById("producerTable");
  table.innerHTML = "";

  const producersSnap = await getDocs(collection(db, "producers"));
  producersSnap.forEach(docSnap => {
    const p = docSnap.data();
    table.innerHTML += `
      <tr>
        <td>${p.email}</td>
        <td>${p.beatsCount || 0}</td>
        <td>${p.followers || 0}</td>
      </tr>
    `;
  });
}

/* LOGOUT */
window.logout = () => {
  signOut(auth).then(() => location.href = "login.html");
};
</script>

</body>
</html>
