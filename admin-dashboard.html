<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="dark">

<header class="topbar">
  <h2>🛡️ Admin Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<section class="stats">
  <div class="card">
    <h3>Total Revenue</h3>
    <p id="totalRevenue">$0</p>
  </div>

  <div class="card">
    <h3>Total Orders</h3>
    <p id="totalOrders">0</p>
  </div>

  <div class="card">
    <h3>Total Beats Sold</h3>
    <p id="totalBeats">0</p>
  </div>
</section>

<section class="table">
  <h3>Top Producers</h3>
  <table>
    <thead>
      <tr>
        <th>Producer</th>
        <th>Sales</th>
        <th>Revenue</th>
      </tr>
    </thead>
    <tbody id="producersTable"></tbody>
  </table>
</section>

<script type="module" src="admin-analytics.js"></script>
<script type="module" src="auth-ui.js"></script>

</body>
</html>
