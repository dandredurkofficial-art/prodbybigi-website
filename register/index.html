<head>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

    "url": "https://audiory.site/register/",
    "description": "Create an Audiory account as a buyer or producer."

  <link rel="stylesheet" href="/css/mobile-fix.css">
  
  <style>
    /* Global Background - Matching Login Light UI */
    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 40px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      position: relative;
      box-sizing: border-box;
    }

    /* Elegant Gradient Top Area Banner */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 380px;
      background: linear-gradient(135deg, #3b2fad 0%, #1d1b84 50%, #111440 100%);
      z-index: -1;
    }

    /* Absolute positioned Brand Logo Header (Top Left) */
    .brand-header {
      position: absolute;
      top: 28px;
      left: 36px;
      z-index: 10;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo svg {
      height: 38px;
      width: auto;
      display: block;
    }

    /* Container matching the Login Card layout */
    .auth-box {
      background: #ffffff;
      max-width: 450px;
      width: 100%;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
      margin-top: 60px;
    }

    .auth-box h2 {
      color: #1e293b;
      font-size: 28px;
      font-weight: 800;
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-sub {
      text-align: center;
      margin: 0 0 24px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label, .role-title {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }

    /* Input wrapper matching light UI exactly */
    .auth-input {
      width: 100%;
      height: 56px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      overflow: hidden;
      padding-right: 6px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .auth-input:focus-within {
      border-color: #5533ff;
      box-shadow: 0 0 0 3px rgba(85, 51, 255, 0.15);
    }

    .auth-input-main {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      min-width: 0;
      height: 100%;
      box-sizing: border-box;
    }

    .auth-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      flex: 0 0 auto;
    }

    .auth-icon svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .auth-divider {
      width: 1px;
      height: 24px;
      background: #e2e8f0;
      flex: 0 0 auto;
    }

    .auth-input input {
      flex: 1;
      min-width: 0;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #1e293b;
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .auth-input input::placeholder {
      color: #94a3b8;
      opacity: 1;
    }

    /* Password Eye Button */
    .auth-eye-btn {
      width: 44px;
      min-width: 44px;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: #f1f5f9;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      margin: 0;
      flex: 0 0 44px;
      box-sizing: border-box;
      align-self: center;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .auth-eye-btn:hover {
      background: #e2e8f0;
      color: #334155;
    }

    .auth-eye-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    /* Account Type Radio Cards - Clean light styling */
    .role-wrap {
      margin-bottom: 20px;
    }

    .role {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .role-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
      box-sizing: border-box;
      transition: border-color 0.2s ease, background-color 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .role-card:hover {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    .role-card.selected {
      border-color: #5533ff;
      background: rgba(85, 51, 255, 0.03);
    }

    .role-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .role-radio {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 22px;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }

    .role-card.selected .role-radio {
      border-color: #5533ff;
    }

    .role-radio::after {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: transparent;
      transition: background-color 0.2s ease;
    }

    .role-card.selected .role-radio::after {
      background: #5533ff;
    }

    .role-icon {
      width: 24px;
      height: 24px;
      color: #64748b;
      flex: 0 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .role-card.selected .role-icon {
      color: #5533ff;
    }

    .role-icon svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .role-copy {
      min-width: 0;
      flex: 1;
    }

    .role-name {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.2;
    }

    .role-desc {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.35;
    }

    /* Terms & Agreement Callout Box */
    .agree-box {
      margin-top: 4px;
      margin-bottom: 20px;
    }

    .agree-card {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      box-sizing: border-box;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .agree-card input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .agree-check {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      flex: 0 0 20px;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .agree-card.checked .agree-check {
      border-color: #5533ff;
      background: #5533ff;
    }

    .agree-check::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: transparent;
      transition: background-color 0.2s ease;
    }

    .agree-card.checked .agree-check::after {
      background: #ffffff;
    }

    .agree-text {
      font-size: 14px;
      line-height: 1.5;
      color: #475569;
    }

    .agree-text a {
      color: #5533ff;
      font-weight: 700;
      text-decoration: none;
    }

    .agree-text a:hover {
      text-decoration: underline;
    }

    /* Primary Action & Secondary Buttons styling */
    button#createBtn {
      width: 100%;
      height: 52px;
      background: #5533ff;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button#createBtn:hover {
      background: #4422ee;
    }

    button#createBtn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid #cbd5e1;
      color: #475569;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .btn-secondary:hover {
      background: #f1f5f9;
      color: #1e293b;
    }

    p {
      color: #64748b;
      font-size: 15px;
    }

    p a {
      color: #5533ff;
      font-weight: 700;
      text-decoration: none;
    }

    p a:hover {
      text-decoration: underline;
    }

    .muted {
      color: #64748b;
      font-size: 15px;
    }

    #status {
      margin-top: 12px;
      text-align: center;
      color: #ef4444;
      font-size: 14px;
      font-weight: 600;
      min-height: 18px;
    }

    @media (max-width: 480px) {
      body::before {
        height: 260px;
      }
      .brand-header {
        position: relative;
        top: auto;
        left: auto;
        margin-top: 16px;
        margin-bottom: 16px;
      }
      .auth-box {
        padding: 24px 20px;
        margin-top: 0;
      }
      .auth-input {
        height: 52px;
      }
      .auth-eye-btn {
        width: 40px;
        min-width: 40px;
        height: 40px;
        flex: 0 0 40px;
      }
    }
  </style>
</head>

<body>

  <header class="brand-header">
    <a href="/" class="brand-logo" aria-label="Audiory Home">
      <svg viewBox="0 0 180 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(2, 4)">
          <circle cx="18" cy="18" r="17" stroke="white" stroke-width="2.5" />
          <circle cx="18" cy="18" r="11" stroke="white" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
          <path d="M18 7L25 26H21.5L18 16L14.5 26H11L18 7Z" fill="white"/>
          <circle cx="18" cy="13" r="1.5" fill="#5533ff" />
          <path d="M13.5 20H22.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <text x="46" y="29" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">audiory</text>
      </svg>
    </a>
  </header>

  <div class="auth-box">
    <h2>Create Account</h2>
    <p class="auth-sub">Join Audiory to buy beats, download free beats, or start selling your beats online.</p>

    <div class="field">
      <label for="email">Email</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18v12H3z"></path>
              <path d="M3 7l9 7 9-7"></path>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="email" type="email" placeholder="Enter Email" autocomplete="email" />
        </div>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8.5" cy="10.5" r="3.25"></circle>
              <path d="M11.5 10.5H21"></path>
              <path d="M18 10.5v3"></path>
              <path d="M15.5 10.5v2"></path>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="password" type="password" placeholder="Enter password" autocomplete="new-password" />
        </div>

        <button class="auth-eye-btn" id="pwToggle" type="button" aria-label="Show password">
          <svg id="pwEyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="pwEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
            <path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2"></path>
            <path d="M6.2 6.3C3.7 8 2 12 2 12a17.8 17.8 0 0 0 5.4 5.1"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="role-wrap">
      <label class="role-title">Account Type</label>

      <div class="role">
        <label class="role-card">
          <input type="radio" name="role" value="buyer" />
          <span class="role-radio"></span>

          <span class="role-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>

          <span class="role-copy">
            <span class="role-name">Buyer</span>
            <span class="role-desc">Purchase beats for your projects</span>
          </span>
        </label>

        <label class="role-card">
          <input type="radio" name="role" value="producer" />
          <span class="role-radio"></span>

          <span class="role-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M19 8v6"></path>
              <path d="M22 11h-6"></path>
            </svg>
          </span>

          <span class="role-copy">
            <span class="role-name">Producer</span>
            <span class="role-desc">Upload and sell your beats</span>
          </span>
        </label>
      </div>
    </div>

    <div class="agree-box">
      <label class="agree-card" id="agreeCard">
        <input type="checkbox" id="agreeTerms" />
        <span class="agree-check"></span>
        <span class="agree-text">
          I agree to the
          <a href="/terms/" target="_blank" rel="noopener noreferrer">Terms of Service</a>
          and
          <a href="/privacy/" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
        </span>
      </label>
    </div>

    <button id="createBtn" type="button">Create Account</button>
    <button class="btn-secondary" id="googleBtn" type="button" style="display:none;">Sign up with Google</button>

    <div id="status"></div>

    <p style="margin-top:20px; text-align: center;" class="muted">
      Already have an account?
      <a href="/login/">Login</a>
    </p>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script>
    (function(){
      const cards = Array.from(document.querySelectorAll(".role-card"));
      const radios = Array.from(document.querySelectorAll(".role-card input[type='radio']"));

      function syncRoles(){
        cards.forEach(card => card.classList.remove("selected"));
        const checked = radios.find(r => r.checked);
        if (!checked) return;
        checked.closest(".role-card")?.classList.add("selected");
      }

      radios.forEach(r => r.addEventListener("change", syncRoles));
      cards.forEach(card => card.addEventListener("click", syncRoles));
      syncRoles();
    })();

    (function(){
      const agree = document.getElementById("agreeTerms");
      const card = document.getElementById("agreeCard");

      if (!agree || !card) return;

      function syncAgree(){
        card.classList.toggle("checked", !!agree.checked);
      }

      agree.addEventListener("change", syncAgree);
      card.addEventListener("click", () => {
        setTimeout(syncAgree, 0);
      });

      syncAgree();
    })();
    
    document.getElementById("createBtn")?.addEventListener("click", async ()=>{
      const agreed = document.getElementById("agreeTerms")?.checked;
      const status = document.getElementById("status");
      const btn = document.getElementById("createBtn");

      if (!agreed){
        if (status) status.textContent = "Please agree to the Terms of Service and Privacy Policy.";
        return;
      }

      try{
        if (status) status.textContent = "";
        if (btn){
          btn.disabled = true;
          btn.textContent = "Creating Account...";
        }

        await window.registerUser?.();
      } catch (e){
        console.error(e);
      } finally {
        if (btn){
          btn.disabled = false;
          btn.textContent = "Create Account";
        }
      }
    });

    (function(){
      const pw = document.getElementById("password");
      const btn = document.getElementById("pwToggle");
      const eyeOpen = document.getElementById("pwEyeOpen");
      const eyeOff = document.getElementById("pwEyeOff");

      if(!pw || !btn) return;

      btn.addEventListener("click", ()=>{
        const showing = pw.type === "text";
        pw.type = showing ? "password" : "text";
        if (eyeOpen) eyeOpen.style.display = showing ? "" : "none";
        if (eyeOff) eyeOff.style.display = showing ? "none" : "";
      });
    })();
  </script>
</body>
