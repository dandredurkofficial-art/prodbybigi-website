<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      background:#0b0d12;
      color:#fff;
      font-family:Inter;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      padding:16px;
      box-sizing:border-box;
    }
    .card{
      background:#121726;
      padding:30px;
      border-radius:16px;
      width:100%;
      max-width:420px;
      border:1px solid #1d2230;
      box-sizing:border-box;
    }
    h2{text-align:center;margin-bottom:18px}

    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #1d2230;
      background:#0f1219;
      color:#fff;
      margin-bottom:14px;
      box-sizing:border-box;
      outline:none;
    }

    /* ✅ NEW auth field style */
    .field{
      margin-bottom:18px;
    }
    .field label{
      display:block;
      font-size:15px;
      font-weight:700;
      color:#fff;
      margin-bottom:10px;
    }
    .input-shell{
      display:flex;
      align-items:center;
      width:100%;
      min-height:88px;
      border-radius:20px;
      border:1px solid #2a3150;
      background:#0a0f22;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
      overflow:hidden;
      box-sizing:border-box;
    }
    .input-main{
      flex:1;
      display:flex;
      align-items:center;
      gap:14px;
      padding:0 18px;
      min-height:88px;
      box-sizing:border-box;
    }
    .field-icon{
      width:24px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#8d92b8;
      flex:0 0 auto;
    }
    .divider{
      width:1px;
      height:28px;
      background:rgba(255,255,255,.20);
      flex:0 0 auto;
    }
    .input-shell input{
      margin:0;
      border:none;
      background:transparent;
      color:#fff;
      font-size:17px;
      font-weight:600;
      padding:0;
      width:100%;
      outline:none;
    }
    .input-shell input::placeholder{
      color:#8d92b8;
      opacity:1;
    }
    .pw-action{
      width:90px;
      min-height:88px;
      border:none;
      border-left:1px solid rgba(255,255,255,.06);
      background:#2b3050;
      color:#b7bddf;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
      flex:0 0 90px;
    }

    .role{ display:flex; gap:14px; margin-bottom:18px; }
    .role label{
      flex:1;
      background:#0f1219;
      padding:12px;
      border-radius:10px;
      border:1px solid #1d2230;
      cursor:pointer;
      text-align:center;

      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;

      user-select:none;
      -webkit-tap-highlight-color: transparent;
      box-sizing:border-box;
      min-height:48px;
    }
    .role label input[type="radio"]{
      margin:0;
      flex:0 0 auto;
      width:18px;
      height:18px;
      accent-color:#6cf;
    }
    .role label.selected{
      border-color:#6cf;
      box-shadow:0 0 0 2px rgba(102,204,255,.22);
      background:#0b1220;
    }

    button{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      background:#6cf;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }
    .btn-secondary{
      background:#111827;
      border:1px solid #1d2230;
      color:#fff;
    }
    a{color:#6cf;text-decoration:none}
    .muted{color:#9ca3af;font-size:13px;margin-top:10px;text-align:center}
    #status{ margin-top:10px; text-align:center; color:#9ca3af; font-size:13px; min-height:18px; }

    @media (max-width: 420px){
      .role{flex-direction:column}
      .input-shell{
        min-height:74px;
        border-radius:18px;
      }
      .input-main{
        min-height:74px;
        gap:12px;
        padding:0 14px;
      }
      .pw-action{
        min-height:74px;
        flex-basis:78px;
        width:78px;
        font-size:15px;
      }
      .input-shell input{
        font-size:16px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Create Account</h2>

    <div class="field">
      <label for="email">Email</label>
      <div class="input-shell">
        <div class="input-main">
          <div class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M20 6H4c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 2v.01L12 13 4 8.01V8h16zM4 16V10.5l7.4 4.62a1 1 0 0 0 1.2 0L20 10.5V16H4z"/>
            </svg>
          </div>
          <div class="divider"></div>
          <input id="email" type="email" placeholder="Enter Email" autocomplete="email" />
        </div>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-shell">
        <div class="input-main">
          <div class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M7 14a5 5 0 1 1 9.9 1H21a1 1 0 0 1 1 1v2h-2v2h-2v2h-3v-3.1A5 5 0 0 1 7 14zm5-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </div>
          <div class="divider"></div>
          <input id="password" type="password" placeholder="Enter password" autocomplete="new-password" />
        </div>
        <button class="pw-action" id="pwToggle" type="button" aria-label="Show password">
          <svg id="pwIcon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
            <path d="M12 5c5.5 0 9.7 4.1 11 6.5C21.7 13.9 17.5 18 12 18S2.3 13.9 1 11.5C2.3 9.1 6.5 5 12 5zm0 2C8 7 4.8 9.7 3.2 11.5 4.8 13.3 8 16 12 16s7.2-2.7 8.8-4.5C19.2 9.7 16 7 12 7zm0 2.5A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="role">
      <label><input type="radio" name="role" value="producer"> Producer</label>
      <label><input type="radio" name="role" value="buyer"> Buyer</label>
    </div>

    <button id="createBtn" type="button">Create Account</button>
    <button class="btn-secondary" id="googleBtn" type="button">Sign up with Google</button>

    <div id="status"></div>

    <p class="muted">
      Already have an account?
      <a href="/login/">Login</a>
    </p>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script>
    (function(){
      const labels = Array.from(document.querySelectorAll(".role label"));
      const radios = Array.from(document.querySelectorAll(".role input[type='radio']"));
      function sync(){
        labels.forEach(l => l.classList.remove("selected"));
        const checked = radios.find(r => r.checked);
        if (!checked) return;
        checked.closest("label")?.classList.add("selected");
      }
      radios.forEach(r => r.addEventListener("change", sync));
      labels.forEach(l => l.addEventListener("click", sync));
      sync();
    })();

    document.getElementById("createBtn")?.addEventListener("click", ()=> window.registerUser?.());
    document.getElementById("googleBtn")?.addEventListener("click", ()=> window.googleRegister?.());

    (function(){
      const pw = document.getElementById("password");
      const btn = document.getElementById("pwToggle");
      const icon = document.getElementById("pwIcon");
      if(!pw || !btn || !icon) return;

      btn.addEventListener("click", ()=>{
        const showing = pw.type === "text";
        pw.type = showing ? "password" : "text";

        icon.innerHTML = showing
          ? `<path d="M12 5c5.5 0 9.7 4.1 11 6.5C21.7 13.9 17.5 18 12 18S2.3 13.9 1 11.5C2.3 9.1 6.5 5 12 5zm0 2C8 7 4.8 9.7 3.2 11.5 4.8 13.3 8 16 12 16s7.2-2.7 8.8-4.5C19.2 9.7 16 7 12 7zm0 2.5A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5z"/>`
          : `<path d="M2.3 1 1 2.3l3.1 3.1C2.8 6.5 1.7 7.8 1 9c1.3 2.4 5.5 6.5 11 6.5 2 0 3.8-.5 5.3-1.2l3.4 3.4 1.3-1.3L2.3 1zM12 13.5A2.5 2.5 0 0 1 9.5 11c0-.4.1-.8.3-1.2l3.4 3.4c-.4.2-.8.3-1.2.3zm0-8.5c5.5 0 9.7 4.1 11 6.5-.7 1.2-1.8 2.5-3.1 3.6l-2-2A5 5 0 0 0 10.9 6l-1.6-1.6c.9-.2 1.8-.4 2.7-.4z"/>`;
      });
    })();
  </script>

</body>
</html>
