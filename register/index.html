<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      background:#0b0d12;
      color:#fff;
      font-family:Inter;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:16px;
      box-sizing:border-box;
    }
    .card{
      background:#121726;
      padding:30px;
      border-radius:16px;
      width:100%;
      max-width:420px;
      border:1px solid #1d2230;
      box-sizing:border-box;
    }
    h2{text-align:center;margin-bottom:18px}

    .field{ margin-bottom:18px; }
    .field label{
      display:block;
      font-size:16px;
      font-weight:800;
      color:#fff;
      margin-bottom:12px;
    }

    .auth-input{
      width:100%;
      height:74px;
      border-radius:20px;
      border:1px solid #2b3152;
      background:#05091b;
      display:flex;
      align-items:center;
      box-sizing:border-box;
      overflow:hidden;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.03),
        0 0 0 1px rgba(104,119,255,.04);
    }

    .auth-input-main{
      flex:1;
      display:flex;
      align-items:center;
      gap:14px;
      padding:0 18px;
      min-width:0;
      height:100%;
    }

    .auth-icon{
      width:24px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9da3d9;
      flex:0 0 auto;
    }

    .auth-icon svg{
      width:24px;
      height:24px;
    }

    .auth-divider{
      width:1px;
      height:32px;
      background:rgba(255,255,255,.22);
      flex:0 0 auto;
    }

    .auth-input input{
      flex:1;
      min-width:0;
      height:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:15px;
      font-weight:700;
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    .auth-input input::placeholder{
      color:#8f95c8;
      opacity:1;
    }

    .auth-eye-btn{
      width:72px;
      min-width:72px;
      height:58px;
      margin-right:8px;
      border:none;
      border-radius:16px;
      background:#31365a;
      color:#b9bee8;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
      flex:0 0 72px;
    }

    .auth-eye-btn svg{
      width:26px;
      height:26px;
    }

    .role{ display:flex; gap:14px; margin-bottom:18px; }
    .role label{
      flex:1;
      background:#0f1219;
      padding:12px;
      border-radius:10px;
      border:1px solid #1d2230;
      cursor:pointer;
      text-align:center;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      box-sizing:border-box;
      min-height:48px;
    }
    .role label input[type="radio"]{
      margin:0;
      flex:0 0 auto;
      width:18px;
      height:18px;
      accent-color:#6cf;
    }
    .role label.selected{
      border-color:#6cf;
      box-shadow:0 0 0 2px rgba(102,204,255,.22);
      background:#0b1220;
    }

    button{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      background:#6cf;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }
    .btn-secondary{
      background:#111827;
      border:1px solid #1d2230;
      color:#fff;
    }
    a{color:#6cf;text-decoration:none}
    .muted{color:#9ca3af;font-size:13px;margin-top:10px;text-align:center}
    #status{ margin-top:10px; text-align:center; color:#9ca3af; font-size:13px; min-height:18px; }

    @media (max-width: 480px){
      .auth-input{
        height:70px;
        border-radius:18px;
      }

      .auth-input-main{
        gap:12px;
        padding:0 16px;
      }

      .auth-icon{
        width:22px;
        height:22px;
      }

      .auth-icon svg{
        width:22px;
        height:22px;
      }

      .auth-divider{
        height:30px;
      }

      .auth-input input{
        font-size:14px;
      }

      .auth-eye-btn{
        width:64px;
        min-width:64px;
        height:52px;
        flex:0 0 64px;
        margin-right:8px;
        border-radius:14px;
      }

      .auth-eye-btn svg{
        width:24px;
        height:24px;
      }
    }

    @media (max-width: 420px){ .role{flex-direction:column} }
  </style>
</head>

<body>
  <div class="card">
    <h2>Create Account</h2>

    <div class="field">
      <label for="email">Email</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18v12H3z"></path>
              <path d="M3 7l9 7 9-7"></path>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="email" type="email" placeholder="Enter Email" autocomplete="email" />
        </div>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8.5" cy="10.5" r="3.25"></circle>
              <path d="M11.5 10.5H21"></path>
              <path d="M18 10.5v3"></path>
              <path d="M15.5 10.5v2"></path>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="password" type="password" placeholder="Enter password" autocomplete="new-password" />
        </div>
        <button class="auth-eye-btn" id="pwToggle" type="button" aria-label="Show password">
          <svg id="pwEyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="pwEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
            <path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2"></path>
            <path d="M6.2 6.3C3.7 8 2 12 2 12a17.8 17.8 0 0 0 5.4 5.1"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="role">
      <label><input type="radio" name="role" value="producer"> Producer</label>
      <label><input type="radio" name="role" value="buyer"> Buyer</label>
    </div>

    <button id="createBtn" type="button">Create Account</button>
    <button class="btn-secondary" id="googleBtn" type="button">Sign up with Google</button>

    <div id="status"></div>

    <p class="muted">
      Already have an account?
      <a href="/login/">Login</a>
    </p>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script>
    (function(){
      const labels = Array.from(document.querySelectorAll(".role label"));
      const radios = Array.from(document.querySelectorAll(".role input[type='radio']"));
      function sync(){
        labels.forEach(l => l.classList.remove("selected"));
        const checked = radios.find(r => r.checked);
        if (!checked) return;
        checked.closest("label")?.classList.add("selected");
      }
      radios.forEach(r => r.addEventListener("change", sync));
      labels.forEach(l => l.addEventListener("click", sync));
      sync();
    })();

    document.getElementById("createBtn")?.addEventListener("click", ()=> window.registerUser?.());
    document.getElementById("googleBtn")?.addEventListener("click", ()=> window.googleRegister?.());

    (function(){
      const pw = document.getElementById("password");
      const btn = document.getElementById("pwToggle");
      const eyeOpen = document.getElementById("pwEyeOpen");
      const eyeOff = document.getElementById("pwEyeOff");
      if(!pw || !btn) return;

      btn.addEventListener("click", ()=>{
        const showing = pw.type === "text";
        pw.type = showing ? "password" : "text";
        if (eyeOpen) eyeOpen.style.display = showing ? "" : "none";
        if (eyeOff) eyeOff.style.display = showing ? "none" : "";
      });
    })();
  </script>
</body>
</html>
