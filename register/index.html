<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      background:#0b0d12;
      color:#fff;
      font-family:Inter;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      padding:16px;
      box-sizing:border-box;
    }
    .card{
      background:#121726;
      padding:30px;
      border-radius:16px;
      width:100%;
      max-width:420px;
      border:1px solid #1d2230;
      box-sizing:border-box;
    }
    h2{text-align:center;margin-bottom:18px}
    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #1d2230;
      background:#0f1219;
      color:#fff;
      margin-bottom:14px;
      box-sizing:border-box;
      outline:none;
    }

    /* ✅ Password wrapper with right-side Show button */
    .pw-wrap{ position:relative; margin-bottom:14px; }
    .pw-wrap input{ margin-bottom:0; padding-right:80px; }
    .pw-toggle{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:#fff;
      border-radius:10px;
      padding:8px 10px;
      font-weight:800;
      cursor:pointer;
    }

    .role{ display:flex; gap:14px; margin-bottom:18px; }
    .role label{
      flex:1;
      background:#0f1219;
      padding:12px;
      border-radius:10px;
      border:1px solid #1d2230;
      cursor:pointer;
      text-align:center;

      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;

      user-select:none;
      -webkit-tap-highlight-color: transparent;
      box-sizing:border-box;
      min-height:48px;
    }
    .role label input[type="radio"]{
      margin:0;
      flex:0 0 auto;
      width:18px;
      height:18px;
      accent-color:#6cf;
    }
    .role label.selected{
      border-color:#6cf;
      box-shadow:0 0 0 2px rgba(102,204,255,.22);
      background:#0b1220;
    }

    button{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      background:#6cf;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }
    .btn-secondary{
      background:#111827;
      border:1px solid #1d2230;
      color:#fff;
    }
    a{color:#6cf;text-decoration:none}
    .muted{color:#9ca3af;font-size:13px;margin-top:10px;text-align:center}
    #status{ margin-top:10px; text-align:center; color:#9ca3af; font-size:13px; min-height:18px; }

    @media (max-width: 420px){ .role{flex-direction:column} }
  </style>
</head>

<body>

  <div class="card">
    <h2>Create Account</h2>

    <input id="email" type="email" placeholder="Email" autocomplete="email" />

    <div class="pw-wrap">
      <input id="password" type="password" placeholder="Password" autocomplete="new-password" />
      <button class="pw-toggle" id="pwToggle" type="button">Show</button>
    </div>

    <div class="role">
      <label><input type="radio" name="role" value="producer"> Producer</label>
      <label><input type="radio" name="role" value="buyer"> Buyer</label>
    </div>

    <button id="createBtn" type="button">Create Account</button>
    <button class="btn-secondary" id="googleBtn" type="button">Sign up with Google</button>

    <div id="status"></div>

    <p class="muted">
      Already have an account?
      <!-- ✅ absolute path prevents /register/login problem -->
      <a href="/login/">Login</a>
    </p>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script>
    // ✅ role selected styling
    (function(){
      const labels = Array.from(document.querySelectorAll(".role label"));
      const radios = Array.from(document.querySelectorAll(".role input[type='radio']"));
      function sync(){
        labels.forEach(l => l.classList.remove("selected"));
        const checked = radios.find(r => r.checked);
        if (!checked) return;
        checked.closest("label")?.classList.add("selected");
      }
      radios.forEach(r => r.addEventListener("change", sync));
      labels.forEach(l => l.addEventListener("click", sync));
      sync();
    })();

    // ✅ buttons
    document.getElementById("createBtn")?.addEventListener("click", ()=> window.registerUser?.());
    document.getElementById("googleBtn")?.addEventListener("click", ()=> window.googleRegister?.());

    // ✅ show/hide password
    (function(){
      const pw = document.getElementById("password");
      const btn = document.getElementById("pwToggle");
      if(!pw || !btn) return;
      btn.addEventListener("click", ()=>{
        const showing = pw.type === "text";
        pw.type = showing ? "password" : "text";
        btn.textContent = showing ? "Show" : "Hide";
      });
    })();
  </script>

</body>
</html>
