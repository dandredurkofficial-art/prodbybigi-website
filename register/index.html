<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      background:#0b0d12;
      color:#fff;
      font-family:Inter, sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:16px;
      box-sizing:border-box;
    }

    .card{
      background:#121726;
      padding:30px;
      border-radius:16px;
      width:100%;
      max-width:420px;
      border:1px solid #1d2230;
      box-sizing:border-box;
    }

    h2{
      text-align:center;
      margin-bottom:18px;
      font-size:26px;
      font-weight:800;
    }

    .field{ margin-bottom:18px; }

    .field label{
      display:block;
      font-size:16px;
      font-weight:800;
      color:#fff;
      margin-bottom:12px;
    }

    .auth-input{
      width:100%;
      height:74px;
      border-radius:20px;
      border:1px solid #2b3152;
      background:#05091b;
      display:flex;
      align-items:center;
      box-sizing:border-box;
      overflow:hidden;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.03),
        0 0 0 1px rgba(104,119,255,.04);
    }

    .auth-input-main{
      flex:1;
      display:flex;
      align-items:center;
      gap:14px;
      padding:0 18px;
      min-width:0;
      height:100%;
      box-sizing:border-box;
    }

    .auth-icon{
      width:24px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9da3d9;
      flex:0 0 auto;
    }

    .auth-icon svg{
      width:24px;
      height:24px;
    }

    .auth-divider{
      width:1px;
      height:32px;
      background:rgba(255,255,255,.22);
      flex:0 0 auto;
    }

    .auth-input input{
      flex:1;
      min-width:0;
      height:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:15px;
      font-weight:700;
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    .auth-input input::placeholder{
      color:#8f95c8;
      opacity:1;
    }

    .auth-eye-btn{
      width:56px;
      min-width:56px;
      height:56px;
      margin-right:8px;
      border:none;
      border-radius:16px;
      background:#3b416d;
      color:#b9bee8;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
      flex:0 0 56px;
      box-sizing:border-box;
    }

    .auth-eye-btn svg{
      width:24px;
      height:24px;
      display:block;
    }

    .role-wrap{
      margin-bottom:18px;
    }

    .role-title{
      display:block;
      font-size:16px;
      font-weight:800;
      color:#fff;
      margin-bottom:12px;
    }

    .role{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .role-card{
      position:relative;
      display:flex;
      align-items:center;
      gap:16px;
      width:100%;
      min-height:96px;
      padding:18px;
      border-radius:20px;
      border:1px solid #232941;
      background:#0f1219;
      cursor:pointer;
      box-sizing:border-box;
      transition:.18s ease;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    .role-card:hover{
      border-color:#3a4267;
      background:#151925;
    }

    .role-card.selected{
      border-color:#8b5cf6;
      box-shadow:0 0 0 2px rgba(139,92,246,.14);
      background:linear-gradient(180deg, #161528 0%, #101423 100%);
    }

    .role-card input[type="radio"]{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .role-radio{
      width:28px;
      height:28px;
      border-radius:50%;
      border:2px solid #9b5cff;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 28px;
      box-sizing:border-box;
    }

    .role-radio::after{
      content:"";
      width:14px;
      height:14px;
      border-radius:50%;
      background:transparent;
      transition:.18s ease;
    }

    .role-card.selected .role-radio::after{
      background:#9b5cff;
    }

    .role-icon{
      width:34px;
      height:34px;
      color:#9b5cff;
      flex:0 0 34px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .role-icon svg{
      width:34px;
      height:34px;
      display:block;
    }

    .role-copy{
      min-width:0;
      flex:1;
    }

    .role-name{
      display:block;
      font-size:17px;
      font-weight:800;
      color:#fff;
      line-height:1.2;
    }

    .role-desc{
      display:block;
      margin-top:6px;
      font-size:14px;
      color:#8f95c8;
      line-height:1.35;
    }

    .agree-box{
      margin-top:4px;
      margin-bottom:18px;
    }

    .agree-card{
      position:relative;
      display:flex;
      align-items:flex-start;
      gap:14px;
      width:100%;
      min-height:78px;
      padding:18px;
      border-radius:20px;
      border:1px solid #232941;
      background:#05091b;
      box-sizing:border-box;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .agree-card input[type="checkbox"]{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .agree-check{
      width:26px;
      height:26px;
      border-radius:8px;
      border:2px solid #39435f;
      background:#222b42;
      flex:0 0 26px;
      margin-top:2px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-sizing:border-box;
    }

    .agree-check::after{
      content:"";
      width:12px;
      height:12px;
      border-radius:4px;
      background:transparent;
      transition:.18s ease;
    }

    .agree-card.checked .agree-check{
      border-color:#6cf;
      background:#23324d;
    }

    .agree-card.checked .agree-check::after{
      background:#6cf;
    }

    .agree-text{
      font-size:15px;
      line-height:1.55;
      color:#cfd5ff;
    }

    .agree-text a{
      color:#ffb347;
      font-weight:700;
      text-decoration:none;
    }

    .agree-text a:hover{
      text-decoration:underline;
    }

    button#createBtn{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      background:#6cf;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
      font-size:16px;
    }

    .btn-secondary{
      width:100%;
      padding:12px;
      border-radius:12px;
      background:#111827;
      border:1px solid #1d2230;
      color:#fff;
      font-weight:700;
      cursor:pointer;
      margin-top:10px;
    }

    a{
      color:#6cf;
      text-decoration:none;
    }

    .muted{
      color:#9ca3af;
      font-size:13px;
      margin-top:10px;
      text-align:center;
    }

    #status{
      margin-top:10px;
      text-align:center;
      color:#9ca3af;
      font-size:13px;
      min-height:18px;
    }

    @media (max-width: 480px){
      .card{
        padding:22px;
        border-radius:18px;
      }

      h2{
        font-size:24px;
      }

      .auth-input{
        height:70px;
        border-radius:18px;
      }

      .auth-input-main{
        gap:12px;
        padding:0 16px;
      }

      .auth-icon{
        width:22px;
        height:22px;
      }

      .auth-icon svg{
        width:22px;
        height:22px;
      }

      .auth-divider{
        height:30px;
      }

      .auth-input input{
        font-size:14px;
      }

      .auth-eye-btn{
        width:52px;
        min-width:52px;
        height:52px;
        flex:0 0 52px;
        margin-right:8px;
        border-radius:14px;
      }

      .auth-eye-btn svg{
        width:22px;
        height:22px;
      }

      .role-card{
        min-height:88px;
        padding:16px;
      }

      .role-name{
        font-size:16px;
      }

      .role-desc{
        font-size:13px;
      }

      .agree-card{
        padding:16px;
        min-height:74px;
      }

      .agree-text{
        font-size:14px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Create Account</h2>

    <div class="field">
      <label for="email">Email</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18v12H3z"></path>
              <path d="M3 7l9 7 9-7"></path>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="email" type="email" placeholder="Enter Email" autocomplete="email" />
        </div>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8.5" cy="10.5" r="3.25"></circle>
              <path d="M11.5 10.5H21"></path>
              <path d="M18 10.5v3"></path>
              <path d="M15.5 10.5v2"></path>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="password" type="password" placeholder="Enter password" autocomplete="new-password" />
        </div>

        <button class="auth-eye-btn" id="pwToggle" type="button" aria-label="Show password">
          <svg id="pwEyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>

          <svg id="pwEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
            <path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2"></path>
            <path d="M6.2 6.3C3.7 8 2 12 2 12a17.8 17.8 0 0 0 5.4 5.1"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="role-wrap">
      <label class="role-title">Account Type</label>

      <div class="role">
        <label class="role-card">
          <input type="radio" name="role" value="buyer" />
          <span class="role-radio"></span>

          <span class="role-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>

          <span class="role-copy">
            <span class="role-name">Buyer</span>
            <span class="role-desc">Purchase beats for your projects</span>
          </span>
        </label>

        <label class="role-card">
          <input type="radio" name="role" value="producer" />
          <span class="role-radio"></span>

          <span class="role-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M19 8v6"></path>
              <path d="M22 11h-6"></path>
            </svg>
          </span>

          <span class="role-copy">
            <span class="role-name">Producer</span>
            <span class="role-desc">Upload and sell your beats</span>
          </span>
        </label>
      </div>
    </div>

    <div class="agree-box">
      <label class="agree-card" id="agreeCard">
        <input type="checkbox" id="agreeTerms" />
        <span class="agree-check"></span>
        <span class="agree-text">
          I agree to the
          <a href="/terms/" target="_blank" rel="noopener noreferrer">Terms of Service</a>
          and
          <a href="/privacy/" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
        </span>
      </label>
    </div>

    <button id="createBtn" type="button">Create Account</button>
    <button class="btn-secondary" id="googleBtn" type="button" style="display:none;">Sign up with Google</button>

    <div id="status"></div>

    <p class="muted">
      Already have an account?
      <a href="/login/">Login</a>
    </p>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script>
    (function(){
      const cards = Array.from(document.querySelectorAll(".role-card"));
      const radios = Array.from(document.querySelectorAll(".role-card input[type='radio']"));

      function syncRoles(){
        cards.forEach(card => card.classList.remove("selected"));
        const checked = radios.find(r => r.checked);
        if (!checked) return;
        checked.closest(".role-card")?.classList.add("selected");
      }

      radios.forEach(r => r.addEventListener("change", syncRoles));
      cards.forEach(card => card.addEventListener("click", syncRoles));
      syncRoles();
    })();

    (function(){
      const agree = document.getElementById("agreeTerms");
      const card = document.getElementById("agreeCard");

      if (!agree || !card) return;

      function syncAgree(){
        card.classList.toggle("checked", !!agree.checked);
      }

      agree.addEventListener("change", syncAgree);
      card.addEventListener("click", () => {
        setTimeout(syncAgree, 0);
      });

      syncAgree();
    })();

    document.getElementById("createBtn")?.addEventListener("click", ()=>{
      const agreed = document.getElementById("agreeTerms")?.checked;
      const status = document.getElementById("status");

      if (!agreed){
        if (status) status.textContent = "Please agree to the Terms of Service and Privacy Policy.";
        return;
      }

      if (status) status.textContent = "";
      window.registerUser?.();
    });

    (function(){
      const pw = document.getElementById("password");
      const btn = document.getElementById("pwToggle");
      const eyeOpen = document.getElementById("pwEyeOpen");
      const eyeOff = document.getElementById("pwEyeOff");

      if(!pw || !btn) return;

      btn.addEventListener("click", ()=>{
        const showing = pw.type === "text";
        pw.type = showing ? "password" : "text";
        if (eyeOpen) eyeOpen.style.display = showing ? "" : "none";
        if (eyeOff) eyeOff.style.display = showing ? "none" : "";
      });
    })();
  </script>
</body>
</html>
