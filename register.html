<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-box">
  <h2>Create Account</h2>
  <input id="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password" oninput="checkStrength()">
  <div id="strength"></div>

  <button id="regBtn" onclick="registerUser()" disabled>Register</button>
  <p><a href="login.html">Already have account</a></p>
</div>

<script src="auth-ui.js" type="module"></script>
<script>
function checkStrength(){
  const p = password.value;
  const strong = p.length >= 8 && /[A-Z]/.test(p) && /\d/.test(p);
  strength.innerText = strong ? "Strong 🔥" : "Weak ❌";
  regBtn.disabled = !strong;
}
</script>
</body>
</html>
