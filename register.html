<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      background:#0b0d12;
      color:#fff;
      font-family:Inter;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }
    .card{
      background:#121726;
      padding:30px;
      border-radius:16px;
      width:100%;
      max-width:420px;
      border:1px solid #1d2230;
    }
    h2{text-align:center;margin-bottom:18px}
    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #1d2230;
      background:#0f1219;
      color:#fff;
      margin-bottom:14px;
    }
    .role{
      display:flex;
      gap:14px;
      margin-bottom:18px;
    }
    .role label{
      flex:1;
      background:#0f1219;
      padding:12px;
      border-radius:10px;
      border:1px solid #1d2230;
      cursor:pointer;
      text-align:center;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
    }
    button{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      background:#6cf;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }
    .btn-secondary{
      background:#111827;
      border:1px solid #1d2230;
      color:#fff;
    }
    a{color:#6cf;text-decoration:none}
    .muted{color:#9ca3af;font-size:13px;margin-top:10px;text-align:center}
  </style>
</head>

<body>

  <div class="card">
    <h2>Create Account</h2>

    <input id="email" type="email" placeholder="Email" autocomplete="email" />
    <input id="password" type="password" placeholder="Password" autocomplete="new-password" />

    <div class="role">
      <label><input type="radio" name="role" value="producer"> Producer</label>
      <label><input type="radio" name="role" value="buyer"> Buyer</label>
    </div>

    <button onclick="registerUser()">Create Account</button>
    <button class="btn-secondary" onclick="googleRegister()">Sign up with Google</button>

    <p class="muted">
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </div>

  <script type="module" src="auth-ui.js"></script>
</body>
</html>
