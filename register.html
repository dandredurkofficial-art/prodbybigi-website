<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Create Account</h2>

<input id="name" placeholder="Producer Name">
<input id="registerEmail" placeholder="Email">

<div class="password-wrapper">
  <input id="registerPassword" type="password" placeholder="Password">
  <span onclick="togglePassword('registerPassword',this)">👁</span>
</div>

<div class="strength-bar"><div id="strengthFill"></div></div>
<p id="strengthText">Password strength</p>

<button id="registerBtn" onclick="register()" disabled>Create Account</button>

<script src="auth-ui.js"></script>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp }
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

window.register = async () => {
  if (!passwordStrong) return;

  const cred = await createUserWithEmailAndPassword(
    auth,
    registerEmail.value,
    registerPassword.value
  );

  await setDoc(doc(db,"users",cred.user.uid),{
    displayName: name.value,
    email: registerEmail.value,
    role:"producer",
    plan:"free",
    createdAt: serverTimestamp(),
    stats:{ beats:0, plays:0, sales:0 }
  });

  location.href="dashboard.html";
};
</script>
</body>
</html>
