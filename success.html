<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completing payment…</title>
</head>
<body>
  <p style="font-family:system-ui;padding:20px;">Completing payment…</p>

  <script>
    // ✅ These should be the EXACT deployed URLs of your HTTPS functions
    // If you’re using Cloud Run proxy URLs, put them here exactly.
    window.PB_PAYPAL_CAPTURE_ORDER_URL =
      "https://captureorder-f65rhsquva-uc.a.run.app"; // <-- your capture endpoint
  </script>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCmsFTjDryYOTddWfScTKsnrs0cWAHnpdc",
      authDomain: "audiory-beat-store.firebaseapp.com",
      projectId: "audiory-beat-store"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);

    function getOrderIdFromUrl() {
      const qs = new URLSearchParams(location.search);
      // PayPal returns order id in "token"
      return (qs.get("token") || "").trim();
    }

    async function doCapture(user) {
      const orderId = getOrderIdFromUrl();
      if (!orderId) {
        window.location.href = "/marketplace/?error=missing_token";
        return;
      }

      const token = await user.getIdToken();

      const r = await fetch(window.PB_PAYPAL_CAPTURE_ORDER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ orderId }),
      });

      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        console.error("Capture failed:", data);
        window.location.href = "/marketplace/?error=capture_failed";
        return;
      }

      // ✅ Let webhook do the unlock + wallet credit
      // Give it a moment then send buyer to dashboard
      setTimeout(() => {
        window.location.href = "/buyer-dashboard/?paid=1";
      }, 1200);
    }

    // Require login so buyer dashboard can show their stuff
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        const next = encodeURIComponent(location.pathname + location.search);
        window.location.href = `/login/?next=${next}`;
        return;
      }
      doCapture(user);
    });
  </script>
</body>
</html>
