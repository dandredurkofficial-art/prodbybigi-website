<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | ProdByBigi</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing:border-box; font-family:'Inter',sans-serif; }
    body { margin:0; background:#0d0d0d; color:#fff; display:flex; height:100vh; }

    .sidebar { width:260px; background:#111; padding:20px; display:flex; flex-direction:column; border-right:1px solid #222; }
    .logo { font-size:20px; font-weight:700; color:#6cf; margin-bottom:30px; }
    .nav a { display:block; padding:12px; margin-bottom:6px; color:#bbb; text-decoration:none; border-radius:8px; cursor:pointer; }
    .nav a:hover { background:#1b1b1b; color:#fff; }
    .nav .pro { margin-top:auto; background:linear-gradient(135deg,#6cf,#9f6cff); color:#000; font-weight:600; text-align:center; }

    .main { flex:1; display:flex; flex-direction:column; }
    .topbar { height:64px; background:#111; border-bottom:1px solid #222; display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
    .hamburger { display:none; background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
    .content { padding:24px; overflow-y:auto; }

    .card { background:#141414; border:1px solid #222; border-radius:14px; padding:20px; margin-bottom:20px; }
    input, button, select { width:100%; padding:10px; margin-top:10px; border-radius:8px; border:none; }
    button { background:#6cf; font-weight:600; cursor:pointer; }
    audio { width:100%; margin-top:8px; }

    .beat-card { display:flex; gap:14px; align-items:center; }
    .beat-card img { width:90px; height:90px; object-fit:cover; border-radius:10px; }

    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    .grid .beat-card { flex-direction:column; align-items:flex-start; }
    .grid img { width:100%; height:180px; }

    @media(max-width:768px){
      .hamburger{display:block;}
      .sidebar{position:fixed; left:-260px; top:0; height:100%; transition:.3s; z-index:1000;}
      .sidebar.open{left:0;}
    }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="logo">ProdByBigi</div>
  <nav class="nav">
    <a onclick="loadPage('home')">Dashboard</a>
    <a onclick="loadPage('tracks')">Tracks</a>
    <a onclick="loadPage('analytics')">Analytics</a>
    <a onclick="loadPage('settings')">Account Settings</a>
    <a class="pro" onclick="loadPage('upgrade')">Upgrade to Pro</a>
  </nav>
</aside>

<div class="main">
  <header class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <h3 id="pageTitle">Dashboard</h3>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="content" id="content"></div>
</div>

<script type="module">
  import { auth } from './firebase.js';
  import { onAuthStateChanged, signOut, updateEmail, updatePassword } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, where, getDocs, deleteDoc } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

  const db = getFirestore();
  const CLOUD_NAME = 'djd8vki8s';
  const UPLOAD_PRESET = 'beats_unsigned';

  const content = document.getElementById('content');
  const pageTitle = document.getElementById('pageTitle');
  const sidebar = document.getElementById('sidebar');
  let currentUser = null;
  let gridView = false;

  window.toggleSidebar = () => sidebar.classList.toggle('open');
  window.logout = async () => { await signOut(auth); location.href='login.html'; };

  async function uploadCloudinary(file, folder){
    const fd = new FormData();
    fd.append('file',file);
    fd.append('upload_preset',UPLOAD_PRESET);
    fd.append('folder',folder);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,{method:'POST',body:fd});
    const j = await r.json();
    return j.secure_url;
  }

  window.loadPage = async (page)=>{
    sidebar.classList.remove('open');

    if(page==='home'){
      pageTitle.innerText='Dashboard';
      content.innerHTML=`<div class='card'><h2>Welcome 👋</h2><p>Manage your beats & business.</p></div>`;
    }

    if(page==='tracks'){
      pageTitle.innerText='Tracks';
      content.innerHTML=`
        <div class='card'>
          <h3>Upload Beat</h3>
          <input id='title' placeholder='Title'>
          <input id='bpm' type='number' placeholder='BPM'>
          <input id='genre' placeholder='Genre'>
          <input id='mood' placeholder='Mood'>
          <input id='price' type='number' step='0.01' value='29.99' placeholder='Price'>
          <input id='cover' type='file' accept='image/*'>
          <input id='file' type='file' accept='.mp3,.wav'>
          <button onclick='uploadBeat()'>Upload</button>
          <p id='msg'></p>
        </div>
        <button onclick='toggleGrid()'>Toggle Grid View</button>
        <div id='beatList'></div>`;
      loadBeats();
    }

    if(page==='settings'){
      pageTitle.innerText='Account Settings';
      content.innerHTML=`
        <div class='card'>
          <h3>Profile</h3>
          <input id='name' placeholder='Producer name'>
          <input id='email' placeholder='Email'>
          <input id='password' type='password' placeholder='New password'>
          <input id='avatar' type='file' accept='image/*'>
          <button onclick='saveSettings()'>Save</button>
          <p id='smsg'></p>
        </div>`;

      const snap = await getDoc(doc(db,'users',currentUser.uid));
      if(snap.exists()){
        document.getElementById('name').value = snap.data().name || '';
        document.getElementById('email').value = currentUser.email;
      }
    }

    if(page==='upgrade'){
      pageTitle.innerText='Upgrade to Pro';
      content.innerHTML=`
        <div class='card'><h3>Starter – $15/year</h3><p>Unlimited MP3/WAV • 0% commission • Instant payments</p></div>
        <div class='card'><h3>Growth – $60/year</h3><p>Soundkits • Services • Unlimited licenses • Messaging</p></div>
        <div class='card'><h3>Professional – $159/year</h3><p>Custom domain • Merch • Blog • Marketing • Beat stores</p></div>`;
    }
  };

  window.uploadBeat = async ()=>{
    const msg=document.getElementById('msg');
    try{
      msg.innerText='Uploading...';
      const coverUrl=await uploadCloudinary(cover.files[0],`covers/${currentUser.uid}`);
      const fileUrl=await uploadCloudinary(file.files[0],`beats/${currentUser.uid}`);
      await addDoc(collection(db,'beats'),{
        uid:currentUser.uid,
        title:title.value,
        bpm:bpm.value,
        genre:genre.value,
        mood:mood.value,
        price:price.value,
        coverUrl,fileUrl,plays:0
      });
      msg.innerText='Uploaded ✅'; loadBeats();
    }catch(e){msg.innerText='Upload failed';}
  };

  async function loadBeats(){
    const q=query(collection(db,'beats'),where('uid','==',currentUser.uid));
    const s=await getDocs(q);
    const list=document.getElementById('beatList');
    list.className=gridView?'grid':'';
    list.innerHTML='';
    s.forEach(d=>{
      const b=d.data();
      list.innerHTML+=`
        <div class='card beat-card'>
          <img src='${b.coverUrl}'>
          <div>
            <strong>${b.title}</strong><br>
            <small>${b.bpm} BPM • ${b.genre} • ${b.mood}</small><br>
            <small>$${b.price} • ▶ ${b.plays}</small>
            <audio controls src='${b.fileUrl}'></audio>
          </div>
          <button onclick="deleteBeat('${d.id}')">Delete</button>
        </div>`;
    });
  }

  window.deleteBeat = async(id)=>{ if(confirm('Delete beat?')){ await deleteDoc(doc(db,'beats',id)); loadBeats(); }};
  window.toggleGrid = ()=>{ gridView=!gridView; loadBeats(); };

  window.saveSettings = async()=>{
    const msg=document.getElementById('smsg');
    try{
      if(email.value!==currentUser.email) await updateEmail(currentUser,email.value);
      if(password.value) await updatePassword(currentUser,password.value);
      let photoURL=null;
      if(avatar.files[0]) photoURL=await uploadCloudinary(avatar.files[0],`avatars/${currentUser.uid}`);
      await updateDoc(doc(db,'users',currentUser.uid),{name:name.value,photoURL});
      msg.innerText='Saved ✅';
    }catch(e){msg.innerText=e.message;}
  };

  onAuthStateChanged(auth,async user=>{
    if(!user) return location.href='login.html';
    currentUser=user;
    const ref=doc(db,'users',user.uid);
    if(!(await getDoc(ref)).exists()) await setDoc(ref,{email:user.email,plan:'free'});
    loadPage('home');
  });
</script>
</body>
</html>
