<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Producer Studio</title>

<!-- Cloudinary -->
<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<style>
:root {
  --bg: #0b0f16;
  --card: #111827;
  --border: #1f2937;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --accent: #3b82f6;
  --danger: #ef4444;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: linear-gradient(180deg,#05070c,#0b0f16);
  color: var(--text);
}

a { color: inherit; text-decoration: none; }

header {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #05070c;
  border-bottom: 1px solid var(--border);
}

.menu-btn {
  font-size: 22px;
  cursor: pointer;
}

.logout {
  background: var(--danger);
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
}

.layout {
  display: flex;
  min-height: calc(100vh - 64px);
}

nav {
  width: 240px;
  background: #05070c;
  border-right: 1px solid var(--border);
  padding: 16px;
}

nav a {
  display: block;
  padding: 10px 12px;
  border-radius: 8px;
  color: var(--muted);
  margin-bottom: 6px;
}

nav a.active,
nav a:hover {
  background: var(--card);
  color: #fff;
}

main {
  flex: 1;
  padding: 16px;
}

.card {
  background: linear-gradient(180deg,#0e1422,#0b1220);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}

/* Upload layout */
.upload-grid {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 16px;
}

.section-title {
  font-weight: 600;
  margin-bottom: 12px;
}

input, textarea, select {
  width: 100%;
  background: #05070c;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  color: #fff;
  margin-bottom: 12px;
}

textarea { min-height: 90px; resize: vertical; }

.button {
  background: var(--accent);
  border: none;
  padding: 12px;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
  width: 100%;
  font-weight: 600;
}

.file-box {
  border: 1px dashed var(--border);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.license {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-bottom: 10px;
}

.license.active {
  background: #0b1f44;
  border-color: #1d4ed8;
}

.toggle {
  appearance: none;
  width: 42px;
  height: 22px;
  background: #374151;
  border-radius: 11px;
  position: relative;
  cursor: pointer;
}

.toggle:checked {
  background: var(--accent);
}

.toggle:checked::after {
  transform: translateX(20px);
}

.toggle::after {
  content: "";
  width: 18px;
  height: 18px;
  background: #fff;
  position: absolute;
  top: 2px;
  left: 2px;
  border-radius: 50%;
  transition: .2s;
}

/* Mobile */
@media(max-width: 900px) {
  nav { display: none; position: fixed; height: 100%; z-index: 10; }
  nav.open { display: block; }
  .upload-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <strong>Producer Studio</strong>
  <button class="logout">Logout</button>
</header>

<div class="layout">
<nav id="sidebar">
  <a class="active">Dashboard</a>
  <a>Tracks</a>
  <a>Finance</a>
  <a>Licenses</a>
  <a>Settings</a>
</nav>

<main>

<!-- UPLOAD BEAT -->
<div class="card">
  <h2 class="section-title">Upload Beat</h2>

  <div class="upload-grid">

    <!-- LEFT -->
    <div>

      <div class="card">
        <h3 class="section-title">Basic Info</h3>
        <input placeholder="Track title" />
        <textarea placeholder="Description"></textarea>
      </div>

      <div class="card">
        <h3 class="section-title">Metadata</h3>
        <input placeholder="BPM" />
        <input placeholder="Key" />
        <input placeholder="Tags (comma separated)" />
      </div>

      <div class="card">
        <h3 class="section-title">Licenses</h3>

        <div class="license active">
          <div>
            <strong>Basic License</strong><br>
            <small class="muted">MP3</small>
          </div>
          <input class="toggle" type="checkbox" checked>
        </div>

        <div class="license">
          <div>
            <strong>Exclusive License</strong><br>
            <small class="muted">WAV + MP3</small>
          </div>
          <input class="toggle" type="checkbox">
        </div>
      </div>

    </div>

    <!-- RIGHT -->
    <div class="card">
      <h3 class="section-title">Files</h3>

      <div class="file-box">
        <span>Master Track (Untagged)</span>
        <button onclick="uploadAudio()" class="button" style="width:auto">Add</button>
      </div>

      <div class="file-box">
        <span>Preview Track (Tagged)</span>
        <button onclick="uploadAudio()" class="button" style="width:auto">Add</button>
      </div>

      <div class="file-box">
        <span>Artwork</span>
        <button onclick="uploadImage()" class="button" style="width:auto">Add</button>
      </div>

      <button class="button">Publish Track</button>
    </div>

  </div>
</div>

</main>
</div>

<script>
function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("open");
}

function uploadAudio() {
  cloudinary.openUploadWidget({
    cloudName: "YOUR_CLOUD_NAME",
    uploadPreset: "unsigned_audio",
    resourceType: "video"
  }, () => {});
}

function uploadImage() {
  cloudinary.openUploadWidget({
    cloudName: "YOUR_CLOUD_NAME",
    uploadPreset: "unsigned_images"
  }, () => {});
}
</script>

</body>
</html>
