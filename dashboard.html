<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producer Studio</title>

<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<style>
body {
  margin:0;
  font-family:Inter,system-ui;
  background:#070a12;
  color:#fff;
}
header {
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #1f2937;
}
.menu-btn {font-size:22px;cursor:pointer;}
.logout {
  background:#ef4444;border:none;padding:8px 14px;border-radius:8px;color:#fff;
}
.layout {display:flex;min-height:calc(100vh - 64px);}
nav {
  width:240px;border-right:1px solid #1f2937;padding:12px;
}
nav a {
  display:block;padding:10px;border-radius:8px;color:#9ca3af;cursor:pointer;
}
nav a.active {background:#111827;color:#fff;}
main {flex:1;padding:16px;}
.page {display:none;}
.page.active {display:block;}

.card {
  background:#0b1220;
  border:1px solid #1f2937;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}
input,textarea {
  width:100%;
  background:#05070c;
  border:1px solid #1f2937;
  border-radius:10px;
  padding:12px;
  color:#fff;
  margin-bottom:12px;
}
.toggle {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0;
}
.price {width:120px;}
button.primary {
  background:#3b82f6;border:none;padding:12px;border-radius:10px;color:#fff;
}

/* MOBILE */
@media(max-width:900px){
  nav{
    display:none;
    position:fixed;
    height:100%;
    background:#070a12;
    z-index:10;
    top:64px;
    left:0;
  }
  nav.open{display:block;}
}
@media (max-width: 640px) {
  .toggle {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .price {width:100%;}
  button.primary {width:100%;}
}

/* ARTWORK */
.artwork-preview {
  width:100%;
  max-width:240px;
  aspect-ratio:1/1;
  border-radius:12px;
  background:#05070c;
  border:1px dashed #1f2937;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:12px;
}
.artwork-preview img {
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TRACK LIST */
.track {
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
}
.track img {
  width:56px;
  height:56px;
  border-radius:8px;
  object-fit:cover;
}
.track button {
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <strong>Producer Studio</strong>
  <button class="logout">Logout</button>
</header>

<div class="layout">
<nav id="sidebar">
  <a onclick="showPage('dashboard')" class="active">Dashboard</a>
  <a onclick="showPage('upload')">Upload Beat</a>
  <a onclick="showPage('tracks')">Tracks</a>
  <a onclick="showPage('finance')">Finance</a>
</nav>

<main>

<section id="dashboard" class="page active">
  <div class="card"><h2>Total Sales</h2><h1>$0.00</h1></div>
  <div class="card"><h2>Available Balance</h2><h1>$0.00</h1></div>
</section>

<section id="upload" class="page">
  <!-- UNCHANGED -->
  <div class="card">
    <h2>Basic Info</h2>
    <div class="artwork-preview" id="artworkBox"><span>Artwork Preview</span></div>
    <button class="primary" onclick="uploadArtwork()">Upload Artwork</button>
    <input id="title" placeholder="Track title">
    <textarea id="desc" placeholder="Description"></textarea>
    <input id="bpm" placeholder="BPM">
    <input id="key" placeholder="Key">
    <button class="primary" onclick="uploadFullAudio()">Upload Full Beat</button>
    <button class="primary" onclick="uploadPreviewAudio()">Upload Preview (Tagged)</button>
  </div>

  <div class="card">
    <h2>Monetization</h2>
    <div class="toggle"><label>Basic License</label><input type="checkbox" id="basicEnabled"><input class="price" id="basicPrice" value="29.99"></div>
    <div class="toggle"><label>Premium License</label><input type="checkbox" id="premiumEnabled"><input class="price" id="premiumPrice" value="79.99"></div>
    <div class="toggle"><label>Exclusive License</label><input type="checkbox" id="exclusiveEnabled"><input class="price" id="exclusivePrice" value="299.99"></div>
    <button class="primary" onclick="publishBeat()">Publish Beat</button>
  </div>
</section>

<section id="tracks" class="page">
  <div class="card">
    <h2>Your Beats</h2>
    <div id="beats"></div>
  </div>
</section>

<!-- ✅ NEW: EDIT TRACK PAGE -->
<section id="edit" class="page">
  <div class="card">
    <h2>Edit Track</h2>

    <div class="artwork-preview" id="editArtwork"></div>
    <button class="primary" onclick="editUploadArtwork()">Change Artwork</button>

    <input id="editTitle" placeholder="Track title">
    <input id="editBpm" placeholder="BPM">
    <input id="editKey" placeholder="Key">

    <button class="primary" onclick="editUploadPreview()">Change Preview</button>
    <button class="primary" onclick="saveEdit()">Save Changes</button>
  </div>
</section>

<section id="finance" class="page">
  <div class="card"><h2>Payouts</h2><p>$0.00</p><button class="primary">Withdraw</button></div>
</section>

</main>
</div>

<script>
let uploadedArtwork=null, fullAudio=null, previewAudio=null;
let beatsData=[];
let currentAudio=null;
let editIndex=null;

function toggleMenu(){
  sidebar.classList.toggle("open");
}
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event?.target?.classList.add('active');
  sidebar.classList.remove("open");
}

function uploadArtwork(){
  cloudinary.openUploadWidget({
    cloudName:"djd8vki8s",
    uploadPreset:"unsigned_images",
    resourceType:"image"
  },(_,res)=>{
    if(res?.event==="success"){
      uploadedArtwork=res.info.secure_url;
      artworkBox.innerHTML=`<img src="${uploadedArtwork}">`;
    }
  });
}
function uploadFullAudio(){
  cloudinary.openUploadWidget({
    cloudName:"djd8vki8s",
    uploadPreset:"unsigned_audio",
    resourceType:"video"
  },(_,res)=>{
    if(res?.event==="success") fullAudio=res.info.secure_url;
  });
}
function uploadPreviewAudio(){
  cloudinary.openUploadWidget({
    cloudName:"djd8vki8s",
    uploadPreset:"unsigned_audio",
    resourceType:"video"
  },(_,res)=>{
    if(res?.event==="success") previewAudio=res.info.secure_url;
  });
}

function publishBeat(){
  beatsData.push({
    title:title.value,
    bpm:bpm.value,
    key:key.value,
    artwork:uploadedArtwork,
    preview:previewAudio
  });
  renderTracks();
}

function renderTracks(){
  beats.innerHTML="";
  beatsData.forEach((b,i)=>{
    beats.innerHTML+=`
      <div class="track">
        <img src="${b.artwork||''}">
        <div style="flex:1">
          <strong>${b.title}</strong><br>
          <small>${b.bpm} BPM • ${b.key}</small>
        </div>
        <button onclick="playPreview(${i})">▶</button>
        <button onclick="openEdit(${i})">Edit</button>
      </div>`;
  });
}

function playPreview(i){
  if(currentAudio) currentAudio.pause();
  currentAudio=new Audio(beatsData[i].preview);
  currentAudio.play();
}

/* EDIT */
function openEdit(i){
  editIndex=i;
  const b=beatsData[i];
  editArtwork.innerHTML=`<img src="${b.artwork||''}">`;
  editTitle.value=b.title;
  editBpm.value=b.bpm;
  editKey.value=b.key;
  showPage('edit');
}
function editUploadArtwork(){
  cloudinary.openUploadWidget({
    cloudName:"YOUR_CLOUD_NAME",
    uploadPreset:"unsigned_images",
    resourceType:"image"
  },(_,res)=>{
    if(res?.event==="success"){
      beatsData[editIndex].artwork=res.info.secure_url;
      editArtwork.innerHTML=`<img src="${res.info.secure_url}">`;
    }
  });
}
function editUploadPreview(){
  cloudinary.openUploadWidget({
    cloudName:"YOUR_CLOUD_NAME",
    uploadPreset:"unsigned_audio",
    resourceType:"video"
  },(_,res)=>{
    if(res?.event==="success"){
      beatsData[editIndex].preview=res.info.secure_url;
    }
  });
}
function saveEdit(){
  const b=beatsData[editIndex];
  b.title=editTitle.value;
  b.bpm=editBpm.value;
  b.key=editKey.value;
  renderTracks();
  showPage('tracks');
}
</script>

</body>
</html>
