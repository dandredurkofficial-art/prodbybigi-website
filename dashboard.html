<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketplace — ProdByBigi</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">🎧 ProdByBigi</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Start Selling</a>
    <a href="login.html">Sign in</a>
  </nav>
</header>

<section class="section">
  <h1>🎹 Beat Marketplace</h1>
  <p class="muted">
    Browse high-quality beats from producers worldwide
  </p>

  <div class="filters">
    <select>
      <option>All Genres</option>
      <option>Hip Hop</option>
      <option>Trap</option>
      <option>Drill</option>
      <option>Afrobeats</option>
      <option>R&B</option>
    </select>

    <select>
      <option>Sort by</option>
      <option>Trending</option>
      <option>Newest</option>
      <option>Price: Low to High</option>
    </select>
  </div>

  <div class="beat-grid">
    <div class="beat-card large">
      🎧 Dark Trap Beat<br>
      <span>Trap • 140 BPM</span>
      <strong>$29</strong>
    </div>
    <div class="beat-card large">
      🎧 Afro Groove<br>
      <span>Afrobeats • 108 BPM</span>
      <strong>$35</strong>
    </div>
    <div class="beat-card large">
      🎧 Drill Energy<br>
      <span>Drill • 142 BPM</span>
      <strong>$30</strong>
    </div>
    <div class="beat-card large">
      🎧 Smooth R&B<br>
      <span>R&B • 92 BPM</span>
      <strong>$25</strong>
    </div>
  </div>
</section>

<footer class="footer">
  <p>© 2026 ProdByBigi. All rights reserved.</p>
</footer>

</body>
</html>
