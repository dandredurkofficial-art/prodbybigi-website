<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- PayPal SDK -->
<script src="https://www.paypal.com/sdk/js?client-id=AdurYcARCdHIlIJL9uH2ui23x2VV4AUbuGdTeBGDJUMTdb99sc7ntdekg8jszs3v6r1UXeJrfJ9oXPvO&vault=true&intent=subscription"></script>

<style>
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:#0b0b0b;color:#fff;display:flex;height:100vh}
.sidebar{width:240px;background:#111;padding:20px;display:flex;flex-direction:column}
.sidebar h2{color:#6cf;margin-bottom:20px}
.sidebar button{background:none;border:none;color:#aaa;text-align:left;padding:12px;border-radius:8px;cursor:pointer}
.sidebar button:hover{background:#1a1a1a;color:#fff}

.main{flex:1;display:flex;flex-direction:column}
.topbar{height:60px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 20px}
.hamburger{display:none;font-size:22px;background:none;border:none;color:#fff;margin-right:12px}

.content{padding:25px;overflow-y:auto}
.card{background:#141414;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.price{font-size:22px;color:#6cf;font-weight:700}

@media(max-width:768px){
  .sidebar{position:fixed;left:-260px;top:0;height:100%;z-index:999;transition:0.3s}
  .sidebar.open{left:0}
  .hamburger{display:block}
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <h2>ProdByBigi</h2>
  <button onclick="loadPage('dashboard')">Dashboard</button>
  <button onclick="loadPage('tracks')">Tracks</button>
  <button onclick="loadPage('analytics')">Analytics</button>
  <button onclick="loadPage('finance')">Finance</button>
  <button onclick="loadPage('settings')">Settings</button>
  <button onclick="loadPage('upgrade')">Upgrade</button>
</div>

<div class="main">
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <h3 id="pageTitle">Dashboard</h3>
  </div>
  <div class="content" id="content"></div>
</div>

<script type="module">
/* ---------------- SAFE GLOBAL FUNCTIONS ---------------- */
window.toggleSidebar = function(){
  document.getElementById('sidebar').classList.toggle('open');
};

window.loadPage = function(page){
  const content = document.getElementById('content');
  const title = document.getElementById('pageTitle');
  if(!content || !title) return;

  title.innerText = page.charAt(0).toUpperCase()+page.slice(1);

  if(page === 'dashboard'){
    content.innerHTML = `
      <div class="card">
        <h2>Welcome 👋</h2>
        <p>Your producer dashboard is working correctly.</p>
      </div>`;
  }

  if(page === 'tracks'){
    content.innerHTML = `
      <div class="card">
        <h3>Tracks</h3>
        <p>Upload & manage your beats here.</p>
      </div>`;
  }

  if(page === 'analytics'){
    content.innerHTML = `
      <div class="card">
        <h3>Analytics</h3>
        <p>Plays & views will appear here.</p>
      </div>`;
  }

  if(page === 'finance'){
    content.innerHTML = `
      <div class="card">
        <h3>Finance</h3>
        <p>Sales & earnings dashboard.</p>
      </div>`;
  }

  if(page === 'settings'){
    content.innerHTML = `
      <div class="card">
        <h3>Account Settings</h3>
        <p>Profile settings are stable.</p>
      </div>`;
  }

  if(page === 'upgrade'){
    content.innerHTML = `
      <div class="grid">
        <div class="card">
          <h3>Starter</h3>
          <p class="price">$15 / year</p>
          <ul>
            <li>Unlimited MP3/WAV</li>
            <li>0% commission</li>
            <li>Advanced analytics</li>
          </ul>
          <div id="pp-starter"></div>
        </div>

        <div class="card">
          <h3>Growth</h3>
          <p class="price">$60 / year</p>
          <ul>
            <li>Upload stems</li>
            <li>Sell services</li>
            <li>Unlimited messaging</li>
          </ul>
          <div id="pp-growth"></div>
        </div>

        <div class="card">
          <h3>Professional</h3>
          <p class="price">$159 / year</p>
          <ul>
            <li>Custom website</li>
            <li>Merch & memberships</li>
            <li>Email marketing</li>
          </ul>
          <div id="pp-pro"></div>
        </div>
      </div>
    `;
    setTimeout(loadPayPalButtons, 300);
  }
};

/* ---------------- PAYPAL SAFE LOAD ---------------- */
function loadPayPalButtons(){
  if(typeof paypal === 'undefined') return;

  paypal.Buttons({
    createSubscription:(d,a)=>a.subscription.create({plan_id:'P-8FN35171F4185880VNFJ5YGI'}),
    onApprove:()=>alert('Starter activated')
  }).render('#pp-starter');

  paypal.Buttons({
    createSubscription:(d,a)=>a.subscription.create({plan_id:'P-4MM864528J575140DNFJ5XQQ'}),
    onApprove:()=>alert('Growth activated')
  }).render('#pp-growth');

  paypal.Buttons({
    createSubscription:(d,a)=>a.subscription.create({plan_id:'P-1TH20083J44769154NFJ5VTA'}),
    onApprove:()=>alert('Professional activated')
  }).render('#pp-pro');
}

/* ---------------- DEFAULT PAGE ---------------- */
loadPage('dashboard');
</script>

</body>
</html>
