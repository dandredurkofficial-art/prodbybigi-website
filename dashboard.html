<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard | ProdByBigi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.paypal.com/sdk/js?client-id=AdurYcARCdHIlIJL9uH2ui23x2VV4AUbuGdTeBGDJUMTdb99sc7ntdekg8jszs3v6r1UXeJrfJ9oXPvO&vault=true&intent=subscription"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0d0d0d;color:#fff;display:flex;height:100vh}
.sidebar{width:240px;background:#111;padding:20px;display:flex;flex-direction:column}
.sidebar a{padding:10px;border-radius:8px;color:#bbb;text-decoration:none;cursor:pointer}
.sidebar a:hover{background:#1b1b1b;color:#fff}
.sidebar .pro{margin-top:auto;background:linear-gradient(135deg,#6cf,#9f6cff);color:#000;font-weight:600;text-align:center}
.main{flex:1;display:flex;flex-direction:column}
.topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#111}
.content{padding:24px;overflow-y:auto}
.card{background:#141414;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:20px}
button{padding:10px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
button.primary{background:#6cf;color:#000}
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.price{font-size:26px;font-weight:700;margin:10px 0}
ul{margin-left:18px;font-size:14px;color:#bbb}
ul li{margin-bottom:6px}
.beat{display:flex;gap:14px;align-items:center}
.beat img{width:80px;height:80px;object-fit:cover;border-radius:10px}
</style>
</head>
<body>

<aside class="sidebar">
  <h2>ProdByBigi</h2>
  <a onclick="loadPage('home')">Dashboard</a>
  <a onclick="loadPage('tracks')">Tracks</a>
  <a onclick="loadPage('analytics')">Analytics</a>
  <a onclick="loadPage('settings')">Settings</a>
  <a class="pro" onclick="loadPage('upgrade')">Upgrade</a>
</aside>

<div class="main">
<header class="topbar">
  <h3 id="title">Dashboard</h3>
  <button onclick="logout()">Logout</button>
</header>
<div class="content" id="content"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getAuth,onAuthStateChanged,signOut } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
import { getFirestore,doc,getDoc,setDoc,updateDoc,collection,addDoc,query,where,getDocs,deleteDoc } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

const firebaseConfig = { /* YOUR FIREBASE CONFIG HERE */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const CLOUD='djd8vki8s';
const PRESET='beats_unsigned';

const PLANS={starter:'P-8FN35171F4185880VNFJ5YGI',growth:'P-4MM864528J575140DNFJ5XQQ',professional:'P-1TH20083J44769154NFJ5VTA'};

let user;
const content=document.getElementById('content');
const title=document.getElementById('title');

onAuthStateChanged(auth,async(u)=>{
 if(!u) return location.href='login.html';
 user=u;
 const ref=doc(db,'users',u.uid);
 const snap=await getDoc(ref);
 if(!snap.exists()) await setDoc(ref,{email:u.email,plan:'free'});
 loadPage('home');
});

window.logout=()=>signOut(auth).then(()=>location.href='login.html');

async function upload(file,folder){
 const fd=new FormData();
 fd.append('file',file);
 fd.append('upload_preset',PRESET);
 fd.append('folder',folder);
 const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`,{method:'POST',body:fd});
 const d=await r.json();
 return d.secure_url;
}

window.loadPage=async(p)=>{
 title.innerText=p.toUpperCase();
 if(p==='home') content.innerHTML='<div class="card">Welcome to your producer dashboard</div>';

 if(p==='tracks'){
 content.innerHTML=`<div class="card">
 <h3>Upload Beat</h3>
 <input id="t" placeholder="Title"><input id="b" placeholder="BPM">
 <input id="g" placeholder="Genre"><input id="m" placeholder="Mood">
 <input id="p" placeholder="Price" value="29.99">
 <input id="c" type="file" accept="image/*">
 <input id="f" type="file" accept=".mp3,.wav">
 <button class="primary" onclick="uploadBeat()">Upload</button></div>
 <div class="card"><h3>Your Beats</h3><div id="beats"></div></div>`;
 loadBeats();
 }

 if(p==='analytics') content.innerHTML='<div class="card">Analytics coming soon</div>';

 if(p==='settings') content.innerHTML=`<div class="card">
 <h3>Account Settings</h3>
 <input id="name" placeholder="Display name">
 <input id="photo" type="file" accept="image/*">
 <button class="primary" onclick="saveProfile()">Save</button>
 </div>`;

 if(p==='upgrade'){
 content.innerHTML=`<div class="pricing-grid">
 <div class="card"><h2>Starter</h2><p class="price">$15/year</p><ul><li>Unlimited uploads</li></ul><div id="pp-starter"></div></div>
 <div class="card"><h2>Growth</h2><p class="price">$60/year</p><ul><li>Soundkits & services</li></ul><div id="pp-growth"></div></div>
 <div class="card"><h2>Professional</h2><p class="price">$159/year</p><ul><li>Website & marketing</li></ul><div id="pp-pro"></div></div>
 </div>`;
 setTimeout(()=>{
 renderPayPal('starter','#pp-starter');
 renderPayPal('growth','#pp-growth');
 renderPayPal('professional','#pp-pro');
 },300);
 }
};

window.uploadBeat=async()=>{
 const t=document.getElementById('t').value;
 const f=document.getElementById('f').files[0];
 const c=document.getElementById('c').files[0];
 if(!t||!f||!c) return alert('Missing fields');
 const fileUrl=await upload(f,'beats/'+user.uid);
 const coverUrl=await upload(c,'covers/'+user.uid);
 await addDoc(collection(db,'beats'),{uid:user.uid,title:t,fileUrl,coverUrl,plays:0});
 loadBeats();
};

async function loadBeats(){
 const q=query(collection(db,'beats'),where('uid','==',user.uid));
 const s=await getDocs(q); const list=document.getElementById('beats');
 list.innerHTML='';
 s.forEach(d=>{const b=d.data();list.innerHTML+=`<div class="beat"><img src="${b.coverUrl}"><div>${b.title}</div></div>`});
}

window.saveProfile=async()=>{
 const name=document.getElementById('name').value;
 const file=document.getElementById('photo').files[0];
 let photoURL;
 if(file) photoURL=await upload(file,'profiles/'+user.uid);
 const data={}; if(name) data.name=name; if(photoURL) data.photoURL=photoURL;
 if(Object.keys(data).length===0) return;
 await updateDoc(doc(db,'users',user.uid),data);
 alert('Saved');
};

function renderPayPal(plan,id){
 paypal.Buttons({
 createSubscription:(d,a)=>a.subscription.create({plan_id:PLANS[plan]}),
 onApprove:async(data)=>{
 await updateDoc(doc(db,'users',user.uid),{plan,paypal:data.subscriptionID});
 alert('Plan activated'); loadPage('home');
 }
 }).render(id);
}
</script>
</body>
</html>
