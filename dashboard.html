<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Producer Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0b1020;
  color: #fff;
}
.app {
  display: flex;
}
.sidebar {
  width: 260px;
  background: #0e1430;
  padding: 20px;
  min-height: 100vh;
}
.sidebar h2 {
  margin: 0 0 20px;
}
.sidebar a {
  display: block;
  padding: 10px;
  border-radius: 6px;
  color: #cfd3ff;
  text-decoration: none;
  margin-bottom: 6px;
}
.sidebar a:hover {
  background: #1a2150;
}
.main {
  flex: 1;
  padding: 20px;
}
.hidden {
  display: none;
}
.card {
  background: #121a3a;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 16px;
}
input, select, textarea, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
  border: none;
}
button {
  background: #5b6cff;
  color: white;
  cursor: pointer;
}
button.secondary {
  background: #2a335f;
}
@media(max-width:768px){
  .sidebar {
    position: fixed;
    z-index: 99;
    left: 0;
    top: 0;
    transform: translateX(-100%);
    transition: 0.3s;
  }
  .sidebar.open {
    transform: translateX(0);
  }
}
</style>
</head>

<body>
<div class="app">

<div class="sidebar" id="sidebar">
  <h2 id="producerName">Producer</h2>
  <a onclick="showPage('dashboard')">Dashboard</a>
  <a onclick="showPage('content')">Content</a>
  <a onclick="showPage('upload')">Upload</a>
  <a onclick="showPage('licenses')">Licenses</a>
  <a onclick="showPage('finance')">Finance</a>
  <a onclick="showPage('analytics')">Analytics</a>
  <a onclick="showPage('pro')">Pro</a>
  <a onclick="showPage('discounts')">Discounts</a>
  <a onclick="showPage('settings')">Settings</a>
  <a onclick="logout()">Logout</a>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="page">
  <div class="card">
    <h3>Latest Sales</h3>
    <div id="sales"></div>
  </div>
</div>

<!-- UPLOAD -->
<div id="upload" class="page hidden">
  <div class="card">
    <h3>Upload</h3>
    <select id="uploadType">
      <option value="track">Beat</option>
      <option value="soundkit">Sound Kit</option>
      <option value="service">Service</option>
    </select>
    <input id="title" placeholder="Title">
    <input id="price" placeholder="Price">
    <input id="image" placeholder="Cover Image URL (Cloudinary)">
    <button onclick="upload()">Upload</button>
  </div>
</div>

<!-- CONTENT -->
<div id="content" class="page hidden">
  <div class="card">
    <h3>Your Content</h3>
    <div id="contentList"></div>
  </div>
</div>

<!-- LICENSES -->
<div id="licenses" class="page hidden">
  <div class="card">
    <h3>Create License</h3>
    <input id="licenseName" placeholder="License Name">
    <textarea id="licenseTerms" placeholder="Terms"></textarea>
    <button onclick="createLicense()">Save License</button>
  </div>
</div>

<!-- FINANCE -->
<div id="finance" class="page hidden">
  <div class="card">
    <h3>Earnings</h3>
    <div id="earnings">$0</div>
  </div>
</div>

<!-- ANALYTICS -->
<div id="analytics" class="page hidden">
  <div class="card">
    <h3>Stats</h3>
    <div id="stats"></div>
  </div>
</div>

<!-- PRO -->
<div id="pro" class="page hidden">
  <div class="card">
    <h3>Upgrade to Pro</h3>
    <button onclick="upgrade()">Upgrade</button>
  </div>
</div>

<!-- DISCOUNTS -->
<div id="discounts" class="page hidden">
  <div class="card">
    <h3>Discounts (Pro)</h3>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="page hidden">
  <div class="card">
    <h3>Profile</h3>
    <input id="displayName" placeholder="Display Name">
    <input id="photoURL" placeholder="Profile Image URL">
    <button onclick="saveProfile()">Save</button>
  </div>
</div>

</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi",
  storageBucket: "prodbybigi.firebasestorage.app",
  messagingSenderId: "1040553526206",
  appId: "1:1040553526206:web:38216a9f75eabfe556efef"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let user;

auth.onAuthStateChanged(async u => {
  if(!u) return location.href = "/login.html";
  user = u;
  const doc = await db.collection("producers").doc(u.uid).get();
  if(doc.exists) {
    document.getElementById("producerName").innerText = doc.data().displayName || "Producer";
  }
});

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function upload(){
  db.collection("content").add({
    uid: user.uid,
    type: uploadType.value,
    title: title.value,
    price: price.value,
    image: image.value,
    created: Date.now()
  });
  alert("Uploaded");
}

function createLicense(){
  db.collection("licenses").add({
    uid: user.uid,
    name: licenseName.value,
    terms: licenseTerms.value
  });
  alert("License saved");
}

function saveProfile(){
  db.collection("producers").doc(user.uid).set({
    displayName: displayName.value,
    photoURL: photoURL.value
  },{merge:true});
  alert("Profile updated");
}

function upgrade(){
  db.collection("producers").doc(user.uid).update({plan:"pro"});
  alert("Pro unlocked");
}

function logout(){
  auth.signOut();
}
</script>
</body>
</html>
