<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Producer Studio</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Cloudinary -->
<script src="https://upload-widget.cloudinary.com/global/all.js"></script>

<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system}
body{margin:0;background:#0b0f19;color:#fff}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#0f1525;padding:20px}
.logo{color:#ff4d4d;font-weight:700;margin-bottom:30px}
.nav a{display:block;padding:12px;color:#cbd5e1;text-decoration:none;border-radius:8px;margin-bottom:6px}
.nav a:hover,.nav a.active{background:#1e293b;color:#fff}
.main{flex:1;padding:24px;max-width:1200px}
.card{background:#111827;padding:24px;border-radius:12px;max-width:720px}
h1{margin-top:0}
label{display:block;margin-top:16px;color:#9ca3af;font-size:14px}
input,textarea,select{width:100%;margin-top:6px;padding:12px;border-radius:8px;border:none;background:#1f2937;color:#fff}
.actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
button{background:#ff4d4d;border:none;padding:12px 18px;border-radius:8px;color:#fff;cursor:pointer}
.hidden{display:none}

@media(max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%}
}
</style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">Producer Studio</div>
    <nav class="nav">
      <a onclick="showPage('dashboard')" class="active">Dashboard</a>
      <a onclick="showPage('upload')">Upload</a>
      <a onclick="showPage('content')">Content</a>
      <a onclick="showPage('settings')">Settings</a>
      <a onclick="logout()">Logout</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- DASHBOARD -->
    <section id="dashboard">
      <div class="card">
        <h1>Dashboard</h1>
        <p>Welcome back. Your latest uploads and sales will appear here.</p>
      </div>
    </section>

    <!-- UPLOAD -->
    <section id="upload" class="hidden">
      <div class="card">
        <h1>Upload New Content</h1>

        <label>Type</label>
        <select id="type">
          <option value="beat">Beat</option>
          <option value="soundkit">Sound Kit</option>
          <option value="service">Service</option>
        </select>

        <label>Title</label>
        <input id="title" placeholder="Product title" />

        <label>Description</label>
        <textarea id="description"></textarea>

        <div class="actions">
          <button onclick="uploadArtwork()">Upload Artwork</button>
          <button onclick="uploadFile()">Upload File</button>
          <button onclick="publish()">Publish</button>
        </div>

        <p id="uploadStatus"></p>
      </div>
    </section>

    <!-- CONTENT -->
    <section id="content" class="hidden">
      <div class="card">
        <h1>Your Content</h1>
        <ul id="contentList"></ul>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="settings" class="hidden">
      <div class="card">
        <h1>Settings</h1>

        <label>Display Name</label>
        <input id="displayName" />

        <label>Profile Image</label>
        <button onclick="uploadAvatar()">Upload Avatar</button>

        <div class="actions">
          <button onclick="saveProfile()">Save</button>
        </div>
      </div>
    </section>

  </main>
</div>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi"
});

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user=>{
  if(!user) location.href="/login.html";
});

/* NAV */
function showPage(id){
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll(".nav a").forEach(a=>a.classList.remove("active"));
}

/* CLOUDINARY */
const cloudName="djd8vkI8s";
let artworkURL="", fileURL="";

function uploadArtwork(){
  cloudinary.openUploadWidget({
    cloudName,
    uploadPreset:"unsigned_images"
  },(e,r)=>{
    if(!e && r.event==="success"){
      artworkURL=r.info.secure_url;
      alert("Artwork uploaded");
    }
  });
}

function uploadFile(){
  cloudinary.openUploadWidget({
    cloudName,
    uploadPreset:"unsigned_audio",
    resourceType:"auto"
  },(e,r)=>{
    if(!e && r.event==="success"){
      fileURL=r.info.secure_url;
      alert("File uploaded");
    }
  });
}

/* PUBLISH */
function publish(){
  const user=auth.currentUser;
  if(!user)return;

  db.collection("content").add({
    uid:user.uid,
    type:type.value,
    title:title.value,
    description:description.value,
    artwork:artworkURL,
    file:fileURL,
    created:firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    uploadStatus.innerText="Published successfully";
    loadContent();
  });
}

/* LOAD CONTENT */
function loadContent(){
  const user=auth.currentUser;
  db.collection("content").where("uid","==",user.uid)
    .onSnapshot(snap=>{
      contentList.innerHTML="";
      snap.forEach(d=>{
        const li=document.createElement("li");
        li.innerText=d.data().title+" ("+d.data().type+")";
        contentList.appendChild(li);
      });
    });
}

/* SETTINGS */
function uploadAvatar(){
  cloudinary.openUploadWidget({
    cloudName,
    uploadPreset:"unsigned_images"
  },(e,r)=>{
    if(!e && r.event==="success"){
      db.collection("users").doc(auth.currentUser.uid)
        .set({avatar:r.info.secure_url},{merge:true});
    }
  });
}

function saveProfile(){
  db.collection("users").doc(auth.currentUser.uid)
    .set({displayName:displayName.value},{merge:true});
}

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location.href="/login.html");
}

loadContent();
</script>
</body>
</html>
