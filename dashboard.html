<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Producer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:#0b0d12;color:#fff;display:flex;min-height:100vh}

/* ===== SIDEBAR ===== */
.sidebar{
  width:260px;
  background:#0f1219;
  padding:22px;
  position:fixed;
  left:0;top:0;bottom:0;
  border-right:1px solid #1d2230;
  transition:.3s;
  z-index:1000;
}
.sidebar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.sidebar h1{font-size:22px;color:#6cf;margin:0}
.close-btn{
  display:none;
  font-size:22px;
  cursor:pointer;
}
.sidebar a{
  display:block;
  padding:12px 14px;
  border-radius:12px;
  color:#b8c1d9;
  text-decoration:none;
  margin:6px 0;
  font-weight:500;
}
.sidebar a:hover{background:#1b2133;color:#fff}
.sidebar .locked{opacity:.5}
.sidebar .upgrade{
  background:linear-gradient(135deg,#6cf,#9f6cff);
  color:#000;
  font-weight:700;
  text-align:center;
  margin-top:16px;
}

/* ===== MAIN ===== */
.main{flex:1;margin-left:260px;display:flex;flex-direction:column}
.topbar{
  height:72px;
  background:#0f1219;
  border-bottom:1px solid #1d2230;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}
.hamburger{
  font-size:22px;
  cursor:pointer;
  display:none;
}
.logout{
  background:#ef4444;
  border:none;
  padding:8px 14px;
  border-radius:10px;
  font-weight:600;
  color:#fff;
  cursor:pointer;
}

.content{padding:26px}
.page{display:none}
.page.active{display:block}

/* ===== CARDS ===== */
.card{
  background:#121726;
  border:1px solid #1d2230;
  border-radius:18px;
  padding:22px;
  margin-bottom:22px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.stat{
  background:#0f1219;
  border:1px solid #1d2230;
  border-radius:16px;
  padding:18px;
}
.stat h4{margin:0;color:#6cf}
.stat p{font-size:22px;font-weight:700;margin:6px 0 0}

/* ===== INPUTS ===== */
input,textarea{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #1d2230;
  margin-top:10px;
  background:#0f1219;
  color:#fff;
}
button{
  background:#6cf;
  border:none;
  padding:10px 16px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  color:#000;
  margin-top:12px;
}
button.small{padding:7px 12px;font-size:13px}

/* ===== MOBILE ===== */
@media(max-width:900px){
  .main{margin-left:0}
  .hamburger{display:block}
  .sidebar{
    transform:translateX(-100%);
  }
  .sidebar.show{
    transform:translateX(0);
  }
  .close-btn{
    display:block;
  }
}
</style>
</head>

<body>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>ProdByBigi</h1>
    <span class="close-btn" onclick="toggleSidebar()">✕</span>
  </div>

  <a onclick="show('dashboard')">Dashboard</a>
  <a onclick="show('upload')">Upload Beat</a>
  <a onclick="show('beats')">My Beats</a>
  <a onclick="show('finance')">Finance</a>
  <a class="locked">Analytics 🔒</a>
  <a onclick="show('settings')">Account Settings</a>
  <a onclick="show('upgrade')" class="upgrade">Upgrade</a>
</div>

<!-- ===== MAIN ===== -->
<div class="main">
  <div class="topbar">
    <span class="hamburger" onclick="toggleSidebar()">☰</span>
    <strong id="title">Dashboard</strong>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="content">

    <!-- DASHBOARD -->
    <div id="dashboard" class="page active">
      <div class="grid">
        <div class="stat"><h4>Total Beats</h4><p id="statBeats">0</p></div>
        <div class="stat"><h4>Total Plays</h4><p>0</p></div>
        <div class="stat"><h4>Total Revenue</h4><p>$0.00</p></div>
      </div>
    </div>

    <!-- UPLOAD -->
    <div id="upload" class="page">
      <div class="card">
        <h3>Upload Beat</h3>
        <input id="beatTitle" placeholder="Title">
        <input id="beatBpm" type="number" placeholder="BPM">
        <input id="beatGenre" placeholder="Genre">
        <input id="beatPrice" type="number" placeholder="Price">
        <button onclick="uploadBeat()">Publish Beat</button>
      </div>
    </div>

    <!-- MY BEATS -->
    <div id="beats" class="page">
      <div class="card">
        <h3>My Beats</h3>
        <div id="beatList"></div>
      </div>
    </div>

    <!-- FINANCE -->
    <div id="finance" class="page">
      <div class="card">
        <h3>Wallet</h3>
        <p>Balance: <strong>$0.00</strong></p>
        <button>Request Payout</button>
      </div>
    </div>

    <!-- SETTINGS -->
    <div id="settings" class="page">
      <div class="card">
        <h3>Account Settings</h3>
        <input placeholder="Display Name">
        <button>Save</button>
      </div>
    </div>

    <!-- UPGRADE -->
    <div id="upgrade" class="page">
      <div class="card">
        <h3>Upgrade to Unlock Analytics</h3>
        <p>Advanced stats, sales charts, payouts.</p>
        <button>Upgrade Now</button>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
import { getFirestore, collection, addDoc, getDocs } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain:"prodbybigi.firebaseapp.com",
  projectId:"prodbybigi"
});
const auth = getAuth(app);
const db = getFirestore(app);

window.toggleSidebar = () => {
  sidebar.classList.toggle('show');
};

window.show = p => {
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById(p).classList.add('active');
  title.textContent = p;
  if(innerWidth<900) sidebar.classList.remove('show');
};

window.logout = () => signOut(auth).then(()=>location.href='login.html');

window.uploadBeat = async () => {
  await addDoc(collection(db,'beats'),{
    title:beatTitle.value,
    bpm:+beatBpm.value,
    genre:beatGenre.value,
    price:+beatPrice.value,
    plays:0
  });
  loadBeats();
};

async function loadBeats(){
  beatList.innerHTML='';
  const q=await getDocs(collection(db,'beats'));
  statBeats.textContent=q.size;
  q.forEach(d=>{
    beatList.innerHTML+=`<p>${d.data().title}</p>`;
  });
}

onAuthStateChanged(auth,u=>{
  if(!u) location.href='login.html';
  loadBeats();
});
</script>

</body>
</html>
