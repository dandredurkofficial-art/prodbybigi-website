<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProdByBigi – Producer Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; font-family: Inter, sans-serif; }
    body { margin: 0; background: #0b0f14; color: #e5e7eb; display: flex; height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: #0f172a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1f2937;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 24px;
    }

    .nav a {
      display: block;
      padding: 10px 14px;
      margin-bottom: 6px;
      border-radius: 8px;
      color: #cbd5f5;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }

    .nav a:hover { background: #1e293b; }

    .upgrade {
      margin-top: auto;
      background: linear-gradient(135deg,#38bdf8,#818cf8);
      color: #020617 !important;
      font-weight: 600;
      text-align: center;
    }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; }

    .topbar {
      height: 64px;
      background: #020617;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .content { padding: 24px; overflow-y: auto; }

    /* Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 16px; }

    .card {
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 18px;
    }

    .card h3 { margin: 0 0 10px; font-size: 16px; }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #fff;
      margin-top: 8px;
    }

    button {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #1f2937;
      font-size: 14px;
      text-align: left;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .hamburger { display: block; }
      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        height: 100%;
        z-index: 1000;
        transition: left .3s ease;
      }
      .sidebar.open { left: 0; }
    }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">ProdByBigi</div>
  <nav class="nav">
    <a onclick="loadPage('dashboard')">Dashboard</a>
    <a onclick="loadPage('tracks')">Tracks</a>
    <a onclick="loadPage('analytics')">Analytics</a>
    <a onclick="loadPage('finance')">Finance</a>
    <a onclick="loadPage('settings')">Settings</a>
    <a class="upgrade" onclick="loadPage('upgrade')">Upgrade Plan</a>
  </nav>
</aside>

<div class="main">
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <strong id="pageTitle">Dashboard</strong>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="content" id="content"></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
    authDomain: "prodbybigi.firebaseapp.com",
    projectId: "prodbybigi",
    storageBucket: "prodbybigi.firebasestorage.app",
    messagingSenderId: "1040553526206",
    appId: "1:1040553526206:web:38216a9f75eabfe556efef"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const sidebar = document.getElementById('sidebar');
  const content = document.getElementById('content');
  const pageTitle = document.getElementById('pageTitle');

  window.toggleSidebar = () => sidebar.classList.toggle('open');

  window.logout = async () => { await signOut(auth); location.href = 'login.html'; };

  window.loadPage = (page) => {
    sidebar.classList.remove('open');

    if (page === 'dashboard') {
      pageTitle.innerText = 'Dashboard';
      content.innerHTML = `
        <div class='grid'>
          <div class='card'><h3>Total Beats</h3><strong>0</strong></div>
          <div class='card'><h3>Total Plays</h3><strong>0</strong></div>
          <div class='card'><h3>Total Sales</h3><strong>$0.00</strong></div>
          <div class='card'><h3>Current Plan</h3><strong>Free</strong></div>
        </div>`;
    }

    if (page === 'tracks') {
      pageTitle.innerText = 'Tracks';
      content.innerHTML = `<div class='card'><h3>Your Beats</h3><p>Upload & manage beats here.</p></div>`;
    }

    if (page === 'analytics') {
      pageTitle.innerText = 'Analytics';
      content.innerHTML = `
        <div class='grid'>
          <div class='card'><h3>Plays</h3><strong>0</strong></div>
          <div class='card'><h3>Views</h3><strong>0</strong></div>
          <div class='card'><h3>Conversion</h3><strong>0%</strong></div>
        </div>`;
    }

    if (page === 'finance') {
      pageTitle.innerText = 'Finance';
      content.innerHTML = `
        <div class='card'>
          <h3>Earnings</h3>
          <table>
            <thead><tr><th>Date</th><th>Product</th><th>Amount</th></tr></thead>
            <tbody><tr><td>-</td><td>-</td><td>$0.00</td></tr></tbody>
          </table>
        </div>`;
    }

    if (page === 'settings') {
      pageTitle.innerText = 'Settings';
      content.innerHTML = `
        <div class='card'>
          <h3>Account Settings</h3>
          <input placeholder='Display Name' />
          <input placeholder='Email' disabled />
          <button>Save Changes</button>
        </div>`;
    }

    if (page === 'upgrade') {
      pageTitle.innerText = 'Upgrade Plan';
      content.innerHTML = `
        <div class='grid'>
          <div class='card'><h3>Starter</h3><p>$15 / year</p></div>
          <div class='card'><h3>Growth</h3><p>$60 / year</p></div>
          <div class='card'><h3>Professional</h3><p>$159 / year</p></div>
        </div>`;
    }
  };

  onAuthStateChanged(auth, async (u) => {
    if (!u) return location.href = 'login.html';
    const ref = doc(db,'users',u.uid);
    if (!(await getDoc(ref)).exists()) await setDoc(ref,{ email:u.email, plan:'free' });
    loadPage('dashboard');
  });
</script>

</body>
</html>
