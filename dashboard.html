<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Producer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.paypal.com/sdk/js?client-id=AdurYcARCdHIlIJL9uH2ui23x2VV4AUbuGdTeBGDJUMTdb99sc7ntdekg8jszs3v6r1UXeJrfJ9oXPvO&vault=true&intent=subscription"></script>

<style>
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:#0b0b0b;color:#fff;display:flex;height:100vh}
.sidebar{width:240px;background:#111;padding:20px;display:flex;flex-direction:column}
.sidebar h2{color:#6cf}
.sidebar a{padding:10px;border-radius:8px;color:#bbb;text-decoration:none;margin-bottom:6px;cursor:pointer;font-size:14px}
.sidebar a:hover{background:#1c1c1c;color:#fff}
.main{flex:1;display:flex;flex-direction:column}
.top{height:60px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.content{padding:24px;overflow:auto}
.card{background:#141414;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:20px}
input,select,button{width:100%;padding:10px;border-radius:8px;border:none;margin-top:8px;font-size:14px}
button{background:#6cf;color:#000;font-weight:600;cursor:pointer}
button.small{padding:6px 10px;font-size:12px}
img.cover{width:80px;height:80px;border-radius:10px;object-fit:cover}
.beat{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.badge{font-size:12px;color:#6cf}
.plan{border:1px solid #333;border-radius:14px;padding:20px}
.plan h3{margin:0}
.plan ul{padding-left:18px;font-size:14px;color:#ccc}
</style>
</head>

<body>

<div class="sidebar">
  <h2>ProdByBigi</h2>
  <a onclick="loadPage('dashboard')">Dashboard</a>
  <a onclick="loadPage('tracks')">Tracks</a>
  <a onclick="loadPage('analytics')">Analytics</a>
  <a onclick="loadPage('settings')">Settings</a>
  <a onclick="loadPage('upgrade')">Upgrade</a>
</div>

<div class="main">
  <div class="top">
    <strong id="title">Dashboard</strong>
    <button class="small" onclick="logout()">Logout</button>
  </div>
  <div class="content" id="content"></div>
</div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { getFirestore,collection,addDoc,getDocs,query,where,doc,getDoc,setDoc,updateDoc,deleteDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi",
  storageBucket: "prodbybigi.firebasestorage.app",
  messagingSenderId: "1040553526206",
  appId: "1:1040553526206:web:38216a9f75eabfe556efef",
  measurementId: "G-7HR862H9L7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= CLOUDINARY ================= */
const CLOUD = "djd8vki8s";
const PRESET = "beats_unsigned";

/* ================= GLOBAL ================= */
let user=null;
const content=document.getElementById("content");
const title=document.getElementById("title");

/* ================= UTILS ================= */
async function uploadCloud(file,folder){
  const fd=new FormData();
  fd.append("file",file);
  fd.append("upload_preset",PRESET);
  fd.append("folder",folder);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/auto/upload`,{method:"POST",body:fd});
  const d=await r.json();
  return d.secure_url;
}

/* ================= NAV ================= */
window.loadPage=async(p)=>{
  title.innerText=p.charAt(0).toUpperCase()+p.slice(1);
  if(p==="dashboard") content.innerHTML=`<div class="card">Welcome back 👋</div>`;
  if(p==="analytics") content.innerHTML=`<div class="card">Analytics coming soon 📊</div>`;
  if(p==="tracks") renderTracks();
  if(p==="settings") renderSettings();
  if(p==="upgrade") renderUpgrade();
};

/* ================= TRACKS ================= */
async function renderTracks(){
content.innerHTML=`
<div class="card">
<h3>Upload Beat</h3>
<input id="t" placeholder="Title"/>
<input id="bpm" placeholder="BPM"/>
<input id="genre" placeholder="Genre"/>
<input id="mood" placeholder="Mood"/>
<input id="price" placeholder="Price (USD)"/>
<input type="file" id="cover" accept="image/*"/>
<input type="file" id="file" accept=".mp3,.wav"/>
<button onclick="uploadBeat()">Upload</button>
</div>
<div class="card"><h3>Your Beats</h3><div id="list"></div></div>`;
loadBeats();
}

window.uploadBeat=async()=>{
const t=t.value,b=bpm.value,g=genre.value,m=mood.value,p=price.value;
if(!t||!file.files[0]||!cover.files[0])return alert("Missing fields");
const fu=await uploadCloud(file.files[0],`beats/${user.uid}`);
const cu=await uploadCloud(cover.files[0],`covers/${user.uid}`);
await addDoc(collection(db,"beats"),{uid:user.uid,title:t,bpm:b,genre:g,mood:m,price:p,plays:0,fileUrl:fu,coverUrl:cu});
loadBeats();
};

async function loadBeats(){
const q=query(collection(db,"beats"),where("uid","==",user.uid));
const s=await getDocs(q);
const l=document.getElementById("list");
l.innerHTML="";
s.forEach(d=>{
const b=d.data();
l.innerHTML+=`
<div class="beat">
<img class="cover" src="${b.coverUrl}">
<div style="flex:1">
<strong>${b.title}</strong><br>
<span class="badge">${b.bpm} BPM • ${b.genre} • ${b.mood}</span><br>
<span class="badge">$${b.price} • ▶ ${b.plays}</span>
<audio controls src="${b.fileUrl}"></audio>
</div>
<button class="small" onclick="deleteBeat('${d.id}')">Delete</button>
</div>`;
});
}

window.deleteBeat=async(id)=>{
await deleteDoc(doc(db,"beats",id));
loadBeats();
};

/* ================= SETTINGS ================= */
function renderSettings(){
content.innerHTML=`
<div class="card">
<h3>Profile</h3>
<input id="name" placeholder="Display name"/>
<input type="file" id="avatar"/>
<button onclick="saveProfile()">Save</button>
</div>`;
}

window.saveProfile=async()=>{
const data={};
if(name.value) data.name=name.value;
if(avatar.files[0]) data.avatar=await uploadCloud(avatar.files[0],`avatars/${user.uid}`);
await updateDoc(doc(db,"users",user.uid),data);
alert("Saved");
};

/* ================= UPGRADE ================= */
function renderUpgrade(){
content.innerHTML=`
<div class="card plan">
<h3>Starter – $15/year</h3>
<ul>
<li>0% commission</li><li>Unlimited MP3/WAV</li><li>Instant payouts</li>
</ul>
<div id="paypal-starter"></div>
</div>

<div class="card plan">
<h3>Growth – $60/year</h3>
<ul>
<li>Stems</li><li>Soundkits</li><li>Unlimited messages</li>
</ul>
<div id="paypal-growth"></div>
</div>

<div class="card plan">
<h3>Professional – $159/year</h3>
<ul>
<li>Website + domain</li><li>Merch & memberships</li><li>Marketing tools</li>
</ul>
<div id="paypal-pro"></div>
</div>`;

paypal.Buttons({createSubscription:()=> "P-8FN35171F4185880VNFJ5YGI"}).render("#paypal-starter");
paypal.Buttons({createSubscription:()=> "P-4MM864528J575140DNFJ5XQQ"}).render("#paypal-growth");
paypal.Buttons({createSubscription:()=> "P-1TH20083J44769154NFJ5VTA"}).render("#paypal-pro");
}

/* ================= AUTH ================= */
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
if(!u)location.href="login.html";
user=u;
const r=doc(db,"users",u.uid);
if(!(await getDoc(r)).exists()) await setDoc(r,{email:u.email,plan:"free"});
loadPage("dashboard");
});
</script>

</body>
</html>
