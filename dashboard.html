<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | ProdByBigi</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
    body { background:#0d0d0d; color:#fff; display:flex; height:100vh; }

    .sidebar { width:260px; background:#111; padding:24px; display:flex; flex-direction:column; border-right:1px solid #222; }
    .logo { font-size:20px; font-weight:700; color:#6cf; margin-bottom:30px; }
    .nav a { display:block; padding:12px; color:#bbb; text-decoration:none; border-radius:8px; cursor:pointer; }
    .nav a:hover { background:#1b1b1b; color:#fff; }
    .nav .pro { margin-top:auto; background:linear-gradient(135deg,#6cf,#9f6cff); color:#000; font-weight:600; text-align:center; }

    .main { flex:1; display:flex; flex-direction:column; }
    .topbar { height:70px; background:#111; border-bottom:1px solid #222; display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
    .hamburger { display:none; background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
    .content { padding:30px; overflow-y:auto; }

    .card { background:#141414; border:1px solid #222; border-radius:14px; padding:20px; margin-bottom:20px; }
    input, button { margin-top:10px; padding:10px; border-radius:8px; border:none; width:100%; }
    button { background:#6cf; font-weight:600; cursor:pointer; }

    @media (max-width:768px){
      .hamburger{display:block;}
      .sidebar{position:fixed; left:-260px; top:0; height:100%; transition:0.3s; z-index:1000;}
      .sidebar.open{left:0;}
    }
  </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="logo">ProdByBigi</div>
  <nav class="nav">
    <a onclick="loadPage('home')">Dashboard</a>
    <a onclick="loadPage('tracks')">Tracks</a>
    <a onclick="loadPage('analytics')">Analytics</a>
    <a onclick="loadPage('finance')">Finance</a>
    <a onclick="loadPage('settings')">Settings</a>
    <a class="pro" onclick="loadPage('upgrade')">Upgrade to Pro</a>
  </nav>
</aside>

<div class="main">
  <header class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <h2 id="pageTitle">Dashboard</h2>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="content" id="content"></div>
</div>

<script type="module">
  import { auth } from './firebase.js';
  import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';
  import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js';

  const db = getFirestore();
  const storage = getStorage();

  const content = document.getElementById('content');
  const pageTitle = document.getElementById('pageTitle');
  const sidebar = document.getElementById('sidebar');

  let currentUser = null;

  // 🔓 EXPOSE FUNCTIONS GLOBALLY (FIXES UNCLICKABLE UI)
  window.toggleSidebar = () => sidebar.classList.toggle('open');

  window.logout = async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  };

  window.loadPage = async (page) => {
    sidebar.classList.remove('open');

    if (page === 'home') {
      pageTitle.innerText = 'Dashboard';
      content.innerHTML = `<div class="card">Welcome to your producer dashboard 🎶</div>`;
    }

    if (page === 'tracks') {
      pageTitle.innerText = 'Tracks';
      content.innerHTML = `
        <div class="card">
          <h3>Upload Beat</h3>
          <input id="beatTitle" placeholder="Beat title" />
          <input id="beatArtist" placeholder="Artist fits (e.g. Drake, Lil Baby)" />
          <input id="beatBpm" type="number" placeholder="BPM" />
          <input id="beatGenre" placeholder="Genre" />
          <input id="beatMood" placeholder="Mood" />
          <input id="beatTags" placeholder="Tags (comma separated)" />
          <label>Cover Image</label>
          <input id="beatCover" type="file" accept="image/*" />
          <label>Beat File</label>
          <input id="beatFile" type="file" accept=".mp3,.wav" />
          <button onclick="uploadBeat()">Upload Beat</button>
          <p id="uploadMsg"></p>
        </div>
        <div class="card">
          <h3>Your Beats</h3>
          <div id="beatList">Loading...</div>
        </div>
      `;
      loadBeats();
    }

    if (page === 'analytics') {
      pageTitle.innerText = 'Analytics';
      content.innerHTML = `<div class="card">Analytics coming soon 📊</div>`;
    }

    if (page === 'finance') {
      pageTitle.innerText = 'Finance';
      content.innerHTML = `<div class="card">Finance & payouts coming soon 💰</div>`;
    }

    if (page === 'settings') {
      pageTitle.innerText = 'Settings';
      content.innerHTML = `<div class="card">Account settings coming soon ⚙️</div>`;
    }

    if (page === 'upgrade') {
      pageTitle.innerText = 'Upgrade to Pro';
      content.innerHTML = `<div class="card"><h3>Go Pro</h3><p>Unlimited uploads</p></div>`;
    }
  };

  window.uploadBeat = async () => {
    const title = document.getElementById('beatTitle').value;
    const artist = document.getElementById('beatArtist').value;
    const bpm = document.getElementById('beatBpm').value;
    const genre = document.getElementById('beatGenre').value;
    const mood = document.getElementById('beatMood').value;
    const tags = document.getElementById('beatTags').value.split(',').map(t => t.trim()).filter(Boolean);
    const file = document.getElementById('beatFile').files[0];
    const cover = document.getElementById('beatCover').files[0];
    const msg = document.getElementById('uploadMsg');

    if (!title || !file || !cover) {
      msg.innerText = 'Title, beat file, and cover image are required';
      return;
    }

    const userRef = doc(db, 'users', currentUser.uid);
    const userSnap = await getDoc(userRef);
    const user = userSnap.data();

    if (user.plan === 'free' && user.uploads >= 10) {
      msg.innerText = 'Upload limit reached. Upgrade to Pro.';
      return;
    }

    try {
      msg.innerText = 'Uploading beat file...';
      const beatRef = ref(storage, `beats/${currentUser.uid}/${Date.now()}-${file.name}`);
      await uploadBytes(beatRef, file);
      const beatUrl = await getDownloadURL(beatRef);

      msg.innerText = 'Uploading cover...';
      const coverRef = ref(storage, `covers/${currentUser.uid}/${Date.now()}-${cover.name}`);
      await uploadBytes(coverRef, cover);
      const coverUrl = await getDownloadURL(coverRef);

      await addDoc(collection(db, 'beats'), {
        uid: currentUser.uid,
        title,
        artistFit: artist,
        bpm: Number(bpm),
        genre,
        mood,
        tags,
        fileUrl: beatUrl,
        coverUrl,
        plays: 0,
        createdAt: new Date()
      });

      await updateDoc(userRef, { uploads: user.uploads + 1 });

      msg.innerText = 'Upload successful 🎶';
      loadBeats();

    } catch (err) {
      console.error(err);
      msg.innerText = 'Upload failed. Check console.';
    }
  };

  window.loadBeats = async () => {
    const q = query(collection(db, 'beats'), where('uid', '==', currentUser.uid));
    const snapshot = await getDocs(q);
    const beatList = document.getElementById('beatList');

    beatList.innerHTML = snapshot.empty ? 'No beats uploaded yet.' : '';

    snapshot.forEach(docSnap => {
      const beat = docSnap.data();
      beatList.innerHTML += `
        <div class="card">
          <p>🎧 <strong>${beat.title}</strong></p>
          <p>▶ Plays: ${beat.plays || 0}</p>
          <button onclick="playBeat('${docSnap.id}', '${beat.fileUrl}')">Play</button>
        </div>
      `;
    });
  };

  window.playBeat = async (beatId, url) => {
    const audio = new Audio(url);
    audio.play();
    const beatRef = doc(db, 'beats', beatId);
    const snap = await getDoc(beatRef);
    await updateDoc(beatRef, { plays: (snap.data().plays || 0) + 1 });
  };

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    currentUser = user;
    const userRef = doc(db, 'users', user.uid);
    const snap = await getDoc(userRef);

    if (!snap.exists()) {
      await setDoc(userRef, {
        email: user.email,
        plan: 'free',
        uploads: 0,
        createdAt: new Date()
      });
    }

    loadPage('home');
  });
</script>

</body>
</html>
