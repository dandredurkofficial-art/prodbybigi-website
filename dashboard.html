<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producer Studio</title>

<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<!-- ✅ ADDED: Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi",
  storageBucket: "prodbybigi.firebasestorage.app",
  messagingSenderId: "1040553526206",
  appId: "1:1040553526206:web:38216a9f75eabfe556efef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let uploadedAudio = null;

/* ---------------- AUTH ---------------- */
onAuthStateChanged(auth, user => {
  if (!user) location.href = "login.html";
  currentUser = user;
  loadBeats();
});

/* ---------------- CLOUDINARY ---------------- */
window.uploadAudio = function () {
  cloudinary.openUploadWidget({
    cloudName: "djd8vkI8s", // ✅ YOUR CLOUD
    uploadPreset: "unsigned_audio",
    resourceType: "video"
  }, (err, res) => {
    if (res?.event === "success") {
      uploadedAudio = res.info.secure_url;
      alert("Audio uploaded successfully");
    }
  });
};

/* ---------------- SAVE BEAT ---------------- */
window.publishBeat = async function () {
  if (!uploadedAudio) return alert("Upload audio first");

  const beat = {
    producerId: currentUser.uid,
    title: title.value,
    description: desc.value,
    bpm: bpm.value,
    key: key.value,
    audioUrl: uploadedAudio,

    licenses: {
      basic: { enabled: basicEnabled.checked, price: Number(basicPrice.value) },
      premium: { enabled: premiumEnabled.checked, price: Number(premiumPrice.value) },
      exclusive: { enabled: exclusiveEnabled.checked, price: Number(exclusivePrice.value) }
    },

    freeDownload: freeDownload.checked,
    bulkDiscount: bulkDiscount.checked,
    createdAt: serverTimestamp()
  };

  await addDoc(collection(db, "beats"), beat);
  alert("Beat published successfully");
  loadBeats();
};

/* ---------------- LOAD TRACKS ---------------- */
async function loadBeats() {
  if (!currentUser) return;

  const q = query(
    collection(db, "beats"),
    where("producerId", "==", currentUser.uid)
  );

  const snap = await getDocs(q);
  beats.innerHTML = "";

  snap.forEach(doc => {
    const b = doc.data();
    beats.innerHTML += `
      <div class="card">
        <strong>${b.title}</strong>
        <p>
          MP3: ${b.licenses.basic.enabled ? "$" + b.licenses.basic.price : "Off"} |
          WAV: ${b.licenses.premium.enabled ? "$" + b.licenses.premium.price : "Off"} |
          EXCL: ${b.licenses.exclusive.enabled ? "$" + b.licenses.exclusive.price : "Off"}
        </p>
      </div>
    `;
  });
}

/* ---------------- UI ---------------- */
window.toggleMenu = function () {
  document.getElementById("sidebar").classList.toggle("open");
};

window.showPage = function (id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  document.getElementById("sidebar").classList.remove("open");
};
</script>

<style>

</style>
</head>

</html>
