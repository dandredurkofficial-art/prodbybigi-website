<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Producer Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- BASIC STYLE (BeatStars-like clean studio) -->
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f14;
  color: #fff;
}
.sidebar {
  width: 220px;
  background: #15151f;
  height: 100vh;
  position: fixed;
  padding: 20px;
}
.sidebar h2 {
  color: #ff4d4d;
}
.sidebar button {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  background: #222;
  border: none;
  color: #fff;
  cursor: pointer;
}
.sidebar button:hover {
  background: #ff4d4d;
}
.main {
  margin-left: 240px;
  padding: 20px;
}
.page {
  display: none;
}
.page.active {
  display: block;
}
input, select, textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  background: #222;
  border: none;
  color: #fff;
}
button.primary {
  background: #ff4d4d;
  border: none;
  padding: 12px;
  color: #fff;
  cursor: pointer;
  margin-top: 10px;
}
.card {
  background: #1b1b27;
  padding: 15px;
  margin: 10px 0;
  border-radius: 6px;
}
</style>

<!-- Cloudinary -->
<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<!-- Firebase (COMPAT – STABLE) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

</head>
<body>

<div class="sidebar">
  <h2>Producer Studio</h2>
  <button onclick="showPage('dashboard')">Dashboard</button>
  <button onclick="showPage('upload')">Upload</button>
  <button onclick="showPage('content')">Content</button>
  <button onclick="logout()">Logout</button>
</div>

<div class="main">

  <!-- DASHBOARD -->
  <div id="dashboard" class="page active">
    <h1>Welcome back</h1>
    <p>This is your producer studio.</p>
  </div>

  <!-- UPLOAD -->
  <div id="upload" class="page">
    <h1>Upload New Content</h1>

    <label>Type</label>
    <select id="type">
      <option value="beat">Beat</option>
      <option value="soundkit">Soundkit</option>
      <option value="service">Service</option>
    </select>

    <label>Title</label>
    <input id="title" placeholder="Name your product" />

    <label>Description</label>
    <textarea id="description"></textarea>

    <button class="primary" onclick="uploadArtwork()">Upload Artwork</button>
    <p id="artworkStatus">No artwork</p>

    <button class="primary" onclick="uploadAudio()">Upload File</button>
    <p id="audioStatus">No file</p>

    <button class="primary" onclick="publish()">Publish</button>
  </div>

  <!-- CONTENT -->
  <div id="content" class="page">
    <h1>Your Content</h1>
    <div id="contentList"></div>
  </div>

</div>

<script>
/* FIREBASE CONFIG */
firebase.initializeApp({
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi"
});

const auth = firebase.auth();
const db = firebase.firestore();

/* AUTH GUARD */
auth.onAuthStateChanged(user => {
  if (!user) location.href = "login.html";
  else loadContent();
});

/* NAV */
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* LOGOUT */
function logout() {
  auth.signOut();
}

/* CLOUDINARY */
const cloudName = "djd8vkI8s";
let artworkUrl = null;
let audioUrl = null;

function uploadArtwork() {
  cloudinary.openUploadWidget({
    cloudName,
    uploadPreset: "unsigned_images",
    resourceType: "image"
  }, (err, res) => {
    if (!err && res.event === "success") {
      artworkUrl = res.info.secure_url;
      artworkStatus.innerText = "Artwork uploaded ✅";
    }
  });
}

function uploadAudio() {
  cloudinary.openUploadWidget({
    cloudName,
    uploadPreset: "unsigned_audio",
    resourceType: "video"
  }, (err, res) => {
    if (!err && res.event === "success") {
      audioUrl = res.info.secure_url;
      audioStatus.innerText = "File uploaded ✅";
    }
  });
}

/* SAVE TO FIRESTORE */
async function publish() {
  const user = auth.currentUser;
  if (!audioUrl) return alert("Upload file first");

  await db.collection("content").add({
    producerId: user.uid,
    type: type.value,
    title: title.value,
    description: description.value,
    artworkUrl,
    audioUrl,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  alert("Published successfully");
  artworkUrl = audioUrl = null;
  artworkStatus.innerText = "No artwork";
  audioStatus.innerText = "No file";
  loadContent();
}

/* LOAD CONTENT */
async function loadContent() {
  const user = auth.currentUser;
  const snap = await db.collection("content")
    .where("producerId", "==", user.uid)
    .get();

  contentList.innerHTML = "";
  snap.forEach(doc => {
    const d = doc.data();
    contentList.innerHTML += `
      <div class="card">
        <strong>${d.title}</strong>
        <p>${d.type}</p>
      </div>
    `;
  });
}
</script>

</body>
</html>
