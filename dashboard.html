<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producer Studio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui;
  background:#05070d;
  color:#fff;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  background:#070a12;
  border-bottom:1px solid #1f2937;
}
.menu-btn{
  font-size:22px;
  cursor:pointer;
}
.logout{
  background:#ef4444;
  border:none;
  color:#fff;
  padding:8px 14px;
  border-radius:10px;
}
nav{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#070a12;
  border-right:1px solid #1f2937;
  padding:20px;
  transition:.3s;
  z-index:10;
}
nav a{
  display:block;
  color:#cbd5f5;
  text-decoration:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:6px;
}
nav a:hover{background:#111827}
nav.show{left:0}

main{padding:20px}

.page{display:none}
.page.active{display:block}

.card{
  background:linear-gradient(145deg,#0b1220,#05070d);
  border:1px solid #1f2937;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#05070d;
  border:1px solid #1f2937;
  border-radius:12px;
  color:#fff;
}

button.primary{
  margin-top:14px;
  width:100%;
  background:#3b82f6;
  border:none;
  padding:14px;
  border-radius:14px;
  color:#fff;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <strong>Producer Studio</strong>
  <button class="logout">Logout</button>
</header>

<nav id="sidebar">
  <a onclick="showPage('dashboard')">Dashboard</a>
  <a onclick="showPage('upload')">Upload Beat</a>
  <a onclick="showPage('tracks')">Tracks</a>
  <a onclick="showPage('finance')">Finance</a>
</nav>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">
  <div class="card">
    <h2>Total Sales</h2>
    <h1>$0.00</h1>
  </div>
  <div class="card">
    <h2>Available Balance</h2>
    <h1>$0.00</h1>
  </div>
  <div class="card">
    <h2>Beats</h2>
    <h1>0</h1>
  </div>
</section>

<!-- UPLOAD -->
<section id="upload" class="page">
  <div class="card">
    <h2>Upload Beat</h2>
    <input placeholder="Track Title">
    <textarea placeholder="Description"></textarea>
    <input placeholder="BPM">
    <input placeholder="Key">
    <input placeholder="Tags">
    <button class="primary">Upload</button>
  </div>
</section>

<!-- TRACKS (UPDATED ONLY HERE) -->
<section id="tracks" class="page">
  <div class="card">
    <h2>Your Beats</h2>

    <div class="card">
      <h3 id="beatTitle">Demo Beat</h3>

      <select id="licenseSelect" onchange="updatePrice()">
        <option value="basic" data-price="29.99">Basic License – $29.99</option>
        <option value="premium" data-price="79.99">Premium License – $79.99</option>
        <option value="exclusive" data-price="299.99">Exclusive License – $299.99</option>
      </select>

      <h2 id="priceDisplay">$29.99</h2>

      <button class="primary" onclick="goToCheckout()">Buy License</button>
    </div>
  </div>
</section>

<!-- FINANCE -->
<section id="finance" class="page">
  <div class="card">
    <h2>Payouts</h2>
    <p>Stripe connected ✔</p>
    <h1>$0.00</h1>
  </div>
</section>

</main>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("show");
}

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.getElementById("sidebar").classList.remove("show");
}

/* LICENSE LOGIC */
function updatePrice(){
  const select = document.getElementById("licenseSelect");
  const price = select.options[select.selectedIndex].dataset.price;
  document.getElementById("priceDisplay").innerText = "$" + price;
}

function goToCheckout(){
  const select = document.getElementById("licenseSelect");
  const license = select.value;
  const price = select.options[select.selectedIndex].dataset.price;

  const params = new URLSearchParams({
    beat:"demo-beat-id",
    license,
    price
  });

  window.location.href="checkout.html?"+params.toString();
}
</script>

</body>
</html>
