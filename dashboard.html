<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<title>Producer Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:#0b0b0b;color:#fff;display:flex;height:100vh}
.sidebar{width:250px;background:#111;padding:20px;display:flex;flex-direction:column}
.sidebar h2{color:#6cf;margin-bottom:20px}
.sidebar button{background:none;border:none;color:#aaa;text-align:left;padding:12px;border-radius:8px;cursor:pointer}
.sidebar button:hover{background:#1a1a1a;color:#fff}
.main{flex:1;display:flex;flex-direction:column}
.topbar{height:60px;background:#111;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #222}
.hamburger{display:none;font-size:22px;background:none;border:none;color:#fff;margin-right:10px}
.content{padding:25px;overflow-y:auto}
.card{background:#141414;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.plan-card ul{padding-left:18px;font-size:14px;color:#ccc}
.plan-card li{margin-bottom:6px}
.price{font-size:22px;color:#6cf;font-weight:700}
img.cover{width:80px;height:80px;border-radius:10px;object-fit:cover}
@media(max-width:768px){.sidebar{position:fixed;left:-260px;height:100%;z-index:999}.sidebar.open{left:0}.hamburger{display:block}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<h2>ProdByBigi</h2>
<button onclick="loadPage('tracks')">Tracks</button>
<button onclick="loadPage('analytics')">Analytics</button>
<button onclick="loadPage('finance')">Finance</button>
<button onclick="loadPage('settings')">Settings</button>
<button onclick="loadPage('upgrade')">Upgrade</button>
</div>
<div class="main">
<div class="topbar">
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<h3 id="title">Dashboard</h3>
</div>
<div class="content" id="content"></div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
import { getAuth,onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';

const firebaseConfig={apiKey:"AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",authDomain:"prodbybigi.firebaseapp.com",projectId:"prodbybigi",storageBucket:"prodbybigi.firebasestorage.app",messagingSenderId:"1040553526206",appId:"1:1040553526206:web:38216a9f75eabfe556efef"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let user;

window.toggleSidebar=()=>document.getElementById('sidebar').classList.toggle('open');

window.loadPage=(page)=>{
const c=document.getElementById('content');
document.getElementById('title').innerText=page.toUpperCase();
if(page==='upgrade'){
c.innerHTML=`<div class='grid'>
<div class='card plan-card'><h3>Starter</h3><p class='price'>$15/year</p><ul><li>Unlimited MP3/WAV</li><li>0% commission</li><li>Advanced analytics</li></ul><div id='pp-starter'></div></div>
<div class='card plan-card'><h3>Growth</h3><p class='price'>$60/year</p><ul><li>Upload stems</li><li>Sell services</li><li>Unlimited messages</li></ul><div id='pp-growth'></div></div>
<div class='card plan-card'><h3>Professional</h3><p class='price'>$159/year</p><ul><li>Custom website</li><li>Merch & memberships</li><li>Email marketing</li></ul><div id='pp-pro'></div></div>
</div>`;
setTimeout(loadPayPal,300);
}
if(page==='analytics') c.innerHTML=`<div class='card'>Real-time analytics coming next update 📊</div>`;
if(page==='finance') c.innerHTML=`<div class='card'>Sales & earnings dashboard coming 💰</div>`;
if(page==='settings') c.innerHTML=`<div class='card'>Profile settings stable ✔</div>`;
if(page==='tracks') c.innerHTML=`<div class='card'>Tracks system active 🎵</div>`;
}

function savePlan(plan){
  if(!user) return;
  updateDoc(doc(db,'users',user.uid),{
    plan: plan,
    subscribedAt: new Date()
  });
}

function loadPayPal(){
  paypal.Buttons({
    style:{layout:'vertical',label:'subscribe'},
    createSubscription:(d,a)=>a.subscription.create({plan_id:'P-8FN35171F4185880VNFJ5YGI'}),
    onApprove:()=>{savePlan('starter');alert('Starter plan activated');}
  }).render('#pp-starter');

  paypal.Buttons({
    style:{layout:'vertical',label:'subscribe'},
    createSubscription:(d,a)=>a.subscription.create({plan_id:'P-4MM864528J575140DNFJ5XQQ'}),
    onApprove:()=>{savePlan('growth');alert('Growth plan activated');}
  }).render('#pp-growth');

  paypal.Buttons({
    style:{layout:'vertical',label:'subscribe'},
    createSubscription:(d,a)=>a.subscription.create({plan_id:'P-1TH20083J44769154NFJ5VTA'}),
    onApprove:()=>{savePlan('professional');alert('Professional plan activated');}
  }).render('#pp-pro');
}),onApprove:()=>alert('Starter activated')}).render('#pp-starter');
paypal.Buttons({createSubscription:(d,a)=>a.subscription.create({plan_id:'P-4MM864528J575140DNFJ5XQQ'}),onApprove:()=>alert('Growth activated')}).render('#pp-growth');
paypal.Buttons({createSubscription:(d,a)=>a.subscription.create({plan_id:'P-1TH20083J44769154NFJ5VTA'}),onApprove:()=>alert('Professional activated')}).render('#pp-pro');
}

onAuthStateChanged(auth,u=>{if(!u)location.href='login.html';user=u;loadPage('tracks')});
</script>
</body>
</html>
