<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | ProdByBigi</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0d0d0d;
      color: #fff;
      height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #111;
      padding: 24px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #222;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #6cf;
      margin-bottom: 30px;
    }

    .nav a {
      display: block;
      padding: 12px 14px;
      border-radius: 8px;
      color: #bbb;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 6px;
      transition: 0.2s;
    }

    .nav a:hover {
      background: #1b1b1b;
      color: #fff;
    }

    .nav .pro {
      margin-top: auto;
      background: linear-gradient(135deg, #6cf, #9f6cff);
      color: #000;
      font-weight: 600;
      text-align: center;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 70px;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .plan {
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #222;
    }

    .content {
      padding: 30px;
      overflow-y: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #141414;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #222;
    }

    .card h3 {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 26px;
      font-weight: 700;
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #6cf;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">ProdByBigi</div>
    <nav class="nav">
      <a onclick="loadPage('home')">Dashboard</a>
      <a onclick="loadPage('tracks')">Tracks</a>
      <a onclick="loadPage('soundkits')">Sound Kits</a>
      <a onclick="loadPage('services')">Services</a>
      <a onclick="loadPage('collections')">Collections</a>
      <a onclick="loadPage('sales')">Sales</a>
      <a onclick="loadPage('analytics')">Analytics</a>
      <a onclick="loadPage('finance')">Finance</a>
      <a onclick="loadPage('contracts')">Contracts</a>
      <a onclick="loadPage('discounts')">Discounts</a>
      <a onclick="loadPage('settings')">Settings</a>
      <a class="pro" onclick="loadPage('upgrade')">Upgrade to Pro</a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
      <span class="plan">Free Plan · 0 / 10 Uploads</span>
    </header>

    <div class="content" id="content"></div>
  </div>

  <script>
    const content = document.getElementById('content');
    const pageTitle = document.getElementById('pageTitle');

    function loadPage(page) {
      switch (page) {
        case 'home':
          pageTitle.innerText = 'Dashboard';
          content.innerHTML = `
            <div class="grid">
              <div class="card"><h3>Total Sales</h3><p>$0.00</p></div>
              <div class="card"><h3>Total Uploads</h3><p>0 / 10</p></div>
              <div class="card"><h3>Views</h3><p>0</p></div>
              <div class="card"><h3>Balance</h3><p>$0.00</p></div>
            </div>
          `;
          break;

        case 'tracks':
          pageTitle.innerText = 'Tracks';
          content.innerHTML = `
            <h3>Your Beats</h3>
            <p>Free plan allows up to 10 uploads.</p>
            <button>Upload Beat</button>
          `;
          break;

        case 'soundkits':
          pageTitle.innerText = 'Sound Kits';
          content.innerHTML = '<p>Sound kits section coming soon.</p>';
          break;

        case 'services':
          pageTitle.innerText = 'Services';
          content.innerHTML = '<p>Offer mixing, mastering, custom beats.</p>';
          break;

        case 'collections':
          pageTitle.innerText = 'Collections';
          content.innerHTML = '<p>Organize your beats into collections.</p>';
          break;

        case 'sales':
          pageTitle.innerText = 'Sales';
          content.innerHTML = '<p>Your recent sales will appear here.</p>';
          break;

        case 'analytics':
          pageTitle.innerText = 'Analytics';
          content.innerHTML = '<p>Views, plays, and sales analytics.</p>';
          break;

        case 'finance':
          pageTitle.innerText = 'Finance';
          content.innerHTML = '<p>Balance and payout history.</p>';
          break;

        case 'contracts':
          pageTitle.innerText = 'Contracts';
          content.innerHTML = '<p>Manage license contracts.</p>';
          break;

        case 'discounts':
          pageTitle.innerText = 'Producer Discounts';
          content.innerHTML = '<p>Create discount codes.</p>';
          break;

        case 'settings':
          pageTitle.innerText = 'Account Settings';
          content.innerHTML = '<p>Update your account settings.</p>';
          break;

        case 'upgrade':
          pageTitle.innerText = 'Upgrade to Pro';
          content.innerHTML = `
            <h3>Go Pro</h3>
            <p>Unlimited uploads, analytics, discounts, contracts.</p>
            <button>Upgrade Now</button>
          `;
          break;
      }
    }

    loadPage('home');
  </script>

</body>
</html>
