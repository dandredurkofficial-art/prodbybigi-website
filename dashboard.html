<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Producer Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f14;
  color: #fff;
}
header {
  padding: 15px;
  background: #161622;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
main {
  padding: 20px;
  max-width: 900px;
  margin: auto;
}
.card {
  background: #1c1c2b;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border: none;
}
button {
  background: #6c5ce7;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.license-item {
  background: #2a2a3d;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
}
</style>
</head>

<body>

<header>
  <h2>Producer Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<main>

<!-- UPLOAD BEAT -->
<div class="card">
  <h3>Upload Beat</h3>

  <input id="beatTitle" placeholder="Beat Title" />

  <input id="audioUrl" placeholder="Audio URL (Cloudinary)" />
  <input id="artworkUrl" placeholder="Artwork URL (Cloudinary)" />

  <h4>Attach Licenses</h4>
  <div id="licenseList"></div>

  <button onclick="publishBeat()">Publish Beat</button>
</div>

<!-- MY BEATS -->
<div class="card">
  <h3>My Beats</h3>
  <div id="myBeats"></div>
</div>

</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    loadLicenses();
    loadBeats();
  }
});

function logout() {
  auth.signOut().then(() => {
    window.location.href = "login.html";
  });
}

// LOAD LICENSES
function loadLicenses() {
  const container = document.getElementById("licenseList");
  container.innerHTML = "";

  db.collection("licenses")
    .where("uid", "==", auth.currentUser.uid)
    .get()
    .then(snapshot => {
      snapshot.forEach(doc => {
        const l = doc.data();
        container.innerHTML += `
          <div class="license-item">
            <label>
              <input type="checkbox" value="${doc.id}" />
              ${l.name} — $${l.price}
            </label>
          </div>
        `;
      });
    });
}

// PUBLISH BEAT
function publishBeat() {
  const title = document.getElementById("beatTitle").value;
  const audioUrl = document.getElementById("audioUrl").value;
  const artworkUrl = document.getElementById("artworkUrl").value;

  const licenseIds = [];
  document.querySelectorAll("#licenseList input:checked")
    .forEach(cb => licenseIds.push(cb.value));

  if (!title || !audioUrl || licenseIds.length === 0) {
    alert("Fill all fields & select at least one license");
    return;
  }

  db.collection("beats").add({
    uid: auth.currentUser.uid,
    title,
    audioUrl,
    artworkUrl,
    licenseIds,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    alert("Beat uploaded");
    loadBeats();
  });
}

// LOAD BEATS
function loadBeats() {
  const container = document.getElementById("myBeats");
  container.innerHTML = "";

  db.collection("beats")
    .where("uid", "==", auth.currentUser.uid)
    .get()
    .then(snapshot => {
      snapshot.forEach(doc => {
        const b = doc.data();
        container.innerHTML += `
          <div class="license-item">
            <strong>${b.title}</strong><br>
            Licenses attached: ${b.licenseIds.length}
          </div>
        `;
      });
    });
}
</script>

</body>
</html>
