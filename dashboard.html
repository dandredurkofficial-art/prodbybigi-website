<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Producer Dashboard – ProdByBigi</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #0b0f16;
  color: #fff;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 260px;
  height: 100%;
  background: linear-gradient(180deg,#0e1320,#090c14);
  padding: 20px;
  z-index: 1000;
  transition: transform .3s ease;
}
.sidebar.hidden {
  transform: translateX(-100%);
}
.logo {
  font-size: 24px;
  font-weight: 700;
  color: #4fc3f7;
}
.nav {
  margin-top: 30px;
}
.nav button {
  width: 100%;
  background: none;
  border: none;
  color: #cfd8dc;
  padding: 12px;
  text-align: left;
  font-size: 15px;
  cursor: pointer;
  border-radius: 8px;
}
.nav button:hover {
  background: #1c2235;
}
.locked {
  opacity: .5;
}
.close-btn {
  display: none;
  font-size: 22px;
  cursor: pointer;
  margin-left: auto;
}

/* ===== TOP BAR ===== */
.topbar {
  margin-left: 260px;
  padding: 15px;
  background: #0e1320;
  display: flex;
  align-items: center;
}
.menu-btn {
  display: none;
  font-size: 22px;
  cursor: pointer;
}

/* ===== MAIN ===== */
.main {
  margin-left: 260px;
  padding: 20px;
}
.page { display: none; }
.page.active { display: block; }

/* ===== CARDS ===== */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap: 20px;
}
.card {
  background: #12182a;
  border-radius: 14px;
  padding: 20px;
}
.card h3 {
  margin: 0;
  color: #90caf9;
}

/* ===== UPLOAD PAGE (BEATSTARS STYLE) ===== */
.upload-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}
.section {
  background: #12182a;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
}
.section h4 {
  margin-top: 0;
}
input, textarea, select {
  width: 100%;
  background: #0b0f16;
  border: 1px solid #1f2a44;
  color: #fff;
  padding: 10px;
  border-radius: 8px;
  margin-top: 8px;
}
.upload-box {
  border: 2px dashed #1f2a44;
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  margin-bottom: 10px;
}
.publish-btn {
  background: #2979ff;
  border: none;
  padding: 14px;
  width: 100%;
  color: white;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .sidebar { transform: translateX(-100%); }
  .sidebar.show { transform: translateX(0); }
  .close-btn { display: block; }
  .menu-btn { display: block; }
  .main, .topbar { margin-left: 0; }
  .upload-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar hidden" id="sidebar">
  <div style="display:flex;align-items:center">
    <div class="logo">ProdByBigi</div>
    <div class="close-btn" onclick="toggleMenu()">✕</div>
  </div>

  <div class="nav">
    <button onclick="showPage('home')">Dashboard</button>
    <button onclick="showPage('upload')">Upload Beat</button>
    <button onclick="showPage('beats')">My Beats</button>
    <button onclick="showPage('finance')">Finance</button>
    <button onclick="showAnalytics()" class="locked">Analytics 🔒</button>
    <button onclick="showPage('settings')">Account Settings</button>
    <button onclick="showPage('upgrade')">Upgrade</button>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <h3 style="margin-left:10px">Producer Dashboard</h3>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="home" class="page active">
  <div class="cards">
    <div class="card"><h3>Total Beats</h3><p>0</p></div>
    <div class="card"><h3>Total Plays</h3><p>0</p></div>
    <div class="card"><h3>Total Revenue</h3><p>$0.00</p></div>
  </div>
</div>

<!-- UPLOAD -->
<div id="upload" class="page">
  <div class="upload-grid">
    <div>
      <div class="section">
        <h4>Basic Info</h4>
        <label>Title</label>
        <input placeholder="New Track">
        <label>Description</label>
        <textarea rows="4"></textarea>
      </div>

      <div class="section">
        <h4>Metadata</h4>
        <label>BPM</label>
        <input>
        <label>Key</label>
        <select><option>None</option></select>
        <label>Tags</label>
        <input placeholder="trap, drill">
      </div>

      <div class="section">
        <h4>Monetization</h4>
        <label>Basic License Price</label>
        <input value="23.99">
      </div>
    </div>

    <div>
      <div class="section">
        <div class="upload-box">Master Track (.wav / .mp3)</div>
        <div class="upload-box">Preview Track (Tagged)</div>
        <button class="publish-btn">Publish Track</button>
      </div>
    </div>
  </div>
</div>

<!-- MY BEATS -->
<div id="beats" class="page">
  <div class="section">Your uploaded beats will appear here.</div>
</div>

<!-- FINANCE -->
<div id="finance" class="page">
  <div class="section">Earnings, payouts & refunds.</div>
</div>

<!-- SETTINGS -->
<div id="settings" class="page">
  <div class="section">Account settings page.</div>
</div>

<!-- UPGRADE -->
<div id="upgrade" class="page">
  <div class="section">
    <h3>Upgrade to Pro</h3>
    <button class="publish-btn" onclick="upgrade()">Upgrade Now</button>
  </div>
</div>

</div>

<script>
let isPro = false;

function toggleMenu(){
  document.getElementById('sidebar').classList.toggle('show');
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  toggleMenu();
}

function showAnalytics(){
  if(!isPro){
    alert("Upgrade to unlock analytics");
    showPage('upgrade');
  } else {
    alert("Analytics page coming soon");
  }
}

function upgrade(){
  isPro = true;
  alert("Pro activated! Analytics unlocked.");
}
</script>

</body>
</html>
