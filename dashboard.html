<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producer Studio</title>

<!-- Cloudinary -->
<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, query, where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi",
  storageBucket: "prodbybigi.firebasestorage.app",
  messagingSenderId: "1040553526206",
  appId: "1:1040553526206:web:38216a9f75eabfe556efef"
};

const app = initializeApp(firebaseConfig);

window.db = getFirestore(app);
window.auth = getAuth(app);

window.addDoc = addDoc;
window.collection = collection;
window.getDocs = getDocs;
window.query = query;
window.where = where;

window.currentUser = null;

/* 🔐 WAIT FOR AUTH */
onAuthStateChanged(auth, user => {
  if (user) {
    window.currentUser = user;
    loadBeats(); // ✅ LOAD ONLY AFTER AUTH
  }
});
</script>

<style>
/* ===== BASE ===== */
body {
  margin:0;
  font-family:Inter,system-ui;
  background:#070a12;
  color:#fff;
}
header {
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #1f2937;
}
.menu-btn {font-size:22px;cursor:pointer;}
.logout {
  background:#ef4444;border:none;padding:8px 14px;border-radius:8px;color:#fff;
}
.layout {display:flex;min-height:calc(100vh - 64px);}

nav {
  width:240px;
  border-right:1px solid #1f2937;
  padding:16px;
}
nav a {
  display:block;
  padding:12px;
  margin-bottom:6px;
  border-radius:10px;
  color:#9ca3af;
  cursor:pointer;
}
nav a.active {
  background:#111827;
  color:#fff;
}

main {flex:1;padding:24px;}
.page {display:none;}
.page.active {display:block;}

.card {
  background:#0b1220;
  border:1px solid #1f2937;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

input,textarea {
  width:100%;
  background:#05070c;
  border:1px solid #1f2937;
  border-radius:10px;
  padding:12px;
  color:#fff;
  margin-bottom:12px;
}

.toggle {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:12px 0;
}
.price {width:120px;}

button.primary {
  background:#3b82f6;
  border:none;
  padding:14px;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
}

button.primary[disabled]{
  opacity:.6;
  cursor:not-allowed;
}

.artwork-preview {
  width:100%;
  max-width:260px;
  aspect-ratio:1/1;
  border-radius:14px;
  background:#05070c;
  border:1px dashed #1f2937;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:14px;
}
.artwork-preview img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.upload-status{
  font-size:13px;
  color:#22c55e;
  margin-bottom:8px;
}

.track {
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}
.track img {
  width:64px;
  height:64px;
  border-radius:10px;
  object-fit:cover;
}
.track button {
  background:#111827;
  border:1px solid #1f2937;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
}

@media(max-width:900px){
  nav {
    display:none;
    position:fixed;
    top:64px;
    left:0;
    height:100%;
    background:#070a12;
    z-index:10;
  }
  nav.open {display:block;}
}
@media(max-width:640px){
  .toggle {flex-direction:column;align-items:flex-start;}
  .price {width:100%;}
  button.primary {width:100%;}
}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <strong>Producer Studio</strong>
  <button class="logout">Logout</button>
</header>

<div class="layout">
<nav id="sidebar">
  <a onclick="showPage('dashboard')" class="active">Dashboard</a>
  <a onclick="showPage('upload')">Upload Beat</a>
  <a onclick="showPage('tracks')">Tracks</a>
  <a onclick="showPage('finance')">Finance</a>
</nav>

<main>

<section id="dashboard" class="page active">
  <div class="card"><h2>Total Sales</h2><h1>$0.00</h1></div>
  <div class="card"><h2>Available Balance</h2><h1>$0.00</h1></div>
</section>

<section id="upload" class="page">

<div class="card">
<h2>Track Details</h2>

<div class="artwork-preview" id="artworkBox">
  <span>Artwork Preview</span>
</div>
<div id="artworkStatus"></div>
<button class="primary" onclick="uploadArtwork()">Upload Artwork</button>

<input id="title" placeholder="Track title">
<textarea id="desc" placeholder="Description"></textarea>
<input id="bpm" placeholder="BPM">
<input id="key" placeholder="Key">

<div id="fullStatus"></div>
<button class="primary" onclick="uploadFullAudio()">Upload Full Beat</button>

<div id="previewStatus"></div>
<button class="primary" onclick="uploadPreviewAudio()">Upload Preview (Tagged)</button>
</div>

<div class="card">
<h2>Licenses & Pricing</h2>

<div class="toggle">
  <label>Basic (MP3)</label>
  <input type="checkbox" id="basicEnabled" checked>
  <input class="price" id="basicPrice" value="29.99">
</div>

<div class="toggle">
  <label>Premium (WAV)</label>
  <input type="checkbox" id="premiumEnabled">
  <input class="price" id="premiumPrice" value="79.99">
</div>

<div class="toggle">
  <label>Exclusive</label>
  <input type="checkbox" id="exclusiveEnabled">
  <input class="price" id="exclusivePrice" value="299.99">
</div>

<div class="toggle">
  <label>Free Download</label>
  <input type="checkbox" id="freeDownload">
</div>

<div class="toggle">
  <label>Include in Bulk Discounts</label>
  <input type="checkbox" id="bulkDiscount">
</div>

<button class="primary" id="publishBtn" onclick="publishBeat()">Publish Beat</button>
</div>

</section>

<section id="tracks" class="page">
  <div class="card">
    <h2>Your Beats</h2>
    <div id="beats"></div>
  </div>
</section>

<section id="finance" class="page">
  <div class="card">
    <h2>Payouts</h2>
    <p>$0.00</p>
    <button class="primary">Withdraw</button>
  </div>
</section>

</main>
</div>

<script>
let uploadedArtwork=null, fullAudio=null, previewAudio=null;
let beatsData=[], currentAudio=null;

function toggleMenu(){ sidebar.classList.toggle("open"); }

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  sidebar.classList.remove("open");
}

function uploadArtwork(){
  cloudinary.openUploadWidget({
    cloudName:"djd8vkI8s",
    uploadPreset:"unsigned_images",
    resourceType:"image"
  },(_,res)=>{
    if(res?.event==="success"){
      uploadedArtwork=res.info.secure_url;
      artworkBox.innerHTML=`<img src="${uploadedArtwork}">`;
      artworkStatus.innerHTML=`<div class="upload-status">✔ Artwork uploaded</div>`;
    }
  });
}

function uploadFullAudio(){
  cloudinary.openUploadWidget({
    cloudName:"djd8vkI8s",
    uploadPreset:"unsigned_audio",
    resourceType:"video"
  },(_,res)=>{
    if(res?.event==="success"){
      fullAudio=res.info.secure_url;
      fullStatus.innerHTML=`<div class="upload-status">✔ Full beat uploaded</div>`;
    }
  });
}

function uploadPreviewAudio(){
  cloudinary.openUploadWidget({
    cloudName:"djd8vkI8s",
    uploadPreset:"unsigned_audio",
    resourceType:"video"
  },(_,res)=>{
    if(res?.event==="success"){
      previewAudio=res.info.secure_url;
      previewStatus.innerHTML=`<div class="upload-status">✔ Preview uploaded</div>`;
    }
  });
}

async function publishBeat(){
  if(!fullAudio || !previewAudio){
    alert("Upload both audios first");
    return;
  }

  publishBtn.disabled=true;
  publishBtn.innerText="Publishing...";

  try{
    await addDoc(collection(db,"beats"),{
      title:title.value || "Untitled Beat",
      desc:desc.value || "",
      bpm:bpm.value || "",
      key:key.value || "",
      artwork:uploadedArtwork || "",
      fullAudio,
      previewAudio,
      producerId: currentUser.uid,
      published:true,
      licenses:{
        basic:{enabled:basicEnabled.checked,price:Number(basicPrice.value||0)},
        premium:{enabled:premiumEnabled.checked,price:Number(premiumPrice.value||0)},
        exclusive:{enabled:exclusiveEnabled.checked,price:Number(exclusivePrice.value||0)}
      },
      freeDownload:freeDownload.checked,
      bulkDiscount:bulkDiscount.checked,
      createdAt:Date.now()
    });

    resetUploadForm();
    loadBeats();
    alert("✅ Beat published");

  }catch(err){
    alert("Publish failed: "+err.message);
  }

  publishBtn.disabled=false;
  publishBtn.innerText="Publish Beat";
}

function resetUploadForm(){
  title.value=desc.value=bpm.value=key.value="";
  uploadedArtwork=fullAudio=previewAudio=null;
  artworkBox.innerHTML="<span>Artwork Preview</span>";
  artworkStatus.innerHTML=fullStatus.innerHTML=previewStatus.innerHTML="";
}

async function loadBeats(){
  if(!currentUser) return;

  beats.innerHTML="";
  beatsData=[];

  const q = query(
    collection(db,"beats"),
    where("producerId","==",currentUser.uid)
  );

  const snap = await getDocs(q);
  snap.forEach(d => beatsData.push(d.data()));

  renderTracks();
}

function renderTracks(){
  beats.innerHTML="";
  beatsData.forEach((b,i)=>{
    beats.innerHTML+=`
      <div class="track">
        <img src="${b.artwork||''}">
        <div style="flex:1"><strong>${b.title}</strong><br>BPM ${b.bpm} • ${b.key}</div>
        <button onclick="playPreview(${i})">▶</button>
        <button onclick="editBeat(${i})">Edit</button>
        <button onclick="deleteBeat(${i})">Delete</button>
      </div>`;
  });
}

function editBeat(i){
  const b=beatsData[i];
  editingBeatId=b.id;
  title.value=b.title;
  desc.value=b.desc;
  bpm.value=b.bpm;
  key.value=b.key;
  uploadedArtwork=b.artwork;
  fullAudio=b.fullAudio;
  previewAudio=b.previewAudio;
  artworkBox.innerHTML=b.artwork?`<img src="${b.artwork}">`:"<span>Artwork Preview</span>";
  basicEnabled.checked=b.licenses.basic.enabled;
  basicPrice.value=b.licenses.basic.price;
  premiumEnabled.checked=b.licenses.premium.enabled;
  premiumPrice.value=b.licenses.premium.price;
  exclusiveEnabled.checked=b.licenses.exclusive.enabled;
  exclusivePrice.value=b.licenses.exclusive.price;
  freeDownload.checked=b.freeDownload;
  bulkDiscount.checked=b.bulkDiscount;
  showPage('upload');
}

function playPreview(i){
  if(currentAudio) currentAudio.pause();
  currentAudio=new Audio(beatsData[i].previewAudio);
  currentAudio.play();
}

async function deleteBeat(i){
  const beat = beatsData[i];
  if(!confirm(`Delete "${beat.title}"? This cannot be undone.`)) return;
  try{
    await deleteDoc(doc(db,"beats",beat.id));
    alert("Beat deleted");
    loadBeats();
  }catch(err){
    alert("Delete failed: "+err.message);
  }
}

loadBeats();
</script>

</body>
</html>
