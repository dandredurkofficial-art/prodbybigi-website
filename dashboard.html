<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Producer Studio</title>

<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<style>
body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: #070a12;
  color: #fff;
}
header {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid #1f2937;
}
.menu-btn { font-size: 22px; cursor: pointer; }
.logout {
  background: #ef4444;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  color: #fff;
}
.layout { display: flex; min-height: calc(100vh - 64px); }
nav {
  width: 240px;
  border-right: 1px solid #1f2937;
  padding: 12px;
}
nav a {
  display: block;
  padding: 10px;
  border-radius: 8px;
  color: #9ca3af;
  cursor: pointer;
}
nav a.active { background: #111827; color: #fff; }

main { flex: 1; padding: 16px; }
.page { display: none; }
.page.active { display: block; }

.card {
  background: #0b1220;
  border: 1px solid #1f2937;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}

input, textarea {
  width: 100%;
  background: #05070c;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
  color: #fff;
  margin-bottom: 12px;
}

button.primary {
  background: #3b82f6;
  border: none;
  padding: 12px;
  border-radius: 10px;
  color: #fff;
  font-weight: 600;
}

@media(max-width:900px){
  nav { display:none; position:fixed; height:100%; background:#070a12; z-index:10; }
  nav.open { display:block; }
}
</style>
</head>

<body>

<header>
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <strong>Producer Studio</strong>
  <button class="logout">Logout</button>
</header>

<div class="layout">
<nav id="sidebar">
  <a onclick="showPage('dashboard')" class="active">Dashboard</a>
  <a onclick="showPage('upload')">Upload Beat</a>
  <a onclick="showPage('tracks')">Tracks</a>
  <a onclick="showPage('finance')">Finance</a>
</nav>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">
  <div class="card">
    <h2>Total Sales</h2>
    <h1>$0.00</h1>
  </div>
  <div class="card">
    <h2>Available Balance</h2>
    <h1>$0.00</h1>
  </div>
</section>

<!-- UPLOAD -->
<section id="upload" class="page">
  <div class="card">
    <h2>Upload Beat</h2>
    <input placeholder="Track title">
    <textarea placeholder="Description"></textarea>
    <input placeholder="BPM">
    <input placeholder="Key">
    <button class="primary" onclick="uploadAudio()">Upload Audio</button>
  </div>
</section>

<!-- TRACKS -->
<section id="tracks" class="page">
  <div class="card">
    <h2>Your Beats</h2>
    <p>No beats uploaded yet.</p>
  </div>
</section>

<!-- FINANCE -->
<section id="finance" class="page">
  <div class="card">
    <h2>Payouts</h2>
    <p>Available: $0.00</p>
    <button class="primary">Withdraw</button>
  </div>
</section>

</main>
</div>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  document.getElementById("sidebar").classList.remove("open");
}

function uploadAudio(){
  cloudinary.openUploadWidget({
    cloudName: "YOUR_CLOUD_NAME",
    uploadPreset: "unsigned_audio",
    resourceType: "video"
  }, ()=>{});
}
</script>

</body>
</html>
