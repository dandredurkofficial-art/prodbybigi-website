<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Beats • Audiory</title>

<style>

body{
margin:0;
font-family:Inter,system-ui;
background:#070a12;
color:#fff;
}

header{
height:70px;
display:flex;
align-items:center;
padding:0 20px;
border-bottom:1px solid #1f2937;
font-size:20px;
font-weight:700;
}

.container{
max-width:1200px;
margin:auto;
padding:24px;
}

.beats-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:18px;
}

.beat-card{
background:#0b1220;
border:1px solid #1f2937;
border-radius:16px;
overflow:hidden;
transition:.2s;
}

.beat-card:hover{
transform:translateY(-3px);
border-color:#334155;
}

.beat-art{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
}

.beat-body{
padding:14px;
}

.beat-title{
font-weight:700;
margin-bottom:4px;
}

.beat-producer{
font-size:13px;
color:#9ca3af;
margin-bottom:10px;
}

audio{
width:100%;
margin-bottom:10px;
}

.download-btn{
width:100%;
border:none;
padding:10px;
border-radius:10px;
background:#3b82f6;
color:white;
font-weight:600;
cursor:pointer;
}

.download-btn:hover{
background:#2563eb;
}

.empty{
text-align:center;
opacity:.6;
margin-top:80px;
font-size:18px;
}

</style>
</head>

<body>

<header>
Free Beats
</header>

<div class="container">

<div id="beatsGrid" class="beats-grid"></div>

<div id="emptyState" class="empty" style="display:none">
No free beats available yet
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCmsFTjDryYOTddWfScTKsnrs0cWAHnpdc",
authDomain: "audiory-beat-store.firebaseapp.com",
projectId: "audiory-beat-store",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const grid = document.getElementById("beatsGrid");
const empty = document.getElementById("emptyState");

async function loadFreeBeats(){

const q = query(
collection(db,"beats"),
where("licenseType","==","free")
);

const snap = await getDocs(q);

if(snap.empty){
empty.style.display="block";
return;
}

snap.forEach(doc=>{

const beat = doc.data();

const card = document.createElement("div");
card.className="beat-card";

card.innerHTML = `
<img class="beat-art" src="${beat.artworkUrl || ''}">
<div class="beat-body">
<div class="beat-title">${beat.title || "Untitled Beat"}</div>
<div class="beat-producer">${beat.producerName || ""}</div>
<audio controls src="${beat.previewUrl || ''}"></audio>
<button class="download-btn" onclick="window.open('${beat.fullUrl || ''}')">
Download Free Beat
</button>
</div>
`;

grid.appendChild(card);

});

}

loadFreeBeats();

</script>

</body>
</html>
