<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment canceled</title>
  <style>
    body{
      margin:0;
      background:#070a12;
      color:#fff;
      font-family:Inter,system-ui,sans-serif;
      display:grid;
      place-items:center;
      min-height:100vh;
    }
    .box{
      width:min(92vw,520px);
      background:#0b1220;
      border:1px solid rgba(255,255,255,.10);
      border-radius:20px;
      padding:24px;
      text-align:center;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }
    .title{
      font-size:22px;
      font-weight:1000;
      margin:0 0 10px 0;
    }
    .sub{
      color:rgba(255,255,255,.72);
      line-height:1.6;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">Payment canceled</div>
    <div class="sub">Returning you back now…</div>
  </div>

  <script>
    function currentHost(){
      return String(window.location.hostname || "").toLowerCase().trim();
    }

    function isAudioryMainHost(host){
      return (
        host === "audiory.site" ||
        host === "www.audiory.site" ||
        host.endsWith(".web.app") ||
        host.endsWith(".firebaseapp.com")
      );
    }

    function isCustomStoreHost(host){
      return !!host && !isAudioryMainHost(host);
    }

    function clearSavedCheckout(){
      localStorage.removeItem("pb_last_cart_id");
      sessionStorage.removeItem("pb_last_cart_id");
      localStorage.removeItem("pb_last_order_id");
      sessionStorage.removeItem("pb_last_order_id");
    }

    function getCancelRedirect(){
      const host = currentHost();

      if (isCustomStoreHost(host)) {
        return `${window.location.origin}/?canceled=1`;
      }

      return "/marketplace/?canceled=1";
    }

    clearSavedCheckout();
    window.location.href = getCancelRedirect();
  </script>
</body>
</html>
