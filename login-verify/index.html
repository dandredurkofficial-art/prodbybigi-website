<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Verify Login | Audiory</title>

<style>
body{
  font-family:system-ui;
  background:#f8fafc;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}

.card{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

input{
  width:100%;
  height:52px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:0 15px;
  box-sizing:border-box;
  font-size:18px;
  text-align:center;
  letter-spacing:4px;
}

button{
  width:100%;
  height:50px;
  border:none;
  border-radius:10px;
  background:#5533ff;
  color:white;
  font-weight:700;
  cursor:pointer;
  margin-top:12px;
}

#status{
  margin-top:12px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

<h2>Verify Login</h2>

<p>
Enter the 6-digit code sent to your email.
</p>

<input
id="otpCode"
maxlength="6"
placeholder="123456"
/>

<button
id="verifyBtn"
onclick="verify2FA()">
Verify Code
</button>

<button
id="resendBtn"
onclick="resendCode()">
Resend Code
</button>

<div id="status"></div>

</div>

<script type="module" src="./verify.js"></script>

</body>
</html>
