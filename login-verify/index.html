<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Verify Login | Audiory</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#0f0f12;
font-family:Inter,Arial,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:#fff;
}

.card{
width:100%;
max-width:450px;
background:#17171c;
border:1px solid #27272f;
border-radius:20px;
padding:30px;
}

.logo{
font-size:28px;
font-weight:800;
color:#a855f7;
margin-bottom:20px;
text-align:center;
}

h1{
font-size:24px;
margin-bottom:10px;
text-align:center;
}

.sub{
color:#9ca3af;
text-align:center;
margin-bottom:25px;
line-height:1.6;
}

input{
width:100%;
height:58px;
border-radius:12px;
border:1px solid #2f2f38;
background:#0f0f12;
color:#fff;
font-size:28px;
font-weight:700;
text-align:center;
letter-spacing:10px;
outline:none;
}

input:focus{
border-color:#a855f7;
}

button{
width:100%;
height:54px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:700;
margin-top:12px;
}

.primary{
background:#7c3aed;
color:#fff;
}

.secondary{
background:#27272f;
color:#fff;
}

#status{
margin-top:15px;
text-align:center;
font-size:14px;
}

.success{
color:#22c55e;
}

.error{
color:#ef4444;
}

.loading{
color:#f59e0b;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">
AUDIORY
</div>

<h1>Verify Login</h1>

<div class="sub">
Enter the 6-digit verification code sent to your email.
</div>

<input
id="otpCode"
type="text"
maxlength="6"
placeholder="000000"
/>

<button
class="primary"
id="verifyBtn">
Verify Code
</button>

<button
class="secondary"
id="resendBtn">
Resend Code
</button>

<div id="status"></div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getAuth
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
getFunctions,
httpsCallable
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

const firebaseConfig = {
apiKey: "AIzaSyCmsFTjDryYOTddWfScTKsnrs0cWAHnpdc",
authDomain: "audiory-beat-store.firebaseapp.com",
projectId: "audiory-beat-store",
storageBucket: "audiory-beat-store.firebasestorage.app",
messagingSenderId: "688272560511",
appId: "1:688272560511:web:9031e6ce215d6f08764a4a"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const functions = getFunctions(app);

const $ = (id) =>
document.getElementById(id);

$("verifyBtn").onclick =
async () => {

try{

const code =
$("otpCode").value.trim();

if(code.length !== 6){
$("status").innerHTML =
'<span class="error">Enter a valid 6-digit code</span>';
return;
}

$("status").innerHTML =
'<span class="loading">Verifying...</span>';

const fn =
httpsCallable(
functions,
"verify2FACode"
);

await fn({
code
});

$("status").innerHTML =
'<span class="success">Verification successful</span>';

const role =
localStorage.getItem(
"pending2FARole"
);

localStorage.removeItem(
"pending2FARole"
);

setTimeout(()=>{

if(role === "admin"){
location.href =
"/admin/";
}
else if(role === "producer"){
location.href =
"/studio/";
}
else{
location.href =
"/";
}

},800);

}catch(err){

console.error(err);

$("status").innerHTML =
'<span class="error">' +
(err?.message || "Verification failed") +
'</span>';

}

};

$("resendBtn").onclick =
async () => {

try{

$("status").innerHTML =
'<span class="loading">Sending new code...</span>';

const fn =
httpsCallable(
functions,
"send2FACode"
);

await fn();

$("status").innerHTML =
'<span class="success">New code sent</span>';

}catch(err){

console.error(err);

$("status").innerHTML =
'<span class="error">' +
(err?.message || "Failed") +
'</span>';

}

};

</script>

</body>
</html>
