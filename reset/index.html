<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password | Audiory</title>
  <link rel="icon" href="/audioryfavicon.webp" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/mobile-fix.css">

  <style>
    /* =========================================================
       NEW AUDIORY AUTH IDENTITY (FLAT WHITE & PURPLE SPLIT)
       ========================================================= */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Split background: top half premium purple gradient, bottom half flat pure white */
      background: linear-gradient(180deg, #1d1b84 0%, #3b2fad 50%, #ffffff 50%, #ffffff 100%);
      background-size: 100% 100%;
      position: relative;
      padding: 20px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo svg {
      height: 30px;
      width: auto;
      display: block;
    }

    /* Clean White Centered Auth Card Container */
    .auth-box {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
      text-align: center;
      z-index: 5;
    }

    .auth-box h2 {
      margin: 0 0 28px 0;
      font-size: 32px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    /* Input Field Grouping System */
    .input-group {
      text-align: left;
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 8px;
    }

    /* Styled to replicate the light-blue tint background on the reference image input fields */
    .auth-box input[type="password"] {
      width: 100%;
      min-height: 52px;
      border-radius: 14px;
      border: 1.5px solid #e2e8f0;
      background: #edf2f9; /* Soft brand background tint */
      color: #0f172a;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    /* Focus ring using the signature brand purple */
    .auth-box input[type="password"]:focus {
      border-color: #3b2fad;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 47, 173, 0.1);
    }

    /* Bold Signature Purple Action Button */
    .auth-box button {
      width: 100%;
      min-height: 52px;
      border-radius: 14px;
      border: none;
      background: #4f3cc9; /* Vibrant Audiory Purple */
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 4px;
      margin-bottom: 20px;
    }

    .auth-box button:hover {
      background: #3b2fad;
    }

    /* Bottom Nav Links */
    .auth-box p {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
    }

    .auth-box p a {
      color: #4f3cc9;
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .auth-box p a:hover {
      color: #3b2fad;
      text-decoration: underline;
    }

    /* Responsive Adjustments */
    @media (max-width: 640px) {
      body {
        background: #ffffff; /* Fallback flat look on ultra-small viewport heights if needed */
        background: linear-gradient(180deg, #3b2fad 0%, #1d1b84 340px, #ffffff 340px, #ffffff 100%);
      }
      .auth-brand {
        top: 24px;
        left: 24px;
      }
      .auth-box {
        padding: 32px 24px;
        margin-top: 60px;
      }
      .auth-box h2 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

<header class="premium-header">
    <div class="header-container">
      <a href="/" class="brand-logo" aria-label="Audiory Home">
        <svg viewBox="0 0 180 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(2, 4)">
            <circle cx="18" cy="18" r="17" stroke="white" stroke-width="2.5" />
            <circle cx="18" cy="18" r="11" stroke="white" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
            <path d="M18 7L25 26H21.5L18 16L14.5 26H11L18 7Z" fill="white"/>
            <circle cx="18" cy="13" r="1.5" fill="#3b2fad" />
            <path d="M13.5 20H22.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </g>
          <text x="46" y="29" fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">audiory</text>
        </svg>
      </a>

<div class="auth-box">
  <h2>Reset Password</h2>
  
  <div class="input-group">
    <label for="newPassword">New Password</label>
    <input id="newPassword" type="password" placeholder="••••••••••••" />
  </div>

  <button id="saveBtn">Save Password</button>
  <p>Changed your mind? <a href="/login/">Back to login</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  verifyPasswordResetCode,
  confirmPasswordReset
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmsFTjDryYOTddWfScTKsnrs0cWAHnpdc",
  authDomain: "audiory-beat-store.firebaseapp.com",
  projectId: "audiory-beat-store",
  storageBucket: "audiory-beat-store.firebasestorage.app",
  messagingSenderId: "688272560511",
  appId: "1:688272560511:web:9031e6ce215d6f08764a4a",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const params = new URLSearchParams(location.search);
const oobCode = params.get("oobCode");

const btn = document.getElementById("saveBtn");
btn.onclick = async () => {
  const newPassword = document.getElementById("newPassword").value;
  if (!newPassword || newPassword.length < 6) {
    alert("Password must be at least 6 characters");
    return;
  }

  try {
    await verifyPasswordResetCode(auth, oobCode);
    await confirmPasswordReset(auth, oobCode, newPassword);
    alert("✅ Password updated. Now login.");
    location.href = "/login/";
  } catch (e) {
    alert("Reset failed: " + (e?.message || e));
  }
};
</script>

</body>
</html>
