<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audiory Playlists</title>

<link rel="stylesheet" href="/css/style.css">

<style>
    /* =========================================================
       NEW AUDIORY BRAND VISUAL IDENTITY (FLAT WHITE & PURPLE)
       ========================================================= */
    body {
      background-color: #ffffff !important;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #334155;
      line-height: 1.6;
      box-sizing: border-box;
    }

    /* Premium Slim Header Bar Style Match */
    .topbar {
      width: 100%;
      background: linear-gradient(135deg, #3b2fad 0%, #1d1b84 100%);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: sticky;
      top: 0;
      z-index: 10000;
      box-sizing: border-box;
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      box-sizing: border-box;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .desktop-nav{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .desktop-nav a{
      color:#fff;
      text-decoration:none;
      font-size:14px;
      font-weight:600;
      padding:10px 12px;
      border-radius:8px;
      white-space:nowrap;
    }

    .desktop-nav a:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.1);
    }

    .desktop-nav a.cta {
      background: #ffffff;
      color: #3b2fad !important;
      opacity: 1;
    }
    .desktop-nav a.cta:hover {
      background: #f1f5f9;
    }

    .cart-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Container Spacing */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      box-sizing: border-box;
    }

.playlists-page{
    max-width:1400px;
    margin:40px auto;
    padding:0 20px;
}

.playlists-header{
    margin-bottom:40px;
}

.playlists-header h1{
    font-size:48px;
    font-weight:800;
    color:#1e293b;
    margin-bottom:12px;
}

.playlists-header p{
    font-size:18px;
    color:#64748b;
}

.playlists-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:28px;
}

.playlist-card{
    text-decoration:none;
    color:inherit;
}

.playlist-cover{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    aspect-ratio:1/1;
    margin-bottom:16px;
}

.playlist-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}

.playlist-card:hover .playlist-cover img{
    transform:scale(1.05);
}

.playlist-info h3{
    font-size:24px;
    font-weight:700;
    margin-bottom:8px;
    color:#1e293b;
}

.playlist-owner{
    display:flex;
    align-items:center;
    gap:8px;
    color:#64748b;
    font-size:15px;
    margin-bottom:8px;
}

.playlist-owner i{
    color:#fbbf24;
}

.track-count{
    color:#64748b;
    font-size:15px;
}

@media(max-width:768px){

    .playlists-header h1{
        font-size:34px;
    }

    .playlists-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <button class="icon-btn" id="hamburgerBtn" aria-label="Menu" style="background:transparent; border:none; color:white; font-size:20px; cursor:pointer; margin-right:8px;">☰</button>
      <div class="logo">Audiory</div>
    </div>

    <nav class="desktop-nav" aria-label="Main">
      <a href="/">Feed</a>
      <a href="/marketplace/">Tracks</a>
      <a href="/freebeats/">Free Beats</a>
      <a href="/soundkits/">Sound Kits</a>
      <a href="/producers/">Producers</a>
      <a href="/pricing/">Pricing</a>
      <a href="/premieres/">Premieres</a>
      <a href="/collabs/">Collabs</a>

      <a id="navStartSelling" class="cta" href="/register/">Start Selling</a>
      <a id="navSignIn" class="ghost" href="/login/">Sign in</a>

      <a id="navDashboard" class="ghost hidden" href="#">Dashboard</a>
      <button id="navSignOut" class="ghost hidden" type="button" style="background:transparent; border:none; color:white; font-weight:600; cursor:pointer;">Sign out</button>
    </nav>

    <button class="cart-btn" id="pbCartBtn" aria-label="Open cart" type="button">
      <span class="cart-ic">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M3 5H5L7 16H18L21 8H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="20" r="1.5" fill="currentColor"/>
      <circle cx="18" cy="20" r="1.5" fill="currentColor"/>
      </svg>
      </span>
      <span class="cart-count" id="pbCartCount">0</span>
    </button>
    <div class="apps-menu">
      <button class="apps-btn" id="appsBtn">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="5" cy="5" r="2" fill="currentColor"/>
          <circle cx="12" cy="5" r="2" fill="currentColor"/>
          <circle cx="19" cy="5" r="2" fill="currentColor"/>

          <circle cx="5" cy="12" r="2" fill="currentColor"/>
          <circle cx="12" cy="12" r="2" fill="currentColor"/>
          <circle cx="19" cy="12" r="2" fill="currentColor"/>

          <circle cx="5" cy="19" r="2" fill="currentColor"/>
          <circle cx="12" cy="19" r="2" fill="currentColor"/>
          <circle cx="19" cy="19" r="2" fill="currentColor"/>
        </svg>

      </button>

      <div class="apps-dropdown" id="appsDropdown">

        <a href="https://help-desk.audiory.site">

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 3a8 8 0 0 0-8 8v2a2 2 0 0 0 2 2h2v-5H6a6 6 0 1 1 12 0h-2v5h2a2 2 0 0 0 2-2v-2a8 8 0 0 0-8-8z" fill="currentColor"/>
          </svg>

          <span>Help Desk</span>
        </a>

        <a href="https://blog.audiory.site">

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M5 4h14v16H5z" stroke="currentColor" stroke-width="2"/>
            <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2"/>
          </svg>

          <span>Blog</span>
        </a>

        <a href="/about/">

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8h.01M11 11h2v5h-2z" fill="currentColor"/>
          </svg>

          <span>About</span>
        </a>

      </div>
    </div>
  </div>
</header>

<div class="menu-backdrop" id="menuBackdrop"></div>
<nav class="mobile-menu" id="mobileMenu" aria-label="Mobile Menu">
  <div class="menu-head">
    <div class="menu-title">Menu</div>
    <button class="icon-btn" id="menuCloseBtn" aria-label="Close">✕</button>
  </div>
  <a href="/">Feed</a>
  <a href="/marketplace/">Tracks</a>
  <a href="/freebeats/">Free Beats</a>
  <a href="/soundkits/">Sound Kits</a>
  <a href="/producers/">Producers</a>
  <a href="/pricing/">Pricing</a>
  <a href="/premieres/">Premieres</a>
  <a href="/collabs/">Collabs</a>
  <a id="mNavStartSelling" class="cta" href="/register/">Start Selling</a>
  <a id="mNavSignIn" href="/login/">Sign in</a>

  <a id="mNavDashboard" class="hidden" href="#">Dashboard</a>
  <button id="mNavSignOut" class="ghost hidden">Sign out</button>
</nav>

<main class="playlists-page">

<div class="playlists-header">
    <h1>Playlists</h1>
    <p>Discover curated beat collections from Audiory.</p>
</div>

<div class="playlists-grid" id="playlistsGrid">

</div>

</main>

<script type="module">

import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db = getFirestore();

const grid = document.getElementById("playlistsGrid");

async function loadPlaylists(){

    try{

        const q = query(
            collection(db,"playlists"),
            orderBy("createdAt","desc")
        );

        const snap = await getDocs(q);

        let html = "";

        snap.forEach(doc=>{

            const playlist = doc.data();

            html += `
            <a class="playlist-card"
               href="/playlist/?slug=${playlist.slug}">

                <div class="playlist-cover">
                    <img src="${playlist.coverUrl}">
                </div>

                <div class="playlist-info">

                    <h3>${playlist.title}</h3>

                    <div class="playlist-owner">

                        <span>Audiory</span>
                        <span>✔️</span>

                    </div>

                    <div class="track-count">

                        ${playlist.trackCount || 0} Tracks

                    </div>

                </div>

            </a>
            `;
        });

        grid.innerHTML = html;

    }catch(error){

        console.error(error);

        grid.innerHTML =
        "<p>Failed to load playlists.</p>";

    }

}

loadPlaylists();

</script>

</body>
</html>
