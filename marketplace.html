<script type="module" src="/js/firebase.js"></script>

<script>
  // ✅ supports both schemas:
  // A) title, artwork, previewAudio/fullAudio, licenses.basic.price
  // B) Title, coverurl, audiourl, price, producerid
  function normalizeBeat(b) {
    const title = b.title || b.Title || "Untitled";
    const cover = b.artwork || b.coverurl || b.coverUrl || "";
    const audio = b.previewAudio || b.audiourl || b.audioUrl || b.fullAudio || "";
    const producerId = b.producerId || b.producerid || "";
    const producerName = b.producerName || b.producer || ""; // if you add later
    const basicPrice =
      (b.licenses && b.licenses.basic && typeof b.licenses.basic.price === "number")
        ? b.licenses.basic.price
        : (typeof b.price === "number" ? b.price : Number(b.price || 0) || 0);

    return {
      title,
      cover,
      audio,
      producerId,
      producerName,
      price: basicPrice
    };
  }

  function prettyProducerName(beat) {
    if (beat.producerName && beat.producerName.trim()) return beat.producerName.trim();
    if (!beat.producerId) return "Prod. Unknown";
    const short = beat.producerId.length > 10 ? beat.producerId.slice(0, 8) : beat.producerId;
    return "Prod. " + short;
  }

  function money(n) {
    const v = Number(n || 0);
    return "$" + (isFinite(v) ? v.toFixed(2) : "0.00");
  }

  function coverHTML(url, title) {
    if (url) {
      return `<img src="${url}" alt="${title}" loading="lazy" />`;
    }
    const initials = (title || "B").trim().slice(0,2).toUpperCase();
    return `<div style="height:100%;display:grid;place-items:center;font-weight:900;font-size:22px;color:rgba(255,255,255,.9)">${initials}</div>`;
  }

  async function loadMarketplace() {
    const status = document.getElementById("marketStatus");
    const grid = document.getElementById("beatsGrid");

    try {
      status.textContent = "Loading marketplace…";
      status.classList.remove("hidden");

      const { db, collection, getDocs, query, where, orderBy, limit } = window.FB;

      // ✅ only published beats
      // if you don't have indexes yet, this still works for many cases.
      let q;
      try {
        q = query(
          collection(db, "beats"),
          where("published", "==", true),
          orderBy("createdAt", "desc"),
          limit(60)
        );
      } catch (e) {
        // fallback if orderBy/index complains
        q = query(
          collection(db, "beats"),
          where("published", "==", true),
          limit(60)
        );
      }

      const snap = await getDocs(q);

      const beats = [];
      snap.forEach(doc => beats.push(doc.data()));

      grid.innerHTML = "";

      if (!beats.length) {
        status.textContent = "No beats yet. Upload from Producer Studio.";
        return;
      }

      status.classList.add("hidden");

      beats.map(normalizeBeat).forEach((beat) => {
        const card = document.createElement("div");
        card.className = "card beat-card";
        card.innerHTML = `
          <div class="beat-cover">
            ${coverHTML(beat.cover, beat.title)}
            <button class="play-fab" data-play-btn data-audio-url="${beat.audio || ""}" aria-label="Play">
              <span class="playIcon">▶</span>
            </button>
          </div>

          <div class="beat-meta">
            <div>
              <h3>${beat.title}</h3>
              <a class="producer" href="/producer-profile.html?producerId=${encodeURIComponent(beat.producerId || "")}">
                ${prettyProducerName(beat)}
              </a>
            </div>
            <div class="price-pill">${money(beat.price)}</div>
          </div>
        `;
        grid.appendChild(card);
      });

    } catch (err) {
      console.error("[marketplace] load error:", err);
      status.textContent = "Could not load beats. Check Firestore rules & console.";
    }
  }

  window.addEventListener("firebase-ready", loadMarketplace);
</script>

</body>
</html>
