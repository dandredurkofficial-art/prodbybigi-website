<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketplace – ProdByBigi</title>
  <link rel="stylesheet" href="/css/marketplace.css" />
</head>
<body>

<header>
  <button class="menu-btn">☰</button>
  <h1>ProdByBigi</h1>
</header>

<nav class="mobile-menu">
  <a href="/">Home</a>
</nav>

<h2 style="padding:16px">All Beats</h2>
<div class="beats-grid" id="beatsGrid"></div>

<script type="module">
  import { fetchBeats } from "/js/firebase.js";

  const grid = document.getElementById("beatsGrid");

  fetchBeats().then(beats => {
    beats.forEach(b => {
      grid.innerHTML += `
        <div class="beat-card">
          <img src="${b.artwork}" alt="">
          <div class="beat-info">
            <strong>${b.title}</strong><br>
            <small>${b.producerName}</small><br>
            <button class="play-btn" data-audio="${b.audioUrl}">▶ Play</button>
          </div>
        </div>
      `;
    });
  });
</script>

<script src="/js/menu.js"></script>
<script src="/js/player.js"></script>
</body>
</html>
