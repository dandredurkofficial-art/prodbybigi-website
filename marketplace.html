<!-- MOBILE MENU -->

  <a href="index.html">Home</a>
  <a href="marketplace.html">Marketplace</a>

<!-- MOBILE MENU SCRIPT -->

  hamburger.onclick = () => {
    hamburger.classList.toggle("active");
    mobileMenu.classList.toggle("open");
  };
</script>

<!-- 🔥 FIREBASE MARKETPLACE LOADER -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const beatsGrid = document.getElementById("marketBeats");
let currentAudio = null;

async function loadMarketplaceBeats() {
  beatsGrid.innerHTML = "<p>Loading beats...</p>";

  const q = query(
    collection(db, "beats"),
    where("published", "==", true)
  );

  const snap = await getDocs(q);

  beatsGrid.innerHTML = "";

  snap.forEach(doc => {
    const b = doc.data();

    beatsGrid.innerHTML += `
      <div class="beat-card">
        <div class="beat-cover" style="background-image:url('${b.artwork || ""}')">
          <button class="play" onclick="playPreview('${b.previewAudio}')">▶</button>
        </div>

        <div class="beat-meta">
          <div>
            <h3>${b.title}</h3>
            <a href="producer.html?username=${b.producerId || "producer"}" class="producer">
              Prod. ${b.producerId || "Producer"}
            </a>
          </div>
          <button class="price">
            $${b.licenses?.basic?.price || 0}
          </button>
        </div>
      </div>
    `;
  });

  if (snap.empty) {
    beatsGrid.innerHTML = "<p>No beats available yet.</p>";
  }
}

window.playPreview = (url) => {
  if (currentAudio) currentAudio.pause();
  currentAudio = new Audio(url);
  currentAudio.play();
};

loadMarketplaceBeats();
</script>

</body>
</html>
