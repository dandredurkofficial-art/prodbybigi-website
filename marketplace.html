<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Marketplace | ProdByBigi</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">ProdByBigi</div>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a class="active" href="marketplace.html">Feed</a>
    <a href="login.html">Login</a>
    <a class="cta" href="register.html">Start Selling</a>
  </nav>

  <div class="hamburger" id="hamburger">☰</div>
</header>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
  <a href="marketplace.html">Feed</a>
  <a href="marketplace.html">Tracks</a>
  <a href="soundkits.html">Sound Kits</a>
  <a href="producers.html">Producers</a>
  <a class="cta" href="register.html">Start Selling</a>
</div>

<!-- MARKETPLACE -->
<main class="marketplace">
  <h1>Trending Beats</h1>

  <div class="beats-grid" id="beatsGrid">
    <!-- Beats injected by JS -->
  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 ProdByBigi</p>
  <div class="footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms</a>
    <a href="#">Cookies</a>
  </div>
</footer>

<!-- SCRIPTS -->
<script src="js/menu.js"></script>
<script type="module">
  import { db } from "./js/firebase.js";
  import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const grid = document.getElementById("beatsGrid");

  const snapshot = await getDocs(collection(db, "beats"));

  snapshot.forEach(async (docSnap) => {
    const beat = docSnap.data();

    // get producer name
    let producerName = "Unknown Producer";
    if (beat.producerId) {
      const userSnap = await getDoc(doc(db, "users", beat.producerId));
      if (userSnap.exists()) producerName = userSnap.data().username;
    }

    grid.innerHTML += `
      <div class="beat-card">
        <div class="beat-cover">
          <img src="${beat.coverUrl}" alt="${beat.title}">
          <button class="play" onclick="togglePlay('${beat.previewUrl}', this)">▶</button>
        </div>

        <div class="beat-meta">
          <div>
            <h3>${beat.title}</h3>
            <a href="producer.html?id=${beat.producerId}" class="producer">
              Prod. ${producerName}
            </a>
          </div>
          <button class="price">$${beat.price}</button>
        </div>
      </div>
    `;
  });
</script>

<script src="js/player.js"></script>
</body>
</html>
