<div id="marketBeats"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const q = query(
  collection(db, "beats"),
  orderBy("createdAt", "desc")
);

const snap = await getDocs(q);
snap.forEach(doc => {
  const b = doc.data();
  marketBeats.innerHTML += `
    <div class="beat-row">
      <img src="${b.coverUrl}">
      <div>
        <strong>${b.title}</strong>
        <small>${b.genre} • ${b.bpm} BPM</small>
      </div>
      <span>$${b.price}</span>
      <a href="beat.html?beat=${doc.id}">Buy</a>
    </div>
  `;
});
</script>
