<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace | ProdByBigi</title>
  <link rel="stylesheet" href="css/marketplace.css" />
</head>
<body>

<header class="nav">
  <h1>Marketplace</h1>
  <a href="index.html">Home</a>
</header>

<section class="beats">
  <div class="beat-card">
    <h3>Trap Vibes</h3>
    <p>140 BPM · Trap</p>
  </div>
</section>

<section class="licenses">
  <h2>Licensing Options</h2>

  <div class="license-grid">

    <div class="license-card">
      <h3>Basic Lease</h3>
      <span>$19</span>
      <ul>
        <li>MP3</li>
        <li>10k streams</li>
      </ul>
      <button>Buy</button>
    </div>

    <div class="license-card popular">
      <h3>Premium Lease</h3>
      <span>$39</span>
      <ul>
        <li>WAV</li>
        <li>100k streams</li>
      </ul>
      <button>Buy</button>
    </div>

    <div class="license-card">
      <h3>Unlimited</h3>
      <span>$79</span>
      <ul>
        <li>WAV + Stems</li>
        <li>Unlimited</li>
      </ul>
      <button>Buy</button>
    </div>

    <div class="license-card exclusive">
      <h3>Exclusive</h3>
      <span>$299</span>
      <ul>
        <li>Full ownership</li>
      </ul>
      <button>Contact</button>
    </div>

  </div>
</section>

</body>
</html>
