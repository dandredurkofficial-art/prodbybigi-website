<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producer Profile</title>
  <link rel="stylesheet" href="producer.css" />
</head>
<body>

<header class="nav">
  <h1 class="logo">ProdByBigi</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="marketplace.html">Marketplace</a>
  </nav>
</header>

<section class="profile">
  <img id="avatar" src="https://picsum.photos/200" />
  <h2 id="producerName">Producer Name</h2>
  <p id="bio">Independent music producer</p>

  <div class="stats">
    <div><strong id="beatsCount">0</strong><span>Beats</span></div>
    <div><strong id="salesCount">0</strong><span>Sales</span></div>
    <div><strong id="followersCount">0</strong><span>Followers</span></div>
  </div>
</section>

<section class="beats">
  <h3>🎧 Beats by this Producer</h3>

  <div id="beatsGrid" class="beats-grid">
    <!-- Beats load here -->
  </div>
</section>

<footer>
  <p>© 2026 ProdByBigi</p>
</footer>

<script src="producer.js"></script>
</body>
</html>
