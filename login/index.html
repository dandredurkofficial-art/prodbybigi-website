<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="/css/auth.css" />
  <style>
    .auth-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .auth-actions button { flex:1; min-width:140px; }

    .link-btn{
      background:none;border:none;color:#6cf;cursor:pointer;
      padding:0;margin-top:10px;text-align:left;
    }
    .muted{ color:#9ca3af;font-size:13px;margin-top:8px; }

    /* ✅ NEW email/password style only */
    .field{
      margin-top:14px;
      margin-bottom:18px;
    }
    .field label{
      display:block;
      font-size:15px;
      font-weight:700;
      color:#fff;
      margin-bottom:10px;
    }
    .input-shell{
      display:flex;
      align-items:center;
      width:100%;
      min-height:88px;
      border-radius:20px;
      border:1px solid #2a3150;
      background:#0a0f22;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
      overflow:hidden;
      box-sizing:border-box;
    }
    .input-main{
      flex:1;
      display:flex;
      align-items:center;
      gap:14px;
      padding:0 18px;
      min-height:88px;
      box-sizing:border-box;
    }
    .field-icon{
      width:24px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#8d92b8;
      flex:0 0 auto;
    }
    .divider{
      width:1px;
      height:28px;
      background:rgba(255,255,255,.20);
      flex:0 0 auto;
    }
    .input-shell input{
      margin:0;
      border:none;
      background:transparent;
      color:#fff;
      font-size:17px;
      font-weight:600;
      padding:0;
      width:100%;
      outline:none;
    }
    .input-shell input::placeholder{
      color:#8d92b8;
      opacity:1;
    }
    .pw-action{
      width:90px;
      min-height:88px;
      border:none;
      border-left:1px solid rgba(255,255,255,.06);
      background:#2b3050;
      color:#b7bddf;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      flex:0 0 90px;
    }

    @media (max-width: 480px){
      .input-shell{
        min-height:74px;
        border-radius:18px;
      }
      .input-main{
        min-height:74px;
        gap:12px;
        padding:0 14px;
      }
      .pw-action{
        min-height:74px;
        flex-basis:78px;
        width:78px;
      }
      .input-shell input{
        font-size:16px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <h2>Login</h2>

    <div class="field">
      <label for="email">Email</label>
      <div class="input-shell">
        <div class="input-main">
          <div class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M20 6H4c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 2v.01L12 13 4 8.01V8h16zM4 16V10.5l7.4 4.62a1 1 0 0 0 1.2 0L20 10.5V16H4z"/>
            </svg>
          </div>
          <div class="divider"></div>
          <input id="email" type="email" placeholder="Enter Email" autocomplete="email" />
        </div>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-shell">
        <div class="input-main">
          <div class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M7 14a5 5 0 1 1 9.9 1H21a1 1 0 0 1 1 1v2h-2v2h-2v2h-3v-3.1A5 5 0 0 1 7 14zm5-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
            </svg>
          </div>
          <div class="divider"></div>
          <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" />
        </div>
        <button class="pw-action" id="pwToggle" type="button" aria-label="Show password">
          <svg id="pwIcon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
            <path d="M12 5c5.5 0 9.7 4.1 11 6.5C21.7 13.9 17.5 18 12 18S2.3 13.9 1 11.5C2.3 9.1 6.5 5 12 5zm0 2C8 7 4.8 9.7 3.2 11.5 4.8 13.3 8 16 12 16s7.2-2.7 8.8-4.5C19.2 9.7 16 7 12 7zm0 2.5A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="auth-actions">
      <button id="loginBtn" type="button">Login</button>
      <button id="googleBtn" type="button">Continue with Google</button>
    </div>

    <button class="link-btn" id="resetBtn" type="button">Forgot password?</button>
    <div class="muted" id="status"></div>

    <p style="margin-top:14px;">
      Don’t have an account?
      <a href="/register/">Register</a>
    </p>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script>
    document.getElementById("loginBtn")?.addEventListener("click", () => window.loginUser?.());
    document.getElementById("googleBtn")?.addEventListener("click", () => window.googleLogin?.());
    document.getElementById("resetBtn")?.addEventListener("click", () => window.resetPassword?.());

    (function(){
      const pw = document.getElementById("password");
      const btn = document.getElementById("pwToggle");
      const icon = document.getElementById("pwIcon");
      if(!pw || !btn || !icon) return;

      btn.addEventListener("click", ()=>{
        const showing = pw.type === "text";
        pw.type = showing ? "password" : "text";

        icon.innerHTML = showing
          ? `<path d="M12 5c5.5 0 9.7 4.1 11 6.5C21.7 13.9 17.5 18 12 18S2.3 13.9 1 11.5C2.3 9.1 6.5 5 12 5zm0 2C8 7 4.8 9.7 3.2 11.5 4.8 13.3 8 16 12 16s7.2-2.7 8.8-4.5C19.2 9.7 16 7 12 7zm0 2.5A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5z"/>`
          : `<path d="M2.3 1 1 2.3l3.1 3.1C2.8 6.5 1.7 7.8 1 9c1.3 2.4 5.5 6.5 11 6.5 2 0 3.8-.5 5.3-1.2l3.4 3.4 1.3-1.3L2.3 1zM12 13.5A2.5 2.5 0 0 1 9.5 11c0-.4.1-.8.3-1.2l3.4 3.4c-.4.2-.8.3-1.2.3zm0-8.5c5.5 0 9.7 4.1 11 6.5-.7 1.2-1.8 2.5-3.1 3.6l-2-2A5 5 0 0 0 10.9 6l-1.6-1.6c.9-.2 1.8-.4 2.7-.4z"/>`;
      });
    })();
  </script>
</body>
</html>
