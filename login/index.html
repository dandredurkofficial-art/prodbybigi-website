<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="/css/auth.css" />
  <style>
    .auth-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .auth-actions button { flex:1; min-width:140px; }

    .link-btn{
      background:none;border:none;color:#6cf;cursor:pointer;
      padding:0;margin-top:10px;text-align:left;
    }
    .muted{ color:#9ca3af;font-size:13px;margin-top:8px; }

    /* ✅ Password input with right-side Show button */
    .pw-wrap{ position:relative; }
    .pw-wrap input{ padding-right:80px; }
    .pw-toggle{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:#fff;
      border-radius:10px;
      padding:8px 10px;
      font-weight:800;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <h2>Login</h2>

    <input id="email" type="email" placeholder="Email" autocomplete="email" />

    <div class="pw-wrap">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <button class="pw-toggle" id="pwToggle" type="button">Show</button>
    </div>

    <div class="auth-actions">
      <button id="loginBtn" type="button">Login</button>
      <button id="googleBtn" type="button">Continue with Google</button>
    </div>

    <button class="link-btn" id="resetBtn" type="button">Forgot password?</button>
    <div class="muted" id="status"></div>

    <p style="margin-top:14px;">
      Don’t have an account?
      <!-- ✅ absolute path prevents /login/register problem -->
      <a href="/register/">Register</a>
    </p>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script>
    // ✅ Wire buttons (no inline onclick problems)
    document.getElementById("loginBtn")?.addEventListener("click", () => window.loginUser?.());
    document.getElementById("googleBtn")?.addEventListener("click", () => window.googleLogin?.());
    document.getElementById("resetBtn")?.addEventListener("click", () => window.resetPassword?.());

    // ✅ Show/Hide password (right side, not center)
    (function(){
      const pw = document.getElementById("password");
      const btn = document.getElementById("pwToggle");
      if(!pw || !btn) return;

      btn.addEventListener("click", ()=>{
        const showing = pw.type === "text";
        pw.type = showing ? "password" : "text";
        btn.textContent = showing ? "Show" : "Hide";
      });
    })();
  </script>

</body>
</html>
