<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Audiory Buyer & Producer Access</title>
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/mobile-fix.css">
  <style>
    .auth-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .auth-actions button{
      flex:1;
      min-width:140px;
    }

    .link-btn{
      background:none;
      border:none;
      color:#6cf;
      cursor:pointer;
      padding:0;
      margin-top:10px;
      text-align:left;
      font-size:15px;
      font-weight:700;
    }

    .muted{
      color:#9ca3af;
      font-size:13px;
      margin-top:8px;
    }

    .field{
      margin-bottom:18px;
    }

    .field label{
      display:block;
      font-size:16px;
      font-weight:800;
      color:#fff;
      margin-bottom:12px;
    }

    .auth-input{
      width:100%;
      height:74px;
      border-radius:20px;
      border:1px solid #2b3152;
      background:#05091b;
      display:flex;
      align-items:center;
      box-sizing:border-box;
      overflow:hidden;
      padding-right:8px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.03),
        0 0 0 1px rgba(104,119,255,.04);
    }

    .auth-input-main{
      flex:1;
      display:flex;
      align-items:center;
      gap:14px;
      padding:0 18px;
      min-width:0;
      height:100%;
      box-sizing:border-box;
    }

    .auth-icon{
      width:24px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#9da3d9;
      flex:0 0 auto;
    }

    .auth-icon svg{
      width:24px;
      height:24px;
      display:block;
    }

    .auth-divider{
      width:1px;
      height:32px;
      background:rgba(255,255,255,.22);
      flex:0 0 auto;
    }

    .auth-input input{
      flex:1;
      min-width:0;
      width:100%;
      height:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#fff;
      font-size:15px;
      font-weight:700;
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    .auth-input input::placeholder{
      color:#8f95c8;
      opacity:1;
    }

    .auth-eye-btn{
      width:56px;
      min-width:56px;
      height:56px;
      border:none;
      border-radius:16px;
      background:#3b416d;
      color:#b9bee8;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
      margin:0;
      flex:0 0 56px;
      box-sizing:border-box;
      align-self:center;
    }

    .auth-eye-btn svg{
      width:24px;
      height:24px;
      display:block;
    }

    @media (max-width: 480px){
      .auth-input{
        height:70px;
        border-radius:18px;
        padding-right:8px;
      }

      .auth-input-main{
        gap:12px;
        padding:0 16px;
      }

      .auth-icon{
        width:22px;
        height:22px;
      }

      .auth-icon svg{
        width:22px;
        height:22px;
      }

      .auth-divider{
        height:30px;
      }

      .auth-input input{
        font-size:14px;
      }

      .auth-eye-btn{
        width:52px;
        min-width:52px;
        height:52px;
        flex:0 0 52px;
        border-radius:14px;
        margin:0;
        align-self:center;
      }

      .auth-eye-btn svg{
        width:22px;
        height:22px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <h2>Login</h2>

    <div class="field">
      <label for="email">Email</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18v12H3z"></path>
              <path d="M3 7l9 7 9-7"></path>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="email" type="email" placeholder="Enter Email" autocomplete="email" />
        </div>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="auth-input">
        <div class="auth-input-main">
          <span class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8.5" cy="10.5" r="3.25"></circle>
              <path d="M11.5 10.5H21"></path>
              <path d="M18 10.5v3"></path>
              <path d="M15.5 10.5v2"></path>
            </svg>
          </span>
          <span class="auth-divider"></span>
          <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" />
        </div>

        <button class="auth-eye-btn" id="pwToggle" type="button" aria-label="Show password">
          <svg id="pwEyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="pwEyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2"></path>
            <path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.3 17.3 0 0 1-3.2 4.2"></path>
            <path d="M6.2 6.3C3.7 8 2 12 2 12a17.8 17.8 0 0 0 5.4 5.1"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="auth-actions">
      <button id="loginBtn" type="button">Login</button>
      <button id="googleBtn" type="button" style="display:none;">Continue with Google</button>
    </div>

    <button class="link-btn" id="resetBtn" type="button">Forgot password?</button>
    <div class="muted" id="status"></div>

    <p style="margin-top:14px;">
      Don’t have an account?
      <a href="/register/">Register</a>
    </p>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script>
    document.getElementById("loginBtn")?.addEventListener("click", async () => {
      const btn = document.getElementById("loginBtn");
      const status = document.getElementById("status");

      try{
        if (status) status.textContent = "";
        if (btn){
          btn.disabled = true;
          btn.textContent = "Logging in...";
        }

        await window.loginUser?.();
      } catch (e){
        console.error(e);
      } finally {
        if (btn){
          btn.disabled = false;
          btn.textContent = "Login";
        }
      }
    });
    document.getElementById("resetBtn")?.addEventListener("click", async () => {
      const btn = document.getElementById("resetBtn");

      try{
        if (btn){
          btn.disabled = true;
          btn.textContent = "Sending reset email...";
        }

        await window.resetPassword?.();
      } catch (e){
        console.error(e);
      } finally {
        if (btn){
          btn.disabled = false;
          btn.textContent = "Forgot password?";
        }
      }
    });

    (function(){
      const pw = document.getElementById("password");
      const btn = document.getElementById("pwToggle");
      const eyeOpen = document.getElementById("pwEyeOpen");
      const eyeOff = document.getElementById("pwEyeOff");
      if(!pw || !btn) return;

      btn.addEventListener("click", ()=>{
        const showing = pw.type === "text";
        pw.type = showing ? "password" : "text";
        if (eyeOpen) eyeOpen.style.display = showing ? "" : "none";
        if (eyeOff) eyeOff.style.display = showing ? "none" : "";
      });
    })();
  </script>
</body>
</html>
