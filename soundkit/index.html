<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sound Kit | Audiory</title>

  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/cart.css">
  <link rel="stylesheet" href="/css/mobile-fix.css">

  <style>
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    .cardx{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:22px;padding:14px}
    .grid{display:grid;grid-template-columns: 360px 1fr;gap:16px;align-items:start}
    @media(max-width:860px){.grid{grid-template-columns:1fr}}
    .cover{
      aspect-ratio:1/1;border-radius:18px;overflow:hidden;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
      position:relative;
    }
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .title{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:2px 0 8px}
    .muted{color:rgba(255,255,255,.70)}
    .desc{margin-top:10px;line-height:1.45;color:rgba(255,255,255,.86);white-space:pre-wrap}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
    .pill{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      padding:10px 12px;border-radius:999px;font-weight:900;
      display:inline-flex;gap:8px;align-items:center
    }
    .pill.price{
      border:1.5px solid #295dff;
      background:transparent;
      cursor:pointer;
      transition:.2s;
    }
    .pill.price:hover{
      background:rgba(255,255,255,.05);
    }
    .btn{
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      color:rgba(255,255,255,.92);
      padding:10px 14px;border-radius:999px;font-weight:900;cursor:pointer
    }
    .btn.primary{background:#2b6cff;border-color:#2b6cff;color:#fff}
    .loading-box{
      margin: 14px 0;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: rgba(255,255,255,.85);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hidden{display:none!important}

    .producer{
      margin-top:8px;
      color:rgba(255,255,255,.72);
      font-size:15px;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .producer a{
      color:inherit;
      text-decoration:none;
      font-weight:700;
    }
    .producer a:hover{
      text-decoration:underline;
      color:#fff;
    }
    .verify-badge{
      width:16px;
      height:16px;
      display:inline-block;
      vertical-align:middle;
    }

    .preview-btn{
      position:absolute;
      right:18px;
      bottom:18px;
      width:74px;
      height:74px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.42);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      cursor:pointer;
      z-index:20;
    }
    .preview-btn::before{
      content:"▶";
      font-size:24px;
      margin-left:4px;
    }
    .preview-btn.playing::before{
      content:"❚";
      font-size:18px;
      margin-left:0;
    }

    @media(max-width:760px){
      .preview-btn{
        width:92px;
        height:92px;
      }
      .title{
        font-size:22px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="container topbar-inner">
    <div class="brand">
      <button class="icon-btn" id="hamburgerBtn" aria-label="Menu">☰</button>
      <div class="logo">Audiory</div>
    </div>

    <nav class="desktop-nav" aria-label="Main">
      <a href="/">Feed</a>
      <a href="/marketplace/">Tracks</a>
      <a href="/freebeats/">Free Beats</a>
      <a href="/soundkits/">Sound Kits</a>
      <a href="/producers/">Producers</a>
      <a href="/pricing/">Pricing</a>
      <a id="navStartSelling" class="cta" href="/register/">Start Selling</a>
      <a id="navSignIn" class="ghost" href="/login/">Sign in</a>
      <a id="navDashboard" class="ghost hidden" href="#">
        Dashboard
      </a>
      <button id="navSignOut" class="ghost hidden" type="button">Sign out</button>
    </nav>

    <button class="cart-btn" id="pbCartBtn" aria-label="Open cart" type="button">
      <span class="cart-ic">🛒</span>
      <span class="cart-count" id="pbCartCount">0</span>
    </button>
  </div>
</header>

<div class="menu-backdrop" id="menuBackdrop"></div>
<nav class="mobile-menu" id="mobileMenu" aria-label="Mobile Menu">
  <div class="menu-head">
    <div class="menu-title">Menu</div>
    <button class="icon-btn" id="menuCloseBtn" aria-label="Close">✕</button>
  </div>
  <a href="/">Feed</a>
  <a href="/marketplace/">Tracks</a>
  <a href="/freebeats/">Free Beats</a>
  <a href="/soundkits/">Sound Kits</a>
  <a href="/producers/">Producers</a>
  <a href="/pricing/">Pricing</a>
  <a id="mNavStartSelling" class="cta" href="/register/">Start Selling</a>
  <a id="mNavSignIn" href="/login/">Sign in</a>
  <a id="mNavDashboard" class="hidden" href="#">Dashboard</a>
  <button id="mNavSignOut" class="ghost hidden">Sign out</button>
</nav>

<main class="wrap">
  <a href="/soundkits/" class="muted" style="text-decoration:none;display:inline-block;margin:10px 0 14px;">← Back to Sound Kits</a>

  <div id="status" class="loading-box">Loading sound kit…</div>

  <section id="kitCard" class="cardx hidden">
    <div class="grid">
      <div class="cover" id="kitCover"></div>

      <div>
        <div class="title">
          <span id="kitTitle">—</span>
        </div>

        <div class="row">
          <div class="pill"><span class="muted">Category:</span> <span id="kitCategory">—</span></div>
          <div class="pill price" id="pricePill">
            <span id="kitPrice">—</span>
          </div>
        </div>

        <div class="producer" id="producerRow">
          <span>By</span>
          <a href="#" id="kitProducerLink">Audiory</a>
          <span id="kitVerified"></span>
        </div>

        <div class="desc" id="kitDesc"></div>

        <div class="row">
          <button class="btn primary" id="addBtn" type="button">🛒 Add to cart</button>
          <button class="btn" id="detailsBtn" type="button">Details</button>
        </div>

        <div class="muted" style="margin-top:10px;font-size:13px;">
          License: <b>Sound Kit</b>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- Cart Drawer -->
<div class="pb-cart-backdrop" id="pbCartBackdrop" aria-hidden="true"></div>
<aside class="pb-cart" id="pbCartDrawer" aria-label="Cart" aria-hidden="true">
  <div class="pb-cart-head">
    <div>
      <div class="pb-cart-title">Your Cart</div>
      <div class="pb-cart-sub" id="pbCartSub">0 items</div>
    </div>
    <button class="pb-cart-close" id="pbCartClose" aria-label="Close cart" type="button">✕</button>
  </div>
  <div class="pb-cart-body" id="pbCartItems"></div>
  <div class="pb-cart-foot">
    <div class="pb-cart-totals">
      <div class="muted">Total</div>
      <div class="pb-cart-total" id="pbCartTotal">$0.00</div>
    </div>
    <div class="pb-cart-actions">
      <button class="pb-cart-clear" id="pbCartClear" type="button">Clear</button>
      <button class="pb-cart-checkout" id="pbCartCheckout" type="button">Checkout</button>
    </div>
  </div>
</aside>

<script>
  window.API_BASE = "https://prodbybigi-api.onrender.com";
</script>
<script>
  window.PB_PAYPAL_CREATE_ORDER_URL =
    "https://createorder-f65rhsquva-uc.a.run.app";
  window.PB_PAYPAL_CAPTURE_ORDER_URL =
    "https://captureorder-f65rhsquva-uc.a.run.app";
</script>
  
<script type="module" src="/js/firebase.js"></script>
<script src="/js/verify.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/cart-ui.js"></script>
<script src="/js/performance.js"></script>
<script src="/js/dashboard-link.js"></script>

<script>
  const $ = (id)=>document.getElementById(id);

  function money(n){
    const v = Number(n || 0);
    return "$" + (isFinite(v) ? v.toFixed(2) : "0.00");
  }

  function getKitIdFromUrl(){
    const qs = new URLSearchParams(location.search);
    return (
      (qs.get("id") || "").trim() ||
      (qs.get("kitId") || "").trim() ||
      (qs.get("soundkitId") || "").trim()
    );
  }

  function normalizeKit(docId, data){
    data = data || {};
    return {
      id: docId,
      title: data.title || data.name || "Untitled Kit",
      cover: data.cover || data.coverUrl || data.image || data.artwork || "",
      description: data.description || data.desc || "",
      category: String(data.category || "").toLowerCase(),
      price: Number(data.price ?? 0) || 0,
      published: data.published !== false,
      createdAt: data.createdAt || 0,
      downloadUrl: data.downloadUrl || data.downloadURL || "",
      producerPlan: data.producerPlan || data.plan || "",
      producerId: data.producerId || data.uid || data.userId || "",
      producerName: data.producerName || data.producer || data.username || "Audiory",
      previewUrl: data.previewUrl || data.preview || ""
    };
  }

  async function getKitByIdAnyCollection(kitId){
    const { doc, getDoc } = window.FB;

    const cols = ["soundkits", "soundKits"];
    let lastErr = null;

    for (const col of cols){
      try{
        const ref = doc(window.FB.db, col, String(kitId));
        const snap = await getDoc(ref);

        if (snap.exists()){
          return normalizeKit(snap.id, snap.data());
        }
      }catch(err){
        lastErr = err;
        continue;
      }
    }

    if (lastErr) {
      throw lastErr;
    }

    return null;
  }

  async function load(){
    const status = $("status");
    const card = $("kitCard");

    const kitId = getKitIdFromUrl();
    if (!kitId){
      status.textContent = "Missing kit id.\n\nOpen this page like:\n/soundkit/?id=YOUR_KIT_ID";
      return;
    }

    status.textContent = "Loading sound kit…";
    status.classList.remove("hidden");

    try{
      const kit = await getKitByIdAnyCollection(kitId);
      if (!kit){
        status.textContent = `Sound kit not found: ${kitId}`;
        return;
      }

      // Render UI
      $("kitTitle").textContent = kit.title;
      $("kitCategory").textContent = kit.category || "—";
      $("kitPrice").textContent = kit.price ? money(kit.price) : "Free";
      $("kitDesc").textContent = kit.description || "No description.";

      // Producer name + link + verification badge
      const producerLink = $("kitProducerLink");
      const verifiedEl = $("kitVerified");
      
      producerLink.textContent = kit.producerName;
      if(kit.producerId){
        producerLink.href = `/producer/?id=${encodeURIComponent(kit.producerId)}`;
      } else {
        producerLink.href = "/producers/";
        producerLink.style.pointerEvents = "none";
      }

      verifiedEl.innerHTML = AudioryVerify.badge(kit.producerPlan || "");

      // Cover + preview button if previewUrl exists
      if(kit.cover){
        $("kitCover").innerHTML = `
          <img src="${kit.cover}" alt="${kit.title}" loading="lazy">
          ${kit.previewUrl ? `<button class="preview-btn" id="previewBtn" type="button"></button>` : ""}
        `;
      }

      // Price pill click = add to cart
      $("pricePill").onclick = () => {
        $("addBtn").click();
      };

      // Buttons
      $("detailsBtn").onclick = () => {
        alert(
          `${kit.title}\n\n${kit.description || "No description."}\n\n` +
          `Category: ${kit.category || "—"}\n` +
          `Price: ${kit.price ? money(kit.price) : "Free"}\n` +
          `Producer: ${kit.producerName}`
        );
      };

      $("addBtn").onclick = () => {
        if (!window.PB_CART || typeof window.PB_CART.add !== "function"){
          alert("Cart not loaded. Make sure /js/cart.js loads before /js/cart-ui.js");
          return;
        }

        window.PB_CART.add({
          beatId: String(kit.id),
          title: kit.title,
          artwork: kit.cover,
          price: Number(kit.price || 0),
          licenseKey: "soundkit",
          licenseName: "Sound Kit",
          producerId: String(kit.producerId || ""),
          producerName: String(kit.producerName || ""),
          downloadUrl: String(kit.downloadUrl || "")
        });

        alert("Added to cart ✅");
      };

      // Preview button
      const previewBtn = $("previewBtn");
      if(previewBtn && kit.previewUrl){
        let isPlaying = false;
        let audio = new Audio(kit.previewUrl);
        audio.preload = "metadata";
        
        previewBtn.onclick = async () => {
          if(isPlaying){
            audio.pause();
            isPlaying = false;
            previewBtn.classList.remove("playing");
          } else {
            try{
              await audio.play();
              isPlaying = true;
              previewBtn.classList.add("playing");
            }catch(e){
              console.error(e);
            }
          }
        };
        
        audio.onended = () => {
          isPlaying = false;
          previewBtn.classList.remove("playing");
        };
      }

      status.classList.add("hidden");
      card.classList.remove("hidden");
    }catch(err){
      console.error(err);
      const code = err?.code ? String(err.code) : "";
      const msg = err?.message ? String(err.message) : String(err || "");
      status.textContent =
        "Load failed.\n\n" +
        (code ? ("Code: " + code + "\n") : "") +
        "Message: " + msg + "\n\n" +
        "Check that producerId and producerName exist in your Firestore doc.";
    }
  }

  window.addEventListener("firebase-ready", () => {
    if (window.FB?.db) load();
  });
</script>

</body>
</html>
