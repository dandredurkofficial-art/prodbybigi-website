<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8"/>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>
Audiory Help Center
</title>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
/>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
/>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#020617;
  color:white;
  font-family:"Inter",sans-serif;
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

.navbar{
  background:#111827;
  padding:20px;
  position:sticky;
  top:0;
  z-index:999;
}

.navInner{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:34px;
  font-weight:900;
}

.logo span{
  color:#8b5cf6;
}

.menuBtn{
  background:#8b5cf6;
  border:none;
  color:white;
  width:55px;
  height:55px;
  border-radius:14px;
  cursor:pointer;
  font-size:24px;
}

.mobileMenu{
  display:none;
  flex-direction:column;
  gap:14px;
  margin-top:20px;
}

.mobileMenu a{
  padding:14px;
  background:#1e293b;
  border-radius:14px;
}

.hero{
  padding:80px 24px;
}

.hero h1{
  font-size:60px;
  margin-bottom:20px;
}

.hero p{
  color:#94a3b8;
  max-width:700px;
  line-height:1.8;
}

.section{
  padding:24px;
}

.faqItem{
  background:#111827;
  padding:24px;
  border-radius:24px;
  margin-top:20px;
}

.faqTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.faqBody{
  display:none;
  margin-top:20px;
  color:#94a3b8;
  line-height:1.8;
}

.faqItem.open .faqBody{
  display:block;
}

.helpBtn{
  margin-top:20px;
}

.helpBtn,
.sendBtn,
.uploadBtn{
  background:#8b5cf6;
  color:white;
  border:none;
  padding:14px 20px;
  border-radius:14px;
  cursor:pointer;
  font-weight:700;
}

.contactBox{
  background:#111827;
  padding:24px;
  border-radius:24px;
}

input,
textarea{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  margin-top:16px;
  background:#1e293b;
  color:white;
}

textarea{
  min-height:180px;
}

#fileName{
  margin-top:14px;
  color:#94a3b8;
}

#previewImage{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:18px;
  margin-top:20px;
  display:none;
}

.liveChat{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9999;
}

.chatButton{
  width:70px;
  height:70px;
  border:none;
  border-radius:50%;
  background:#8b5cf6;
  color:white;
  font-size:28px;
  cursor:pointer;
}

.chatBox{
  display:none;
  width:320px;
  background:#111827;
  padding:20px;
  border-radius:24px;
  margin-bottom:16px;
}

.chatMessages{
  height:220px;
  overflow:auto;
  margin-bottom:14px;
}

.chatMsg{
  background:#1e293b;
  padding:12px;
  border-radius:14px;
  margin-bottom:10px;
}

footer{
  padding:80px 24px;
  text-align:center;
  color:#64748b;
}

@media(max-width:700px){

  .hero h1{
    font-size:42px;
  }

  .chatBox{
    width:calc(100vw - 40px);
  }

}

</style>

</head>

<body>

<nav class="navbar">

  <div class="navInner">

    <div class="logo">
      Audio<span>ry</span>
    </div>

    <button
      class="menuBtn"
      id="menuBtn"
    >
      ☰
    </button>

  </div>

  <div
    class="mobileMenu"
    id="mobileMenu"
  >

    <a href="/">
      Home
    </a>

    <a href="/marketplace/">
      Marketplace
    </a>

    <a href="/pricing/">
      Pricing
    </a>

  </div>

</nav>



<section class="hero">

  <h1>
    Audiory Help Center
  </h1>

  <p>
    Support for producers and buyers.
  </p>

</section>



<section class="section">

  <h2>
    Frequently Asked Questions
  </h2>

  <div class="faqItem">

    <div class="faqTop">

      <h3>
        How do uploads work?
      </h3>

      <span>
        +
      </span>

    </div>

    <div class="faqBody">

      Upload beats directly from your dashboard.

      <br><br>

      <button class="helpBtn">
        👍 Helpful
      </button>

    </div>

  </div>

</section>



<section class="section">

  <div class="contactBox">

    <h2>
      Create Support Ticket
    </h2>

    <input
      id="name"
      placeholder="Your Name"
    />

    <input
      id="email"
      placeholder="Email"
    />

    <textarea
      id="message"
      placeholder="Describe your issue..."
    ></textarea>

    <br><br>

    <label
      class="uploadBtn"
      for="screenshot"
    >
      Upload Screenshot
    </label>

    <input
      type="file"
      id="screenshot"
      hidden
    />

    <div id="fileName">
      No screenshot selected
    </div>

    <img id="previewImage"/>

    <br>

    <button
      class="sendBtn"
      id="sendTicketBtn"
    >
      Send Ticket
    </button>

    <div
      id="status"
      style="margin-top:20px;"
    ></div>

  </div>

</section>



<div class="liveChat">

  <div
    class="chatBox"
    id="chatBox"
  >

    <div class="chatMessages">

      <div class="chatMsg">
        👋 Welcome to Audiory Support
      </div>

    </div>

    <input
      id="chatInput"
      placeholder="Type message..."
    />

    <br><br>

    <button
      class="sendBtn"
      id="sendChatBtn"
    >
      Send
    </button>

  </div>

  <button
    class="chatButton"
    id="chatToggle"
  >
    💬
  </button>

</div>



<footer>

© 2026 Audiory

</footer>



<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

  apiKey:
  "YOUR_API_KEY",

  authDomain:
  "YOUR_AUTH_DOMAIN",

  projectId:
  "YOUR_PROJECT_ID",

  storageBucket:
  "YOUR_STORAGE_BUCKET",

  messagingSenderId:
  "YOUR_SENDER_ID",

  appId:
  "YOUR_APP_ID"

};



const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);



// MOBILE MENU

const menuBtn =
  document.getElementById("menuBtn");

const mobileMenu =
  document.getElementById("mobileMenu");

menuBtn.addEventListener("click",()=>{

  if(
    mobileMenu.style.display ===
    "flex"
  ){

    mobileMenu.style.display =
      "none";

  }

  else{

    mobileMenu.style.display =
      "flex";

  }

});



// FAQ

document
.querySelectorAll(".faqTop")
.forEach((faq)=>{

  faq.addEventListener("click",()=>{

    faq.parentElement
    .classList.toggle("open");

  });

});



// HELPFUL

document
.querySelectorAll(".helpBtn")
.forEach((button)=>{

  button.addEventListener("click",()=>{

    button.innerHTML =
      "✅ Thanks";

  });

});



// CHAT TOGGLE

const chatToggle =
  document.getElementById("chatToggle");

const chatBox =
  document.getElementById("chatBox");

chatToggle.addEventListener("click",()=>{

  if(
    chatBox.style.display ===
    "block"
  ){

    chatBox.style.display =
      "none";

  }

  else{

    chatBox.style.display =
      "block";

  }

});



// SCREENSHOT PREVIEW

const screenshot =
  document.getElementById("screenshot");

const fileName =
  document.getElementById("fileName");

const previewImage =
  document.getElementById("previewImage");

screenshot.addEventListener("change",()=>{

  const file =
    screenshot.files[0];

  if(file){

    fileName.innerHTML =
      file.name;

    previewImage.src =
      URL.createObjectURL(file);

    previewImage.style.display =
      "block";

  }

});



// SEND TICKET

const sendTicketBtn =
  document.getElementById("sendTicketBtn");

sendTicketBtn.addEventListener("click", async()=>{

  const name =
    document.getElementById("name").value;

  const email =
    document.getElementById("email").value;

  const message =
    document.getElementById("message").value;

  if(
    !name ||
    !email ||
    !message
  ){

    alert("Please fill all fields");

    return;

  }

  try{

    await addDoc(
      collection(db,"supportMessages"),
      {

        name,
        email,
        message,

        createdAt:
        serverTimestamp()

      }
    );

    document.getElementById("status")
    .innerHTML =
    "✅ Ticket Sent";

  }

  catch(error){

    console.error(error);

    document.getElementById("status")
    .innerHTML =
    "❌ Failed";

  }

});



// CHAT SEND

const sendChatBtn =
  document.getElementById("sendChatBtn");

sendChatBtn.addEventListener("click",()=>{

  const input =
    document.getElementById("chatInput");

  const text =
    input.value.trim();

  if(!text) return;

  const messages =
    document.querySelector(".chatMessages");

  const div =
    document.createElement("div");

  div.className =
    "chatMsg";

  div.innerHTML =
    "🧑 " + text;

  messages.appendChild(div);

  input.value = "";

});

</script>

</body>
</html>
