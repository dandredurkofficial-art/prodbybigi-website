<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Audiory Support Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      margin:0;
      font-family:system-ui;
      background:#0e111a;
      color:white;
      display:flex;
      height:100vh;
    }

    .sidebar {
      width:340px;
      border-right:1px solid rgba(255,255,255,.1);
      overflow:auto;
    }

    .thread {
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.05);
      cursor:pointer;
    }

    .thread:hover {
      background:rgba(255,255,255,.05);
    }

    .main {
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .messages {
      flex:1;
      overflow:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .bubble {
      padding:10px 14px;
      border-radius:12px;
      max-width:70%;
      line-height:1.5;
    }

    .user {
      background:#1f2937;
      align-self:flex-start;
    }

    .admin {
      background:#2563eb;
      align-self:flex-end;
    }

    .replyBox {
      padding:14px;
      border-top:1px solid rgba(255,255,255,.1);
      display:flex;
      gap:10px;
    }

    textarea {
      flex:1;
      padding:10px;
      border-radius:10px;
      border:0;
      resize:none;
      min-height:60px;
    }

    button {
      background:#22c55e;
      border:0;
      padding:10px 16px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    .topbar {
      padding:12px;
      border-bottom:1px solid rgba(255,255,255,.1);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .loginBtn {
      background:#2563eb;
    }
  </style>
</head>
<body>

<div class="sidebar" id="threadList"></div>

<div class="main">
  <div class="topbar">
    <div><strong>Audiory Support Admin</strong></div>
    <button class="loginBtn" id="loginBtn">Login</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="replyBox">
    <textarea id="replyInput" placeholder="Type reply..."></textarea>
    <button id="sendReply">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

// 🔥 PASTE SAME FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentThread = null;

// Login
document.getElementById("loginBtn").onclick = async () => {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
};

// Load threads
async function loadThreads() {
  const snapshot = await getDocs(collection(db, "supportThreads"));
  const list = document.getElementById("threadList");
  list.innerHTML = "";

  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const div = document.createElement("div");
    div.className = "thread";
    div.innerHTML = `
      <strong>${data.name || "Unknown"}</strong><br/>
      <small>${data.email || ""}</small>
    `;
    div.onclick = () => openThread(docSnap.id);
    list.appendChild(div);
  });
}

function openThread(threadId) {
  currentThread = threadId;
  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";

  const q = query(
    collection(db, "supportThreads", threadId, "messages"),
    orderBy("createdAt")
  );

  onSnapshot(q, snapshot => {
    messagesDiv.innerHTML = "";
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const bubble = document.createElement("div");
      bubble.className = "bubble " + (data.sender === "admin" ? "admin" : "user");
      bubble.innerText = data.message;
      messagesDiv.appendChild(bubble);
    });
  });
}

document.getElementById("sendReply").onclick = async () => {
  const text = document.getElementById("replyInput").value;
  if (!text || !currentThread) return;

  await addDoc(
    collection(db, "supportThreads", currentThread, "messages"),
    {
      sender: "admin",
      message: text,
      createdAt: new Date()
    }
  );

  document.getElementById("replyInput").value = "";
};

onAuthStateChanged(auth, user => {
  if (user) loadThreads();
});
</script>

</body>
</html>
