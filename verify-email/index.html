<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email | Audiory</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2f7 0%, #ffffff 100%);
      color: #1e293b;
      font-family: Inter, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 36px 28px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    p {
      color: #64748b;
      line-height: 1.6;
      margin: 0 0 16px;
      font-size: 15px;
    }
    /* Distinct Search-bar mimicking container styling */
    .email-wrapper {
      position: relative;
      background: #3b30b2; /* Deep brand blue behind the main text badge */
      border-radius: 20px;
      padding-bottom: 5px;
      margin: 20px 0;
    }
    .email {
      padding: 14px 16px;
      border-radius: 18px;
      background: #ffffff;
      border: 2px solid #3b30b2;
      font-weight: 700;
      color: #0f172a;
      word-break: break-word;
      font-size: 16px;
      position: relative;
      top: -1px;
    }
    .state {
      margin: 12px 0 20px;
      font-weight: 700;
      font-size: 15px;
    }
    .actions {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    button, a.btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .primary {
      background: #3b30b2; /* Navbar dark blue */
      color: #ffffff;
    }
    .primary:hover {
      background: #2e2496;
    }
    .secondary {
      background: #ffffff;
      color: #3b30b2;
      border: 2px solid #3b30b2;
    }
    .secondary:hover {
      background: #f1f0fc;
    }
    .danger {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .danger:hover {
      background: #e2e8f0;
      color: #334155;
    }
    button[disabled] {
      opacity: .65;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      min-height: 20px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    /* Status Colors tailored for White theme background */
    .ok { color: #16a34a !important; font-weight: 600; }
    .bad { color: #dc2626 !important; font-weight: 600; }
    .warn { color: #b45309 !important; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="pageTitle">Verify Email</h1>
    <p id="pageIntro">We sent a verification link to this email address.</p>

    <div class="email" id="verifyEmailText">Loading...</div>
    <div class="state" id="verifyState">Checking...</div>

    <p id="pageHelp">
      Please check your inbox for the verification email and click the link inside. If it is not there, check your spam or junk folder, then return here and tap refresh.
    </p>

    <div class="actions">
      <button class="primary" id="refreshBtn" type="button">I Verified, Refresh</button>
      <button class="secondary" id="resendBtn" type="button">Resend Verification Email</button>
      <button class="danger" id="logoutBtn" type="button">Back to Login</button>
    </div>

    <div id="status"></div>
  </div>

  <script type="module" src="/auth-ui.js"></script>

  <script type="module">
    import "/js/firebase.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const emailText = document.getElementById("verifyEmailText");
    const verifyState = document.getElementById("verifyState");
    const refreshBtn = document.getElementById("refreshBtn");
    const resendBtn = document.getElementById("resendBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const statusEl = document.getElementById("status");
    const pageTitle = document.getElementById("pageTitle");
    const pageIntro = document.getElementById("pageIntro");
    const pageHelp = document.getElementById("pageHelp");

    function setStatus(msg, type = ""){
      if (!statusEl) return;
      statusEl.className = "";
      statusEl.id = "status";
      if (type) statusEl.classList.add(type);
      statusEl.textContent = msg || "";
    }

    function getNextUrl(){
      try{
        const u = new URL(location.href);
        const next = (u.searchParams.get("next") || "").trim();
        if (next.startsWith("/")) return next;
      }catch{}
      return "/login/?verified=1";
    }

    function getTokenParams(){
      try{
        const u = new URL(location.href);
        return {
          token: (u.searchParams.get("token") || "").trim(),
          email: (u.searchParams.get("email") || "").trim()
        };
      }catch{
        return { token: "", email: "" };
      }
    }

    function setLinkProcessingUI(){
      if (pageTitle) pageTitle.textContent = "Verifying Email";
      if (pageIntro) pageIntro.textContent = "Please wait while we confirm your email address.";
      if (pageHelp) pageHelp.textContent = "This usually takes a few seconds.";
      if (emailText) emailText.textContent = "Verification link detected...";
      if (verifyState) {
        verifyState.textContent = "⏳ Processing verification link";
        verifyState.style.color = "#fde68a";
      }
      if (refreshBtn) refreshBtn.style.display = "none";
      if (resendBtn) resendBtn.style.display = "none";
      setStatus("Processing verification link...", "warn");
    }

    function setWaitingUI(user){
      if (pageTitle) pageTitle.textContent = "Verify Email";
      if (pageIntro) pageIntro.textContent = "We sent a verification link to this email address.";
      if (pageHelp) pageHelp.textContent = "Please check your inbox for the verification email and click the link inside. If it is not there, check your spam or junk folder, then return here and tap refresh.";
      if (refreshBtn) refreshBtn.style.display = "";
      if (resendBtn) resendBtn.style.display = "";

      if (emailText) {
        emailText.textContent = user?.email || "No email found";
      }

      if (verifyState) {
        verifyState.textContent = "⏳ Not verified yet";
        verifyState.style.color = "#fde68a";
      }

      setStatus("");
    }

    function setVerifiedUI(message = "Email verified successfully. Redirecting..."){
      if (pageTitle) pageTitle.textContent = "Email Verified";
      if (pageIntro) pageIntro.textContent = "Your email has been verified successfully.";
      if (pageHelp) pageHelp.textContent = "Redirecting you now...";
      if (verifyState) {
        verifyState.textContent = "✅ Email verified";
        verifyState.style.color = "#86efac";
      }
      if (refreshBtn) refreshBtn.style.display = "none";
      if (resendBtn) resendBtn.style.display = "none";
      setStatus(message, "ok");
    }

    function setFailedUI(message){
      if (pageTitle) pageTitle.textContent = "Verification Failed";
      if (pageIntro) pageIntro.textContent = "This verification link could not be completed.";
      if (pageHelp) pageHelp.textContent = "You can login and request a new verification email.";
      if (verifyState) {
        verifyState.textContent = "❌ Verification failed";
        verifyState.style.color = "#fca5a5";
      }
      if (emailText) {
        emailText.textContent = "Invalid or expired verification link";
      }
      if (refreshBtn) refreshBtn.style.display = "none";
      if (resendBtn) resendBtn.style.display = "";
      setStatus(message || "Verification failed.", "bad");
    }

    async function refreshUI(user){
      if (!user) {
        if (emailText) emailText.textContent = "Please login to continue";
        if (verifyState) {
          verifyState.textContent = "Waiting for login";
          verifyState.style.color = "#fde68a";
        }
        setStatus("");
        return;
      }

      if (emailText) {
        emailText.textContent = user.email || "No email found";
      }

      if (user.emailVerified === true) {
        setVerifiedUI();
        setTimeout(() => {
          location.replace(getNextUrl());
        }, 900);
        return;
      }

      setWaitingUI(user);
    }

    async function handleCustomVerificationLink(){
      const { token, email } = getTokenParams();
      if (!token || !email) return false;

      setLinkProcessingUI();

      try{
        await window.verifyEmailByToken(token, email);

        if (emailText) {
          emailText.textContent = email;
        }

        setVerifiedUI("✅ Email verified successfully");

        setTimeout(async () => {
          try {
            const currentUser = window.FB?.auth?.currentUser;

            if (currentUser) {
              const userSnap = await window.FB.getDoc(
                window.FB.doc(window.FB.db, "users", currentUser.uid)
              );

              const role = userSnap.exists()
                ? String(userSnap.data()?.role || "").toLowerCase()
                : "";

              if (role === "producer") {
                location.replace("/dashboard/");
                return;
              }

              if (role === "buyer") {
                location.replace("/buyer-dashboard/");
                return;
              }
            }

            location.replace("/login/?verified=1");
          } catch (e) {
            console.error("Post verification redirect failed:", e);
            location.replace("/login/?verified=1");
          }
        }, 1200);

      } catch (err){
        console.error("verifyEmailByToken failed:", err);
        setFailedUI(err?.message || "This verification link is invalid or expired.");
      }

      return true;
    }

    refreshBtn?.addEventListener("click", async () => {
      const user = window.FB?.auth?.currentUser;
      if (!user) {
        location.replace("/login/");
        return;
      }

      refreshBtn.disabled = true;
      setStatus("Checking verification status...", "warn");

      try{
        await window.refreshVerificationStatus?.();
      } catch (err){
        console.error(err);
        setStatus(err?.message || "Could not refresh verification status.", "bad");
      } finally {
        refreshBtn.disabled = false;
      }
    });

    resendBtn?.addEventListener("click", async () => {
      if (typeof window.resendVerificationEmail === "function") {
        resendBtn.disabled = true;
        setStatus("Sending verification email...", "warn");

        try{
          await window.resendVerificationEmail();
          setStatus("✅ Verification email sent again. Check your inbox.", "ok");
        } catch (err){
          console.error(err);
          setStatus(err?.message || "Could not resend verification email.", "bad");
        } finally {
          resendBtn.disabled = false;
        }
      }
    });

    logoutBtn?.addEventListener("click", async () => {
      try{
        await signOut(window.FB.auth);
      } catch (e) {
        console.warn("signOut failed:", e);
      }
      location.replace("/login/");
    });

    window.addEventListener("firebase-ready", async () => {
      const handled = await handleCustomVerificationLink();
      if (handled) return;

      onAuthStateChanged(window.FB.auth, async (user) => {
        await refreshUI(user);
      });
    }, { once: true });
  </script>
</body>
</html>
