<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buyer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#0b0d12;
  color:#fff;
  font-family:Inter;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 24px;
  border-bottom:1px solid #1d2230;
  background:#0f1219;
}
button{
  padding:10px 16px;
  border-radius:10px;
  border:none;
  background:#ff5c5c;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.container{ padding:24px; }
.card{
  background:#121726;
  border:1px solid #1d2230;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}
h2{margin:0 0 10px}
.small{color:#a9b1c7;font-size:13px}

.orders{
  display:grid;
  gap:12px;
}

.order{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px;
  border-radius:16px;
  border:1px solid #1d2230;
  background:#0f1424;
}

.cover{
  width:56px;
  height:56px;
  border-radius:14px;
  overflow:hidden;
  flex:0 0 auto;
  background:#111827;
  border:1px solid rgba(255,255,255,.06);
  display:grid;
  place-items:center;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.meta{
  min-width:0;
  flex:1;
}
.title{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sub{
  margin-top:4px;
  color:#a9b1c7;
  font-size:13px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.pill{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(43,108,255,.14);
  border:1px solid rgba(43,108,255,.25);
  font-weight:800;
  color:#dbe7ff;
  font-size:13px;
}

.right{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
}

a.dl{
  display:inline-block;
  padding:10px 14px;
  border-radius:12px;
  background:#2b6cff;
  color:#fff;
  text-decoration:none;
  font-weight:800;
  white-space:nowrap;
}
a.dl:active{opacity:.85}
</style>
</head>

<body>

<header>
  <strong>Buyer Dashboard</strong>
  <button onclick="logoutUser()">Logout</button>
</header>

<div class="container">
  <div class="card">
    <h2>Your Profile</h2>
    <p>Email: <span id="buyerEmail">Loading...</span></p>
  </div>

  <div class="card">
    <h2>Purchased Beats</h2>
    <p class="small" id="ordersStatus">Loading your orders…</p>
    <div id="ordersList" class="orders"></div>
  </div>
</div>

<script>
  window.API_BASE = "https://prodbybigi-api.onrender.com";
</script>

<script type="module" src="/js/buyer-dashboard.js"></script>

</body>
</html>
