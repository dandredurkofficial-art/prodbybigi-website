<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buyer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#0b0d12;
  color:#fff;
  font-family:Inter;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 24px;
  border-bottom:1px solid #1d2230;
  background:#0f1219;
}
button{
  padding:10px 16px;
  border-radius:10px;
  border:none;
  background:#ff5c5c;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.container{
  padding:24px;
}
.card{
  background:#121726;
  border:1px solid #1d2230;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}
h2{margin:0 0 10px}
</style>
</head>

<body>

<header>
  <strong>Buyer Dashboard</strong>
  <!-- ✅ FIXED LOGOUT -->
  <button onclick="logoutUser()">Logout</button>
</header>

<div class="container">
  <div class="card">
    <h2>Your Profile</h2>
    <p>Email: <span id="buyerEmail">Loading...</span></p>
  </div>

  <div class="card">
    <h2>Purchased Beats</h2>
    <p>No purchases yet.</p>
  </div>
</div>

<!-- ✅ AUTH + LOGOUT HANDLED HERE -->
<script type="module">
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyAlh6_jXAJ2Wdyfw04Ieb9NqIoa8ZziuxE",
  authDomain: "prodbybigi.firebaseapp.com",
  projectId: "prodbybigi",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// AUTH GUARD
onAuthStateChanged(auth, user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    document.getElementById("buyerEmail").textContent = user.email;
  }
});

// LOGOUT FUNCTION (GLOBAL)
window.logoutUser = async () => {
  await signOut(auth);
  window.location.href = "login.html";
};
</script>

</body>
</html>
