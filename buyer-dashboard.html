<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buyer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:#0b0d12;
  color:#fff;
  font-family:Inter;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 24px;
  border-bottom:1px solid #1d2230;
  background:#0f1219;
}
button{
  padding:10px 16px;
  border-radius:10px;
  border:none;
  background:#ff5c5c;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.container{ padding:24px; }
.card{
  background:#121726;
  border:1px solid #1d2230;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}
h2{margin:0 0 10px}
.small{color:#a9b1c7;font-size:13px}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-top:1px solid #1d2230;
}
.row:first-child{border-top:none}
a.dl{
  display:inline-block;
  padding:10px 14px;
  border-radius:10px;
  background:#2b6cff;
  color:#fff;
  text-decoration:none;
  font-weight:700;
}
a.dl:active{opacity:.85}
</style>
</head>

<body>

<header>
  <strong>Buyer Dashboard</strong>
  <button onclick="logoutUser()">Logout</button>
</header>

<div class="container">
  <div class="card">
    <h2>Your Profile</h2>
    <p>Email: <span id="buyerEmail">Loading...</span></p>
  </div>

  <div class="card">
    <h2>Purchased Beats</h2>
    <p class="small" id="ordersStatus">Loading your orders…</p>
    <div id="ordersList"></div>
  </div>
</div>

<script>
  // Your API base (same as your other pages)
  window.API_BASE = "https://prodbybigi-api.onrender.com";
</script>

<!-- Logic -->
<script type="module" src="/js/buyer-dashboard.js"></script>

</body>
</html>
