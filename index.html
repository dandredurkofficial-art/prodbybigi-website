<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ProdByBigi | Your First Hit Starts Here</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">ProdByBigi</div>

  <nav class="nav-links">
    <a class="active" href="index.html">Home</a>
    <a href="marketplace.html">Feed</a>
    <a href="login.html">Login</a>
    <a class="cta" href="register.html">Start Selling</a>
  </nav>

  <div class="hamburger" id="hamburger">☰</div>
</header>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
  <a href="marketplace.html">Feed</a>
  <a href="marketplace.html">Tracks</a>
  <a href="soundkits.html">Sound Kits</a>
  <a href="producers.html">Producers</a>
  <a class="cta" href="register.html">Start Selling</a>
</div>

<!-- HERO -->
<section class="hero">
  <h1>YOUR FIRST HIT STARTS HERE</h1>

  <div class="search-box">
    <input type="text" placeholder="Explore new sounds">
    <button>Search</button>
  </div>
</section>

<!-- TRENDING -->
<section class="marketplace">
  <h2>Trending Beats</h2>

  <div class="beats-grid" id="homeBeats"></div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 ProdByBigi</p>
  <div class="footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms</a>
    <a href="#">Cookies</a>
  </div>
</footer>

<!-- SCRIPTS -->
<script src="js/menu.js"></script>
<script type="module">
  import { db } from "./js/firebase.js";
  import { collection, getDocs, limit, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const grid = document.getElementById("homeBeats");
  const q = query(collection(db, "beats"), limit(4));
  const snapshot = await getDocs(q);

  snapshot.forEach((docSnap) => {
    const beat = docSnap.data();

    grid.innerHTML += `
      <div class="beat-card">
        <div class="beat-cover">
          <img src="${beat.coverUrl}">
          <button class="play" onclick="togglePlay('${beat.previewUrl}', this)">▶</button>
        </div>

        <div class="beat-meta">
          <h3>${beat.title}</h3>
          <button class="price">$${beat.price}</button>
        </div>
      </div>
    `;
  });
</script>

<script src="js/player.js"></script>
</body>
</html>
