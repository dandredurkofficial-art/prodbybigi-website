<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProdByBigi – Buy & Sell Beats</title>
  <link rel="stylesheet" href="css/home.css" />
</head>

<body>
<header class="navbar">
  <div class="nav-left">
    <span class="logo">ProdByBigi</span>
  </div>

  <nav class="nav-links">
    <a href="#">Marketplace</a>
    <a href="#">Login</a>
    <a href="#" class="cta">Get Started</a>
  </nav>

  <div class="hamburger" onclick="toggleMenu()">
    ☰
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="#">Marketplace</a>
  <a href="#">Login</a>
  <a href="#" class="cta">Get Started</a>
</div>

<section class="hero">
  <h1>Sell Beats. Build a Brand.<br />Get Paid.</h1>
  <p>The next-generation marketplace for producers & artists.</p>

  <div class="hero-actions">
    <button class="primary">Browse Beats</button>
    <button class="secondary">Start Selling</button>
  </div>
</section>

<section class="beats">
  <h2>Trending Beats</h2>

  <div class="beat-grid">

    <!-- Beat Card -->
    <div class="beat-card">
      <div class="beat-art">
        <button class="play-btn">▶</button>
      </div>
      <div class="beat-info">
        <div>
          <h3>Midnight Drip</h3>
          <span>Prod. Bigi</span>
        </div>
        <button class="buy">$39</button>
      </div>
    </div>

    <div class="beat-card">
      <div class="beat-art">
        <button class="play-btn">▶</button>
      </div>
      <div class="beat-info">
        <div>
          <h3>Cold Streets</h3>
          <span>Prod. Bigi</span>
        </div>
        <button class="buy">$29</button>
      </div>
    </div>

    <div class="beat-card">
      <div class="beat-art">
        <button class="play-btn">▶</button>
      </div>
      <div class="beat-info">
        <div>
          <h3>Dark Therapy</h3>
          <span>Prod. Bigi</span>
        </div>
        <button class="buy">$49</button>
      </div>
    </div>

  </div>
</section>

<script>
function toggleMenu() {
  document.getElementById("mobileMenu").classList.toggle("open");
}
</script>
</body>
</html>
