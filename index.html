<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProdByBigi</title>
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/marketplace.css" />
</head>
<body>

<header>
  <button class="menu-btn">☰</button>
  <h1>ProdByBigi</h1>
</header>

<nav class="mobile-menu">
  <a href="/marketplace.html">Marketplace</a>
</nav>

<section class="hero">
  <h2>Your first hit starts here</h2>
  <input class="search" placeholder="Explore new sounds…" />
</section>

<section class="trending">
  <h3>Trending Beats</h3>
  <div class="trending-grid" id="trendingGrid"></div>
</section>

<script type="module">
  import { fetchBeats } from "/js/firebase.js";

  const grid = document.getElementById("trendingGrid");

  fetchBeats(5).then(beats => {
    beats.forEach(b => {
      grid.innerHTML += `
        <div class="beat-card">
          <img src="${b.artwork}">
          <div class="beat-info">
            <strong>${b.title}</strong><br>
            <button class="play-btn" data-audio="${b.audioUrl}">▶ Play</button>
          </div>
        </div>
      `;
    });
  });
</script>

<script src="/js/menu.js"></script>
<script src="/js/player.js"></script>
</body>
</html>
