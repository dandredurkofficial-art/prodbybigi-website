<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiory - Top Charting Beats</title>
    <style>
        /* CSS STYLING - MATCHING THE FIRST SCREENSHOT */
        :root {
            --primary-bg: #2d2a9e; /* Purple Navbar */
            --body-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #777777;
            --btn-blue: #2563eb;
            --btn-hover: #1d4ed8;
            --card-shadow: rgba(0, 0, 0, 0.05) 0px 4px 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--body-bg);
            color: var(--text-main);
        }

        /* Navbar Styling */
        header {
            background-color: var(--primary-bg);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav ul li a:hover {
            color: white;
        }

        .auth-cart {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .auth-cart a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .cart-icon {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #2563eb;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }

        /* Main Container */
        main {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 40px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-header h2 {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .see-all {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        /* Beats Grid Layout */
        .beats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        /* Card Component */
        .beat-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .image-container {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio square */
            border-radius: 12px;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        .play-btn svg {
            fill: white;
            width: 14px;
            height: 14px;
            margin-left: 2px;
        }

        .beat-info {
            padding: 15px 2px;
        }

        .beat-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .producer-team {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .verified-badge {
            width: 14px;
            height: 14px;
            fill: #eab308; /* Yellow badge color */
        }

        .price-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .price-btn:hover {
            background-color: var(--btn-hover);
        }

        .price-btn svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        /* Loading / Error states */
        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-nav">
            <div class="logo">Audior<span style="color: #fff;">y</span></div>
            <nav>
                <ul>
                    <li><a href="#">Feed</a></li>
                    <li><a href="#">Tracks</a></li>
                    <li><a href="#">Free Beats</a></li>
                    <li><a href="#">Sound Kits</a></li>
                    <li><a href="#">Producers</a></li>
                    <li><a href="#">Pricing</a></li>
                    <li><a href="#">Premieres</a></li>
                    <li><a href="#">Collabs</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Dashboard</a></li>
                </ul>
            </nav>
        </div>
        <div class="auth-cart">
            <a href="#">Sign out</a>
            <div class="cart-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="cart-count">0</span>
            </div>
        </div>
    </header>

    <main>
        <div class="section-header">
            <h2>Top Charting Beats</h2>
            <a href="#" class="see-all">See all &rarr;</a>
        </div>

        <div class="beats-grid" id="beatsContainer">
            <div class="status-msg">Loading latest beats...</div>
        </div>
    </main>

    <script type="module">
        // Import the components you need from the Web SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Replace this configuration object with your actual Firebase Project config snippet
        const firebaseConfig = {
            apiKey: "AIzaSyCmsFTjDryYOTddWfScTKsnrs0cWAHnpdc",
            authDomain: "audiory-beat-store.firebaseapp.com",
            projectId: "audiory-beat-store",
            storageBucket: "audiory-beat-store.firebasestorage.app",
            messagingSenderId: "688272560511",
            appId: "1:688272560511:web:9031e6ce215d6f08764a4a",
            measurementId: "G-GLYGWQGS26"
        };

        // Initialize Firebase and Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fetch Data Directly from Firestore
        async function fetchBeatsFromFirestore() {
            const container = document.getElementById('beatsContainer');
            
            try {
                // Connects directly to your database "beats" collection
                const querySnapshot = await getDocs(collection(db, "beats"));
                
                // Clear the loading message
                container.innerHTML = '';

                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="status-msg">No beats found in your database.</div>';
                    return;
                }

                // Render out database items dynamically
                querySnapshot.forEach((doc) => {
                    const beat = doc.data();
                    const card = document.createElement('div');
                    card.className = 'beat-card';

                    card.innerHTML = `
                        <div class="image-container">
                            <img src="${beat.imageUrl || 'https://via.placeholder.com/250'}" alt="${beat.title}">
                            <button class="play-btn" data-audio="${beat.audioUrl || '#'}">
                                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                        </div>
                        <div class="beat-info">
                            <h3 class="beat-title">${beat.title || 'Untitled Beat'}</h3>
                            <div class="producer-team">
                                <span>${beat.producerName || 'Unknown Producer'}</span>
                                ${beat.isVerified ? `
                                <svg class="verified-badge" viewBox="0 0 24 24">
                                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                </svg>` : ''}
                            </div>
                            <button class="price-btn">
                                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                                $${beat.price ? parseFloat(beat.price).toFixed(2) : '0.00'}
                            </button>
                        </div>
                    `;
                    
                    // Attach audio click listener dynamically to stay module-safe
                    card.querySelector('.play-btn').addEventListener('click', (e) => {
                        const url = e.currentTarget.getAttribute('data-audio');
                        console.log("Playing audio track path:", url);
                    });

                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Firestore database connection failed:", error);
                container.innerHTML = `<div class="status-msg" style="color: red;">Database connection error. Confirm your firebaseConfig structure and security rules.</div>`;
            }
        }

        // Run the fetch once DOM loads
        document.addEventListener('DOMContentLoaded', fetchBeatsFromFirestore);
    </script>
</body>
</html>
